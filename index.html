<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>KArena</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden}
#game-container{position:relative;width:960px;height:540px;background:#000;font-family:monospace;overflow:hidden;border:2px solid #0f0;flex-shrink:0}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:0;left:0;width:100%;pointer-events:none;z-index:5}
#scoreboard{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:20px}
.score-box{background:rgba(0,0,0,.8);border:1px solid #0f0;color:#0f0;padding:6px 16px;font-size:18px;font-weight:bold;min-width:80px;text-align:center}
.score-box.red{border-color:#f00;color:#f00}
.score-label{font-size:9px;display:block;margin-top:2px;opacity:.7}
#hp-bar{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);width:220px;height:18px;background:#111;border:1px solid #0f0}
#hp-fill{height:100%;background:#0f0}
#hp-text{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);color:#0f0;font-size:11px;font-weight:bold}
#start-screen{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:20}
#start-title{font-size:48px;color:#0f0;margin-bottom:30px;text-shadow:0 0 20px #0f0}
.weapon-select{display:flex;gap:20px;margin-bottom:20px}
.weapon-btn{background:#000;color:#0f0;border:2px solid #0f0;padding:20px 40px;font-size:16px;font-weight:bold;cursor:pointer;font-family:monospace;min-width:200px}
.weapon-btn:hover{background:#0f0;color:#000}
.weapon-btn.selected{background:#0f0;color:#000}
.weapon-info{color:#8f8;font-size:12px;margin-bottom:15px;text-align:center;max-width:400px;line-height:1.6}
#start-btn{background:#0f0;color:#000;border:none;padding:15px 40px;font-size:18px;font-weight:bold;cursor:pointer;font-family:monospace}
#start-btn:hover{background:#8f8}
#final-screen{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.92);display:none;flex-direction:column;justify-content:center;align-items:center;z-index:20}
#final-title{font-size:36px;font-weight:bold;margin-bottom:20px}
#final-score{font-size:20px;color:#fff;margin-bottom:30px}
#btn-restart{background:#0f0;color:#000;border:none;padding:15px 40px;font-size:18px;font-weight:bold;cursor:pointer;font-family:monospace}
#ammo-bar{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);display:flex;gap:4px}
.ammo-pip{width:12px;height:12px;background:#0f0;border:1px solid #0f0}
.ammo-pip.empty{background:#333;border-color:#333}
#reload-msg{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);color:#fa0;font-size:14px;font-weight:bold;display:none}
#weapon-name{position:absolute;top:10px;right:10px;color:#0f0;font-size:14px;font-weight:bold}
#weapon-hint{position:absolute;bottom:10px;right:10px;color:#888;font-size:10px}
</style>
</head>
<body>
<div id="game-container">
<canvas id="gameCanvas"></canvas>
<div id="start-screen">
<div id="start-title">⚔️ KARENA ⚔️</div>
<div class="weapon-select">
<button class="weapon-btn" id="btnSniper" onclick="selectWeapon('sniper')">СНАЙПЕРКА</button>
<button class="weapon-btn" id="btnSMG" onclick="selectWeapon('smg')">ПП</button>
</div>
<div class="weapon-info" id="weaponInfo">
Выбери оружие для старта
</div>
<button id="start-btn" disabled>НАЧАТЬ ИГРУ</button>
</div>
<div id="hud">
<div id="scoreboard">
<div class="score-box" id="score-host">0<span class="score-label">ТЫ</span></div>
<div class="score-box red" id="score-client">0<span class="score-label">БОТ</span></div>
</div>
<div id="hp-bar"><div id="hp-fill" style="width:100%"></div></div>
<div id="hp-text">100 / 100</div>
<div id="ammo-bar"></div>
<div id="reload-msg">ПЕРЕЗАРЯДКА...</div>
<div id="weapon-name"></div>
<div id="weapon-hint">Колёсико — смена оружия</div>
</div>
<div id="final-screen">
<div id="final-title"></div>
<div id="final-score"></div>
<button id="btn-restart">ЕЩЁ РАЗ</button>
</div>
</div>
<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
canvas.width=960;canvas.height=540;

let gameActive=false,player,enemy,keys={},bullets=[],obstacles=[],scoreH=0,scoreC=0;
let selectedWeapon=null;

const WEAPONS={
  sniper:{
    name:'СНАЙПЕРКА',
    damage:50,
    maxAmmo:3,
    reloadTime:5000,
    fireRate:2000,
    spread:0,
    color:'#ff0'
  },
  smg:{
    name:'ПП',
    damage:15,
    maxAmmo:50,
    reloadTime:5000,
    fireRate:500,
    spread:0.2,
    color:'#f0f'
  }
};

const WEAPON_ORDER=['sniper','smg'];

const MAX_SCORE=5,MAX_HP=100,SPD=3,BSPD=8,BR=4;

function selectWeapon(weapon){
  selectedWeapon=weapon;
  document.getElementById('btnSniper').classList.toggle('selected',weapon==='sniper');
  document.getElementById('btnSMG').classList.toggle('selected',weapon==='smg');
  document.getElementById('start-btn').disabled=false;
  
  const w=WEAPONS[weapon];
  const info=weapon==='sniper'
    ?'🎯 Урон: 50 | Патроны: 3 | Скорострельность: 2 сек<br>📏 Без разброса, высокая точность'
    :'🔫 Урон: 15 | Патроны: 50 | Скорострельность: 0.5 сек<br>📈 Есть разброс, высокая скорострельность';
  document.getElementById('weaponInfo').innerHTML=info;
}

function switchWeapon(){
  if(!gameActive||!player.alive)return;
  const idx=WEAPON_ORDER.indexOf(player.weapon);
  const nextIdx=(idx+1)%WEAPON_ORDER.length;
  const nextWeapon=WEAPON_ORDER[nextIdx];
  
  player.weapon=nextWeapon;
  const w=WEAPONS[nextWeapon];
  player.ammo=w.maxAmmo;
  player.reloading=false;
  document.getElementById('reload-msg').style.display='none';
  document.getElementById('weapon-name').textContent=w.name;
  updateAmmo();
}

// Смена оружия колёсиком
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  switchWeapon();
});

document.getElementById('start-btn').onclick=()=>{
  if(!selectedWeapon)return;
  document.getElementById('start-screen').style.display='none';
  startGame();
};

document.getElementById('btn-restart').onclick=()=>{
  document.getElementById('final-screen').style.display='none';
  startGame();
};

function startGame(){
  gameActive=true;
  scoreH=0;scoreC=0;bullets=[];
  
  const w=WEAPONS[selectedWeapon];
  player={
    x:200,y:270,hp:MAX_HP,alive:true,
    lastShot:0,ammo:w.maxAmmo,reloading:false,reloadEnd:0,
    weapon:selectedWeapon
  };
  
  // Бот с усиленным ПП
  enemy={
    x:760,y:270,hp:MAX_HP,alive:true,
    lastShot:0,tx:760,ty:270,moveTimer:0,
    weapon:'smg+',
    damage:20,
    fireRate:400
  };
  
  obstacles=[{x:280,y:100,w:80,h:60},{x:600,y:100,w:80,h:60},{x:280,y:380,w:80,h:60},{x:600,y:380,w:80,h:60},{x:440,y:240,w:80,h:60}];
  
  document.getElementById('weapon-name').textContent=w.name;
  updateAmmo();
  
  window.onkeydown=e=>keys[e.code]=true;
  window.onkeyup=e=>keys[e.code]=false;
  
  canvas.onmousedown=e=>{
    if(!gameActive||!player.alive||player.reloading)return;
    const now=Date.now();
    if(now-player.lastShot<w.fireRate)return;
    if(player.ammo<=0){
      startReload();
      return;
    }
    player.lastShot=now;
    player.ammo--;
    updateAmmo();
    
    const r=canvas.getBoundingClientRect();
    const mx=(e.clientX-r.left)*(canvas.width/r.width);
    const my=(e.clientY-r.top)*(canvas.height/r.height);
    const a=Math.atan2(my-player.y,mx-player.x);
    const spread=(Math.random()-0.5)*w.spread;
    bullets.push({x:player.x,y:player.y,dx:Math.cos(a+spread)*BSPD,dy:Math.sin(a+spread)*BSPD,life:80,damage:w.damage});
    
    if(player.ammo<=0)startReload();
  };
  
  gameLoop();
}

function startReload(){
  const w=WEAPONS[player.weapon];
  player.reloading=true;
  player.reloadEnd=Date.now()+w.reloadTime;
  document.getElementById('reload-msg').style.display='block';
  setTimeout(()=>{
    if(gameActive&&player.alive){
      player.ammo=w.maxAmmo;
      player.reloading=false;
      document.getElementById('reload-msg').style.display='none';
      updateAmmo();
    }
  },w.reloadTime);
}

function updateAmmo(){
  const w=WEAPONS[player.weapon];
  const bar=document.getElementById('ammo-bar');
  bar.innerHTML='';
  const displayCount=Math.min(w.maxAmmo,20);
  for(let i=0;i<displayCount;i++){
    const pip=document.createElement('div');
    pip.className='ammo-pip'+(i<player.ammo?'':' empty');
    if(w.maxAmmo>20){
      pip.style.width='6px';
      pip.style.height='6px';
    }
    bar.appendChild(pip);
  }
}

function hitObs(x,y,r){
  return obstacles.some(o=>x+r>o.x&&x-r<o.x+o.w&&y+r>o.y&&y-r<o.y+o.h);
}

function canSee(x1,y1,x2,y2){
  const steps=20;
  for(let i=0;i<=steps;i++){
    const t=i/steps;
    const x=x1+(x2-x1)*t;
    const y=y1+(y2-y1)*t;
    if(hitObs(x,y,5))return false;
  }
  return true;
}

function botAI(){
  if(!enemy.alive)return;
  
  enemy.moveTimer--;
  
  if(enemy.hp<MAX_HP*0.3){
    if(enemy.moveTimer<=0){
      enemy.moveTimer=30;
      const retreatX=enemy.x<canvas.width/2?100:canvas.width-100;
      const retreatY=enemy.y<canvas.height/2?100:canvas.height-100;
      enemy.tx=retreatX;
      enemy.ty=retreatY;
    }
  }
  else if(canSee(enemy.x,enemy.y,player.x,player.y)){
    if(Date.now()-enemy.lastShot>enemy.fireRate*0.7){
      enemy.lastShot=Date.now();
      const a=Math.atan2(player.y-enemy.y,player.x-enemy.x);
      bullets.push({x:enemy.x,y:enemy.y,dx:Math.cos(a)*BSPD,dy:Math.sin(a)*BSPD,life:80,enemy:true,homing:0.01,damage:enemy.damage});
    }
    
    if(enemy.moveTimer<=0){
      enemy.moveTimer=20+Math.random()*20;
      const dx=player.x-enemy.x;
      const dy=player.y-enemy.y;
      enemy.tx=enemy.x-dy*0.5;
      enemy.ty=enemy.y+dx*0.3;
      enemy.tx=Math.max(50,Math.min(canvas.width-50,enemy.tx));
      enemy.ty=Math.max(50,Math.min(canvas.height-50,enemy.ty));
    }
  }
  else{
    if(enemy.moveTimer<=0){
      enemy.moveTimer=40;
      const dx=player.x-enemy.x;
      const dy=player.y-enemy.y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      enemy.tx=enemy.x+dx/dist*100;
      enemy.ty=enemy.y+dy/dist*100;
      enemy.tx=Math.max(50,Math.min(canvas.width-50,enemy.tx));
      enemy.ty=Math.max(50,Math.min(canvas.height-50,enemy.ty));
    }
  }
  
  const dx=enemy.tx-enemy.x;
  const dy=enemy.ty-enemy.y;
  const dist=Math.sqrt(dx*dx+dy*dy);
  
  if(dist>5){
    const moveX=enemy.x+(dx/dist)*SPD*0.7;
    const moveY=enemy.y+(dy/dist)*SPD*0.7;
    
    if(!hitObs(moveX,enemy.y,12)){
      enemy.x=moveX;
    }else{
      enemy.ty+=50*(Math.random()>0.5?1:-1);
      enemy.ty=Math.max(50,Math.min(canvas.height-50,enemy.ty));
    }
    
    if(!hitObs(enemy.x,moveY,12)){
      enemy.y=moveY;
    }else{
      enemy.tx+=50*(Math.random()>0.5?1:-1);
      enemy.tx=Math.max(50,Math.min(canvas.width-50,enemy.tx));
    }
  }
  
  enemy.x=Math.max(12,Math.min(canvas.width-12,enemy.x));
  enemy.y=Math.max(12,Math.min(canvas.height-12,enemy.y));
}

function gameLoop(){
  if(!gameActive){requestAnimationFrame(gameLoop);return}
  
  const w=WEAPONS[player.weapon];
  
  if(player.reloading&&Date.now()>player.reloadEnd){
    player.ammo=w.maxAmmo;
    player.reloading=false;
    document.getElementById('reload-msg').style.display='none';
    updateAmmo();
  }
  
  if(player.alive){
    let nx=player.x,ny=player.y;
    if(keys['KeyW']||keys['ArrowUp'])ny-=SPD;
    if(keys['KeyS']||keys['ArrowDown'])ny+=SPD;
    if(keys['KeyA']||keys['ArrowLeft'])nx-=SPD;
    if(keys['KeyD']||keys['ArrowRight'])nx+=SPD;
    nx=Math.max(12,Math.min(canvas.width-12,nx));
    ny=Math.max(12,Math.min(canvas.height-12,ny));
    if(!hitObs(nx,player.y,10))player.x=nx;
    if(!hitObs(player.x,ny,10))player.y=ny;
  }
  
  botAI();
  
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    
    if(b.enemy&&b.homing&&player.alive){
      const a=Math.atan2(player.y-b.y,player.x-b.x);
      const curA=Math.atan2(b.dy,b.dx);
      const diff=a-curA;
      const turn=Math.max(-b.homing,Math.min(b.homing,diff));
      const newA=curA+turn;
      b.dx=Math.cos(newA)*BSPD;
      b.dy=Math.sin(newA)*BSPD;
    }
    
    b.x+=b.dx;b.y+=b.dy;b.life--;
    let rem=b.life<=0||b.x<0||b.x>canvas.width||b.y<0||b.y>canvas.height||hitObs(b.x,b.y,BR);
    if(!rem){
      const t=b.enemy?player:enemy;
      if(t.alive&&Math.abs(b.x-t.x)<14&&Math.abs(b.y-t.y)<14){
        rem=true;
        const dmg=b.damage||50;
        if(b.enemy){
          player.hp-=dmg;
          if(player.hp<=0){
            player.alive=false;
            scoreC++;
            setTimeout(()=>{
              if(scoreC<MAX_SCORE){
                player.x=200;player.y=270;player.hp=MAX_HP;player.alive=true;
              }
            },1500);
            checkWin();
          }
        }else{
          enemy.hp-=dmg;
          if(enemy.hp<=0){
            enemy.alive=false;
            scoreH++;
            setTimeout(()=>{
              if(scoreH<MAX_SCORE){
                enemy.x=760;enemy.y=270;enemy.hp=MAX_HP;enemy.alive=true;
              }
            },1500);
            checkWin();
          }
        }
      }
    }
    if(rem)bullets.splice(i,1);
  }
  
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle='#111';
  for(let i=0;i<canvas.width;i+=24){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,canvas.height);ctx.stroke()}
  for(let j=0;j<canvas.height;j+=24){ctx.beginPath();ctx.moveTo(0,j);ctx.lineTo(canvas.width,j);ctx.stroke()}
  
  ctx.fillStyle='#1a1a2e';
  obstacles.forEach(o=>{ctx.fillRect(o.x,o.y,o.w,o.h);ctx.strokeStyle='#333';ctx.strokeRect(o.x,o.y,o.w,o.h)});
  
  bullets.forEach(b=>{ctx.fillStyle=b.enemy?'#f0f':(b.damage===50?'#ff0':'#f0f');ctx.beginPath();ctx.arc(b.x,b.y,BR,0,Math.PI*2);ctx.fill()});
  
  if(player.alive){
    ctx.fillStyle='#0f0';
    ctx.fillRect(player.x-10,player.y-10,20,20);
    ctx.fillStyle='#fff';
    ctx.font='10px monospace';
    ctx.textAlign='center';
    ctx.fillText(Math.max(0,player.hp),player.x,player.y-16);
  }
  
  if(enemy.alive){
    ctx.fillStyle='#f00';
    ctx.fillRect(enemy.x-10,enemy.y-10,20,20);
    ctx.fillStyle='#fff';
    ctx.font='10px monospace';
    ctx.textAlign='center';
    ctx.fillText(Math.max(0,enemy.hp),enemy.x,enemy.y-16);
  }
  
  document.getElementById('hp-fill').style.width=Math.max(0,player.hp)+'%';
  document.getElementById('hp-fill').style.background=player.hp>50?'#0f0':player.hp>25?'#fa0':'#f00';
  document.getElementById('hp-text').textContent=Math.max(0,player.hp)+' / '+MAX_HP;
  
  document.getElementById('score-host').innerHTML=scoreH+'<span class="score-label">ТЫ</span>';
  document.getElementById('score-client').innerHTML=scoreC+'<span class="score-label">БОТ</span>';
  
  requestAnimationFrame(gameLoop);
}

function checkWin(){
  if(scoreH>=MAX_SCORE){
    gameActive=false;
    document.getElementById('final-title').textContent='🏆 ТЫ ПОБЕДИЛ!';
    document.getElementById('final-title').style.color='#0f0';
    document.getElementById('final-score').textContent='ТЫ '+scoreH+' : '+scoreC+' БОТ';
    document.getElementById('final-screen').style.display='flex';
  }
  if(scoreC>=MAX_SCORE){
    gameActive=false;
    document.getElementById('final-title').textContent='💀 ТЫ ПРОИГРАЛ';
    document.getElementById('final-title').style.color='#f00';
    document.getElementById('final-score').textContent='ТЫ '+scoreH+' : '+scoreC+' БОТ';
    document.getElementById('final-screen').style.display='flex';
  }
}
</script>
</body>
</html>
