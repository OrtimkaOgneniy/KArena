<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KArena</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{overflow:hidden;background:#0b1220;font-family:Arial,Helvetica,sans-serif}
canvas{display:block}

#start-screen,#final-screen{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#fff;
  background:rgba(4,8,15,.92);
}

#final-screen{display:none}

#title{
  margin-bottom:30px;
  font-size:clamp(42px,7vw,82px);
  font-weight:900;
  color:#5dff85;
  text-shadow:0 0 22px #24d84f;
}

#start-btn,#restart-btn{
  padding:15px 22px;
  border:2px solid #63ff8a;
  background:#102017;
  color:#8cffaa;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  border-radius:10px;
  transition:.15s;
}

#start-btn:hover,#restart-btn:hover{
  background:#5dff85;
  color:#092111;
  transform:translateY(-2px);
}

#message{
  margin-bottom:24px;
  max-width:520px;
  text-align:center;
  color:#e7eef9;
  line-height:1.5;
}

#hud{
  position:fixed;
  inset:0;
  z-index:10;
  pointer-events:none;
  color:#fff;
  font-weight:800;
  text-shadow:0 2px 3px #000;
}

#crosshair{
  position:absolute;
  top:50%;
  left:50%;
  width:16px;
  height:16px;
  transform:translate(-50%,-50%);
}

#crosshair:before,#crosshair:after{
  content:"";
  position:absolute;
  background:#fff;
  box-shadow:0 0 5px #000;
}

#crosshair:before{
  left:7px;
  top:0;
  width:2px;
  height:16px;
}

#crosshair:after{
  left:0;
  top:7px;
  width:16px;
  height:2px;
}

#topbar{
  position:absolute;
  left:50%;
  top:18px;
  transform:translateX(-50%);
  display:flex;
  gap:14px;
}

.score{
  min-width:110px;
  padding:10px 20px;
  text-align:center;
  background:rgba(0,0,0,.45);
  border:2px solid #57ff81;
  border-radius:8px;
  color:#70ff95;
  font-size:24px;
}

.score.bot{
  border-color:#ff5858;
  color:#ff7373;
}

#weapon-name{
  position:absolute;
  left:22px;
  top:22px;
  color:#a7ffb5;
  font-size:18px;
}

#ammo{
  position:absolute;
  right:22px;
  bottom:24px;
  color:#a7ffb5;
  font-size:26px;
}

#dash{
  position:absolute;
  left:50%;
  bottom:40px;
  transform:translateX(-50%);
  color:#75ff9b;
}

#hp-wrap{
  position:absolute;
  left:22px;
  bottom:25px;
  width:290px;
}

#enemy-hp{
  position:absolute;
  right:22px;
  top:22px;
  width:220px;
}

.hp-label{
  font-size:13px;
  margin-bottom:5px;
}

.bar{
  height:18px;
  border:2px solid #fff;
  background:rgba(0,0,0,.45);
  border-radius:5px;
  overflow:hidden;
}

#hp-fill{
  height:100%;
  width:100%;
  background:#4eff72;
  transition:width .1s;
}

#enemy-fill{
  height:100%;
  width:100%;
  background:#ff4d4d;
  transition:width .1s;
}

#damage{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:9;
  opacity:0;
  background:radial-gradient(circle,transparent 45%,rgba(255,0,0,.55) 120%);
  transition:opacity .14s;
}

#hit{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  display:none;
  color:#fff;
  font-size:42px;
  text-shadow:0 0 8px #000;
}

#reload{
  position:absolute;
  left:50%;
  bottom:74px;
  transform:translateX(-50%);
  display:none;
  color:#ffd25b;
}
</style>
</head>
<body>

<div id="start-screen">
  <div id="title">KArena</div>
  <button id="start-btn">НАЧАТЬ ИГРУ</button>
</div>

<div id="final-screen">
  <div id="title">КОНЕЦ МАТЧА</div>
  <div id="message"></div>
  <button id="restart-btn">ЕЩЁ РАЗ</button>
</div>

<div id="hud">
  <div id="crosshair"></div>
  <div id="damage"></div>
  <div id="hit">✕</div>

  <div id="topbar">
    <div class="score">
      <span id="you-score">0</span><br>
      <small>ТЫ</small>
    </div>

    <div class="score bot">
      <span id="bot-score">0</span><br>
      <small>БОТ</small>
    </div>
  </div>

  <div id="weapon-name">ПП</div>
  <div id="ammo">30 / 30</div>
  <div id="dash">РЫВОК ГОТОВ — Q</div>

  <div id="hp-wrap">
    <div class="hp-label">ТЫ: <span id="hp-text">100</span></div>
    <div class="bar"><div id="hp-fill"></div></div>
  </div>

  <div id="enemy-hp">
    <div class="hp-label">БОТ: <span id="enemy-text">100</span></div>
    <div class="bar"><div id="enemy-fill"></div></div>
  </div>

  <div id="reload">ПЕРЕЗАРЯДКА...</div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js";
import { PointerLockControls } from "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/controls/PointerLockControls.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8ed6ff);
scene.fog=new THREE.Fog(0x8ed6ff,70,180);

const camera=new THREE.PerspectiveCamera(76,innerWidth/innerHeight,.1,300);
camera.position.set(-26,4,-18);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls=new PointerLockControls(camera,document.body);
const clock=new THREE.Clock();

const keys={};
const colliders=[];
const particles=[];
const tracers=[];

const ARENA_RADIUS=42;
const PLAYER_HEIGHT=1.7;
const PLAYER_RADIUS=.65;
const BOT_RADIUS=.7;
const MAX_HP=100;
const MAX_SCORE=5;

const weapons={
  sniper:{
    name:"СНАЙПЕРКА",
    damage:50,
    scopedDamage:70,
    maxAmmo:3,
    reload:2200,
    fireRate:850,
    spread:.001,
    color:0xffd34d
  },
  smg:{
    name:"ПП",
    damage:6,
    maxAmmo:30,
    reload:1700,
    fireRate:95,
    spread:.026,
    color:0xff4ed8
  },
  shotgun:{
    name:"ДРОБОВИК",
    damage:4,
    maxAmmo:10,
    reload:1800,
    fireRate:720,
    spread:.14,
    pellets:16,
    color:0xffa54d
  }
};

const weaponOrder=["sniper","smg","shotgun"];

const state={
  active:false,
  selectedWeapon:"smg",
  scoreYou:0,
  scoreBot:0,

  player:{
    hp:100,
    ammo:30,
    reloading:false,
    reloadEnd:0,
    lastShot:0,
    dashReady:0,
    dashTime:0,
    dashDirection:new THREE.Vector3(),
    velocityY:0,
    grounded:false
  },

  bot:{
    hp:100,
    ammo:30,
    reloading:false,
    reloadEnd:0,
    lastShot:0,
    mesh:null
  }
};

const ambient=new THREE.HemisphereLight(0xc9edff,0x26342b,2.2);
scene.add(ambient);

const sun=new THREE.DirectionalLight(0xffffff,2.7);
sun.position.set(-25,45,20);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

const floorMaterial=new THREE.MeshStandardMaterial({
  color:0xd6dbe1,
  roughness:.9,
  metalness:.05
});

const wallMaterial=new THREE.MeshStandardMaterial({
  color:0x61758a,
  roughness:.72,
  metalness:.1
});

const accentMaterial=new THREE.MeshStandardMaterial({
  color:0x52a9ef,
  roughness:.5,
  metalness:.18
});

function box(x,y,z,w,h,d,material=wallMaterial,solid=true){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);

  mesh.position.set(x,y+h/2,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;

  scene.add(mesh);

  if(solid){
    colliders.push({
      minX:x-w/2,
      maxX:x+w/2,
      minZ:z-d/2,
      maxZ:z+d/2,
      top:y+h
    });
  }

  return mesh;
}

function buildArena(){
  const floor=new THREE.Mesh(
    new THREE.CylinderGeometry(ARENA_RADIUS,ARENA_RADIUS,1,80),
    floorMaterial
  );

  floor.receiveShadow=true;
  floor.position.y=-.5;
  scene.add(floor);

  const border=new THREE.Mesh(
    new THREE.TorusGeometry(ARENA_RADIUS,.7,12,80),
    new THREE.MeshStandardMaterial({
      color:0x4e6a83,
      roughness:.55
    })
  );

  border.rotation.x=Math.PI/2;
  border.position.y=.05;
  scene.add(border);

  box(0,0,0,12,5,12,wallMaterial);
  box(-8,0,0,5,3,7,accentMaterial);
  box(8,0,0,5,3,7,accentMaterial);
  box(0,5,0,5,2.5,5,wallMaterial);

  box(0,3.2,-11,4,.7,10,accentMaterial);
  box(0,3.2,11,4,.7,10,accentMaterial);
  box(-11,2.2,0,10,.7,4,accentMaterial);
  box(11,2.2,0,10,.7,4,accentMaterial);

  for(let i=0;i<5;i++){
    box(-18+i*2.1,.45+i*.65,-8,2,.45,4,wallMaterial);
    box(18-i*2.1,.45+i*.65,8,2,.45,4,wallMaterial);
  }

  box(-27,0,-22,9,3,3,wallMaterial);
  box(-27,0,22,9,3,3,wallMaterial);
  box(27,0,-22,9,3,3,wallMaterial);
  box(27,0,22,9,3,3,wallMaterial);

  box(-28,0,0,4,4,10,accentMaterial);
  box(28,0,0,4,4,10,accentMaterial);

  const cover=[
    [-18,-25],
    [18,-25],
    [-18,25],
    [18,25],
    [-8,-29],
    [8,-29],
    [-8,29],
    [8,29],
    [-32,-10],
    [32,-10],
    [-32,10],
    [32,10]
  ];

  for(const [x,z] of cover){
    box(x,0,z,4,2.6,4,wallMaterial);
  }

  for(let a=0;a<8;a++){
    const angle=a*Math.PI/4;
    const x=Math.cos(angle)*35;
    const z=Math.sin(angle)*35;

    const column=new THREE.Mesh(
      new THREE.CylinderGeometry(.7,.9,6,12),
      accentMaterial
    );

    column.position.set(x,3,z);
    column.castShadow=true;
    column.receiveShadow=true;
    scene.add(column);

    colliders.push({
      minX:x-.9,
      maxX:x+.9,
      minZ:z-.9,
      maxZ:z+.9,
      top:6
    });
  }
}

buildArena();

function createBot(){
  const group=new THREE.Group();

  const body=new THREE.Mesh(
    new THREE.BoxGeometry(1.2,1.5,.75),
    new THREE.MeshStandardMaterial({
      color:0xd93434,
      roughness:.55
    })
  );

  body.position.y=1.2;
  body.castShadow=true;
  group.add(body);

  const head=new THREE.Mesh(
    new THREE.BoxGeometry(.85,.85,.85),
    new THREE.MeshStandardMaterial({
      color:0xff9b76,
      roughness:.7
    })
  );

  head.position.y=2.35;
  head.castShadow=true;
  group.add(head);

  const visor=new THREE.Mesh(
    new THREE.BoxGeometry(.88,.22,.08),
    new THREE.MeshStandardMaterial({
      color:0x20151a,
      emissive:0x4a0000
    })
  );

  visor.position.set(0,2.42,.43);
  group.add(visor);

  const weapon=new THREE.Mesh(
    new THREE.BoxGeometry(.18,.18,1.15),
    new THREE.MeshStandardMaterial({
      color:0x22262d,
      metalness:.5,
      roughness:.3
    })
  );

  weapon.position.set(.45,1.4,.45);
  weapon.rotation.x=-.35;
  group.add(weapon);

  scene.add(group);
  return group;
}

state.bot.mesh=createBot();

function createPlayerWeapon(){
  const group=new THREE.Group();

  const gun=new THREE.Mesh(
    new THREE.BoxGeometry(.2,.2,1.3),
    new THREE.MeshStandardMaterial({
      color:0x222831,
      metalness:.7,
      roughness:.25
    })
  );

  gun.position.set(.42,-.35,-.85);
  gun.rotation.x=-.16;
  group.add(gun);

  const barrel=new THREE.Mesh(
    new THREE.CylinderGeometry(.06,.06,.7,10),
    new THREE.MeshStandardMaterial({
      color:0x111111,
      metalness:.8,
      roughness:.2
    })
  );

  barrel.rotation.x=Math.PI/2;
  barrel.position.set(.42,-.32,-1.55);
  group.add(barrel);

  camera.add(group);
  scene.add(camera);

  return group;
}

const playerGun=createPlayerWeapon();

function checkCollision(pos,radius,height){
  if(Math.hypot(pos.x,pos.z)>ARENA_RADIUS-radius-1){
    return true;
  }

  for(const c of colliders){
    const closeX=Math.max(c.minX,Math.min(pos.x,c.maxX));
    const closeZ=Math.max(c.minZ,Math.min(pos.z,c.maxZ));

    const dx=pos.x-closeX;
    const dz=pos.z-closeZ;

    if(dx*dx+dz*dz<radius*radius&&pos.y<c.top+height){
      return true;
    }
  }

  return false;
}

function groundHeight(pos){
  let highest=0;

  for(const c of colliders){
    if(
      pos.x>c.minX-PLAYER_RADIUS&&
      pos.x<c.maxX+PLAYER_RADIUS&&
      pos.z>c.minZ-PLAYER_RADIUS&&
      pos.z<c.maxZ+PLAYER_RADIUS&&
      pos.y>=c.top-.4
    ){
      highest=Math.max(highest,c.top);
    }
  }

  return highest;
}

function spawnPoint(playerSide){
  const options=playerSide
    ?[
      new THREE.Vector3(-32,0,-27),
      new THREE.Vector3(-31,0,27),
      new THREE.Vector3(-24,0,0)
    ]
    :[
      new THREE.Vector3(32,0,27),
      new THREE.Vector3(31,0,-27),
      new THREE.Vector3(24,0,0)
    ];

  return options[Math.floor(Math.random()*options.length)].clone();
}

function resetRound(){
  const playerSpawn=spawnPoint(true);
  camera.position.set(playerSpawn.x,PLAYER_HEIGHT,playerSpawn.z);

  state.player.hp=MAX_HP;
  state.player.ammo=weapons[state.selectedWeapon].maxAmmo;
  state.player.reloading=false;
  state.player.reloadEnd=0;
  state.player.velocityY=0;
  state.player.dashTime=0;
  state.player.dashReady=0;

  const enemySpawn=spawnPoint(false);
  state.bot.mesh.position.set(enemySpawn.x,0,enemySpawn.z);
  state.bot.hp=MAX_HP;
  state.bot.ammo=30;
  state.bot.reloading=false;
  state.bot.reloadEnd=0;

  updateHud();
}

document.getElementById("start-btn").addEventListener("click",()=>{
  state.selectedWeapon="smg";
  state.active=true;
  state.scoreYou=0;
  state.scoreBot=0;

  document.getElementById("start-screen").style.display="none";

  resetRound();
  updateGunModel();
  controls.lock();
});

document.getElementById("restart-btn").addEventListener("click",()=>{
  document.getElementById("final-screen").style.display="none";

  state.selectedWeapon="smg";
  state.active=true;
  state.scoreYou=0;
  state.scoreBot=0;

  resetRound();
  updateGunModel();
  controls.lock();
});

document.addEventListener("keydown",e=>{
  keys[e.code]=true;

  if(e.code==="Space"){
    e.preventDefault();
    jump();
  }

  if(e.code==="KeyQ"){
    dash();
  }

  if(e.code==="KeyR"){
    startReload();
  }
});

document.addEventListener("keyup",e=>{
  keys[e.code]=false;
});

renderer.domElement.addEventListener("mousedown",e=>{
  if(!state.active)return;

  if(!controls.isLocked){
    controls.lock();
    return;
  }

  if(e.button===0){
    shoot();
  }

  if(e.button===2&&state.selectedWeapon==="sniper"){
    e.preventDefault();
    aiming=true;
    camera.fov=35;
    camera.updateProjectionMatrix();
  }
});

renderer.domElement.addEventListener("mouseup",e=>{
  if(e.button===2){
    aiming=false;
    camera.fov=76;
    camera.updateProjectionMatrix();
  }
});

renderer.domElement.addEventListener("contextmenu",e=>e.preventDefault());

renderer.domElement.addEventListener("wheel",e=>{
  if(!state.active)return;

  e.preventDefault();

  const index=weaponOrder.indexOf(state.selectedWeapon);
  const direction=e.deltaY>0?1:-1;
  const next=(index+direction+weaponOrder.length)%weaponOrder.length;

  state.selectedWeapon=weaponOrder[next];
  state.player.ammo=weapons[state.selectedWeapon].maxAmmo;
  state.player.reloading=false;

  document.getElementById("reload").style.display="none";

  updateGunModel();
  updateHud();
},{passive:false});

function updateGunModel(){
  const weapon=state.selectedWeapon;

  if(weapon==="sniper"){
    playerGun.children[0].scale.set(1.25,1,1.6);
  }else if(weapon==="shotgun"){
    playerGun.children[0].scale.set(1.12,1,1.15);
  }else{
    playerGun.children[0].scale.set(.9,1,.85);
  }
}

function jump(){
  if(!state.active||!controls.isLocked)return;

  if(state.player.grounded){
    state.player.velocityY=8.2;
    state.player.grounded=false;
    createParticles(camera.position,0xeeeeff,12);
  }
}

function dash(){
  const now=performance.now();

  if(
    !state.active||
    !controls.isLocked||
    now<state.player.dashReady||
    state.player.dashTime>0
  ){
    return;
  }

  const direction=new THREE.Vector3();
  camera.getWorldDirection(direction);

  direction.y=0;
  direction.normalize();

  state.player.dashDirection.copy(direction);
  state.player.dashTime=.06;
  state.player.dashReady=now+3000;

  createParticles(camera.position,0x49ff7a,30);
}

function startReload(){
  const playerState=state.player;
  const weapon=weapons[state.selectedWeapon];

  if(playerState.reloading||playerState.ammo===weapon.maxAmmo)return;

  playerState.reloading=true;
  playerState.reloadEnd=performance.now()+weapon.reload;

  document.getElementById("reload").style.display="block";
}

function shoot(){
  const playerState=state.player;
  const weapon=weapons[state.selectedWeapon];
  const now=performance.now();

  if(playerState.reloading||now-playerState.lastShot<weapon.fireRate)return;

  if(playerState.ammo<=0){
    startReload();
    return;
  }

  playerState.lastShot=now;
  playerState.ammo--;

  const count=weapon.pellets||1;

  for(let i=0;i<count;i++){
    const direction=new THREE.Vector3();
    camera.getWorldDirection(direction);

    const spread=weapon.spread*(aiming?.35:1);

    direction.x+=(Math.random()-.5)*spread;
    direction.y+=(Math.random()-.5)*spread;
    direction.z+=(Math.random()-.5)*spread;

    direction.normalize();

    const speed=state.selectedWeapon==="sniper"&&aiming?75:45;

    tracers.push({
      position:camera.position.clone().add(direction.clone().multiplyScalar(.7)),
      velocity:direction.multiplyScalar(speed),
      life:.7,
      damage:state.selectedWeapon==="sniper"&&aiming
        ?weapon.scopedDamage
        :weapon.damage,
      enemy:false,
      color:weapon.color
    });
  }

  createMuzzleFlash(camera.position);

  if(playerState.ammo<=0){
    startReload();
  }

  updateHud();
}

function createMuzzleFlash(position){
  const light=new THREE.PointLight(0xffe0a0,4,8);

  light.position.copy(position);
  scene.add(light);

  setTimeout(()=>scene.remove(light),45);
}

function createParticles(position,color,count){
  for(let i=0;i<count;i++){
    const material=new THREE.MeshBasicMaterial({
      color,
      transparent:true,
      opacity:1
    });

    const particle=new THREE.Mesh(
      new THREE.SphereGeometry(.06+Math.random()*.08,6,6),
      material
    );

    particle.position.copy(position);
    particle.position.y+=Math.random()*.5;

    const velocity=new THREE.Vector3(
      (Math.random()-.5)*5,
      Math.random()*3,
      (Math.random()-.5)*5
    );

    scene.add(particle);

    particles.push({
      mesh:particle,
      velocity,
      life:.25+Math.random()*.35,
      maxLife:.6
    });
  }
}

function botTakeDamage(damage){
  state.bot.hp-=damage;

  createParticles(
    state.bot.mesh.position.clone().add(new THREE.Vector3(0,1.2,0)),
    0xff4d4d,
    18
  );

  showHit();

  if(state.bot.hp<=0){
    state.bot.hp=0;
    state.scoreYou++;
    killRound("you");
  }

  updateHud();
}

function playerTakeDamage(damage){
  state.player.hp-=damage;

  showDamage();

  if(state.player.hp<=0){
    state.player.hp=0;
    state.scoreBot++;
    killRound("bot");
  }

  updateHud();
}

function showHit(){
  const el=document.getElementById("hit");

  el.style.display="block";

  setTimeout(()=>{
    el.style.display="none";
  },90);
}

function showDamage(){
  const el=document.getElementById("damage");

  el.style.opacity="1";

  setTimeout(()=>{
    el.style.opacity="0";
  },130);
}

function killRound(winner){
  if(state.scoreYou>=MAX_SCORE||state.scoreBot>=MAX_SCORE){
    state.active=false;
    controls.unlock();

    document.getElementById("final-screen").style.display="flex";

    document.getElementById("message").textContent=
      winner==="you"
        ?`Ты победил: ${state.scoreYou} : ${state.scoreBot}`
        :`Бот победил: ${state.scoreYou} : ${state.scoreBot}`;

    return;
  }

  setTimeout(resetRound,1300);
}

function botUpdate(dt){
  if(!state.active)return;

  const bot=state.bot;
  const mesh=bot.mesh;

  const playerPos=camera.position.clone();
  playerPos.y=0;

  const toPlayer=playerPos.clone().sub(mesh.position);
  toPlayer.y=0;

  const distance=toPlayer.length();
  const now=performance.now();

  if(bot.reloading){
    if(now>=bot.reloadEnd){
      bot.reloading=false;
      bot.ammo=30;
    }else{
      const retreat=mesh.position.clone().sub(playerPos);

      if(retreat.lengthSq()>0){
        retreat.normalize();
        tryBotMove(retreat.multiplyScalar(4*dt));
      }

      return;
    }
  }

  const movement=new THREE.Vector3();

  if(bot.hp<30){
    if(distance<15){
      movement.copy(mesh.position).sub(playerPos).normalize();
    }else{
      movement.set(
        Math.sin(now*.002)*.35,
        0,
        Math.cos(now*.002)*.35
      );
    }
  }else if(distance>10){
    movement.copy(toPlayer.normalize());
  }else{
    movement.set(-toPlayer.z,0,toPlayer.x).normalize();

    if(Math.sin(now*.003)<0){
      movement.multiplyScalar(-1);
    }
  }

  tryBotMove(movement.multiplyScalar(4.2*dt));

  mesh.lookAt(playerPos.x,mesh.position.y,playerPos.z);

  if(
    distance<34&&
    now-bot.lastShot>350&&
    hasLineOfSight(mesh.position,playerPos)
  ){
    botShoot();
  }
}

function tryBotMove(delta){
  const candidate=state.bot.mesh.position.clone().add(delta);
  candidate.y=0;

  if(!checkCollision(candidate,BOT_RADIUS,2.3)){
    state.bot.mesh.position.copy(candidate);
    return;
  }

  const side=new THREE.Vector3(-delta.z,0,delta.x);

  if(side.lengthSq()===0)return;

  side.normalize().multiplyScalar(delta.length());

  for(const option of [side,side.clone().multiplyScalar(-1)]){
    const test=state.bot.mesh.position.clone().add(option);
    test.y=0;

    if(!checkCollision(test,BOT_RADIUS,2.3)){
      state.bot.mesh.position.copy(test);
      return;
    }
  }
}

function hasLineOfSight(a,b){
  const direction=b.clone().sub(a);
  const distance=direction.length();

  direction.normalize();

  const ray=new THREE.Raycaster(
    a.clone().add(new THREE.Vector3(0,1.1,0)),
    direction,
    0,
    distance
  );

  const wallMeshes=[];

  scene.traverse(obj=>{
    if(obj.isMesh&&obj.parent!==camera&&obj.parent!==state.bot.mesh){
      wallMeshes.push(obj);
    }
  });

  const hits=ray.intersectObjects(wallMeshes,false);

  return hits.length===0;
}

function botShoot(){
  const bot=state.bot;

  if(bot.ammo<=0){
    bot.reloading=true;
    bot.reloadEnd=performance.now()+2000;
    return;
  }

  bot.lastShot=performance.now();
  bot.ammo--;

  const origin=bot.mesh.position.clone().add(new THREE.Vector3(0,1.45,0));
  const target=camera.position.clone();

  const direction=target.sub(origin).normalize();

  direction.x+=(Math.random()-.5)*.018;
  direction.z+=(Math.random()-.5)*.018;
  direction.normalize();

  tracers.push({
    position:origin,
    velocity:direction.multiplyScalar(40),
    life:.9,
    damage:12,
    enemy:true,
    color:0xff4dd2
  });

  if(bot.ammo<=0){
    bot.reloading=true;
    bot.reloadEnd=performance.now()+2000;
  }
}

function updateMovement(dt){
  const playerState=state.player;
  const position=camera.position;

  if(
    playerState.reloading&&
    performance.now()>=playerState.reloadEnd
  ){
    playerState.reloading=false;
    playerState.ammo=weapons[state.selectedWeapon].maxAmmo;

    document.getElementById("reload").style.display="none";
  }

  const ground=groundHeight(position);

  playerState.velocityY-=22*dt;
  position.y+=playerState.velocityY*dt;

  if(position.y<=ground+PLAYER_HEIGHT){
    position.y=ground+PLAYER_HEIGHT;
    playerState.velocityY=0;
    playerState.grounded=true;
  }else{
    playerState.grounded=false;
  }

  const move=new THREE.Vector3();

  if(keys.KeyW||keys.ArrowUp)move.z-=1;
  if(keys.KeyS||keys.ArrowDown)move.z+=1;
  if(keys.KeyA||keys.ArrowLeft)move.x-=1;
  if(keys.KeyD||keys.ArrowRight)move.x+=1;

  if(move.lengthSq()>0){
    move.normalize();
    move.applyAxisAngle(new THREE.Vector3(0,1,0),camera.rotation.y);
  }

  const speed=aiming?5.2:8;

  if(playerState.dashTime>0){
    playerState.dashTime-=dt;
    move.copy(playerState.dashDirection).multiplyScalar(95*dt);
  }else{
    move.multiplyScalar(speed*dt);
  }

  const nextX=position.clone();
  nextX.x+=move.x;

  if(!checkCollision(nextX,PLAYER_RADIUS,PLAYER_HEIGHT)){
    position.x=nextX.x;
  }

  const nextZ=position.clone();
  nextZ.z+=move.z;

  if(!checkCollision(nextZ,PLAYER_RADIUS,PLAYER_HEIGHT)){
    position.z=nextZ.z;
  }

  if(position.y<PLAYER_HEIGHT){
    position.y=PLAYER_HEIGHT;
    playerState.velocityY=0;
  }
}

function updateProjectiles(dt){
  for(let i=tracers.length-1;i>=0;i--){
    const t=tracers[i];
    const previous=t.position.clone();

    t.position.addScaledVector(t.velocity,dt);
    t.life-=dt;

    const length=previous.distanceTo(t.position);

    const trail=new THREE.Mesh(
      new THREE.CylinderGeometry(.025,.025,length,6),
      new THREE.MeshBasicMaterial({color:t.color})
    );

    trail.position.copy(previous).lerp(t.position,.5);

    trail.quaternion.setFromUnitVectors(
      new THREE.Vector3(0,1,0),
      t.position.clone().sub(previous).normalize()
    );

    scene.add(trail);

    setTimeout(()=>{
      scene.remove(trail);
      trail.geometry.dispose();
      trail.material.dispose();
    },30);

    if(!t.enemy){
      const botPos=state.bot.mesh.position.clone()
        .add(new THREE.Vector3(0,1.2,0));

      if(t.position.distanceTo(botPos)<1.05){
        botTakeDamage(t.damage);
        tracers.splice(i,1);
        continue;
      }
    }else if(t.position.distanceTo(camera.position)<.9){
      playerTakeDamage(t.damage);
      tracers.splice(i,1);
      continue;
    }

    if(t.life<=0||checkCollision(t.position,.05,.1)){
      tracers.splice(i,1);
    }
  }
}

function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];

    p.mesh.position.addScaledVector(p.velocity,dt);
    p.velocity.y-=8*dt;
    p.life-=dt;
    p.mesh.material.opacity=Math.max(0,p.life/p.maxLife);

    if(p.life<=0){
      scene.remove(p.mesh);
      p.mesh.geometry.dispose();
      p.mesh.material.dispose();
      particles.splice(i,1);
    }
  }
}

function updateHud(){
  const playerState=state.player;
  const bot=state.bot;

  document.getElementById("you-score").textContent=state.scoreYou;
  document.getElementById("bot-score").textContent=state.scoreBot;

  document.getElementById("hp-text").textContent=Math.max(
    0,
    Math.ceil(playerState.hp)
  );

  document.getElementById("enemy-text").textContent=Math.max(
    0,
    Math.ceil(bot.hp)
  );

  document.getElementById("hp-fill").style.width=
    Math.max(0,playerState.hp)+"%";

  document.getElementById("enemy-fill").style.width=
    Math.max(0,bot.hp)+"%";

  const weapon=weapons[state.selectedWeapon];

  document.getElementById("weapon-name").textContent=weapon.name;
  document.getElementById("ammo").textContent=
    `${playerState.ammo} / ${weapon.maxAmmo}`;

  const dash=document.getElementById("dash");
  const remaining=Math.max(0,playerState.dashReady-performance.now());

  if(playerState.dashTime>0){
    dash.textContent="РЫВОК!";
    dash.style.color="#ffe85c";
  }else if(remaining<=0){
    dash.textContent="РЫВОК ГОТОВ — Q";
    dash.style.color="#75ff9b";
  }else{
    dash.textContent=`РЫВОК: ${(remaining/1000).toFixed(1)}с`;
    dash.style.color="#a0a0a0";
  }
}

function animate(){
  requestAnimationFrame(animate);

  const dt=Math.min(clock.getDelta(),.035);

  if(state.active&&controls.isLocked){
    updateMovement(dt);
    botUpdate(dt);
    updateProjectiles(dt);
    updateParticles(dt);
    updateHud();
  }

  renderer.render(scene,camera);
}

animate();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
