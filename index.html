<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>KArena</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;overflow:hidden;width:100vw;height:100vh}
#game-container{position:relative;width:100%;height:100%;background:#000;font-family:monospace;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5}
#scoreboard{position:absolute;top:20px;left:50%;transform:translateX(-50%);display:flex;gap:20px}
.score-box{background:rgba(0,0,0,.8);border:2px solid #0f0;color:#0f0;padding:10px 24px;font-size:24px;font-weight:bold;min-width:120px;text-align:center}
.score-box.red{border-color:#f00;color:#f00}
.score-label{font-size:12px;display:block;margin-top:4px;opacity:.7}
#hp-container{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);width:400px;display:flex;flex-direction:column;gap:8px}
.hp-row{display:flex;align-items:center;gap:10px}
.hp-label{color:#fff;font-size:14px;font-weight:bold;width:60px}
.hp-bar{flex:1;height:20px;background:#111;border:2px solid #0f0;position:relative}
.hp-fill{height:100%;transition:width .2s}
.hp-fill.green{background:#0f0;border:none}
.hp-fill.red{background:#f00;border-color:#f00}
.hp-text{color:#fff;font-size:14px;font-weight:bold;width:50px;text-align:right}
#start-screen{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:20}
#start-title{font-size:64px;color:#0f0;margin-bottom:40px;text-shadow:0 0 20px #0f0}
.weapon-select{display:flex;gap:30px;margin-bottom:30px}
.weapon-btn{background:#000;color:#0f0;border:3px solid #0f0;padding:25px 50px;font-size:20px;font-weight:bold;cursor:pointer;font-family:monospace;min-width:250px}
.weapon-btn:hover{background:#0f0;color:#000}
.weapon-btn.selected{background:#0f0;color:#000}
.weapon-info{color:#8f8;font-size:14px;margin-bottom:20px;text-align:center;max-width:500px;line-height:1.6}
#start-btn{background:#0f0;color:#000;border:none;padding:20px 50px;font-size:22px;font-weight:bold;cursor:pointer;font-family:monospace}
#start-btn:hover{background:#8f8}
#final-screen{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.92);display:none;flex-direction:column;justify-content:center;align-items:center;z-index:20}
#final-title{font-size:48px;font-weight:bold;margin-bottom:30px}
#final-score{font-size:28px;color:#fff;margin-bottom:40px}
#btn-restart{background:#0f0;color:#000;border:none;padding:20px 50px;font-size:22px;font-weight:bold;cursor:pointer;font-family:monospace}
#ammo-bar{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);display:flex;gap:4px}
.ammo-pip{width:10px;height:10px;background:#0f0;border:1px solid #0f0}
.ammo-pip.empty{background:#333;border-color:#333}
#reload-msg{position:absolute;bottom:130px;left:50%;transform:translateX(-50%);color:#fa0;font-size:16px;font-weight:bold;display:none}
#weapon-name{position:absolute;top:20px;right:20px;color:#0f0;font-size:18px;font-weight:bold}
#weapon-hint{position:absolute;bottom:20px;right:20px;color:#888;font-size:12px}
#scope-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle,transparent 200px,rgba(0,0,0,.9) 500px);pointer-events:none;display:none;z-index:15}
#recoil-indicator{position:absolute;top:60px;right:20px;color:#fa0;font-size:12px;display:none}
</style>
</head>
<body>
<div id="game-container">
<canvas id="gameCanvas"></canvas>
<div id="scope-overlay"></div>
<div id="start-screen">
<div id="start-title">⚔️ KARENA ⚔️</div>
<div class="weapon-select">
<button class="weapon-btn" id="btnSniper" onclick="selectWeapon('sniper')">СНАЙПЕРКА</button>
<button class="weapon-btn" id="btnSMG" onclick="selectWeapon('smg')">ПП</button>
</div>
<div class="weapon-info" id="weaponInfo">
Выбери оружие для старта
</div>
<button id="start-btn" disabled>НАЧАТЬ ИГРУ</button>
</div>
<div id="hud">
<div id="scoreboard">
<div class="score-box" id="score-host">0<span class="score-label">ТЫ</span></div>
<div class="score-box red" id="score-client">0<span class="score-label">БОТ</span></div>
</div>
<div id="hp-container">
<div class="hp-row">
<div class="hp-label" style="color:#0f0">ТЫ</div>
<div class="hp-bar"><div class="hp-fill green" id="hp-fill-player" style="width:100%"></div></div>
<div class="hp-text" id="hp-text-player">100</div>
</div>
<div class="hp-row">
<div class="hp-label" style="color:#f00">БОТ</div>
<div class="hp-bar"><div class="hp-fill red" id="hp-fill-enemy" style="width:100%"></div></div>
<div class="hp-text" id="hp-text-enemy">100</div>
</div>
</div>
<div id="ammo-bar"></div>
<div id="reload-msg">ПЕРЕЗАРЯДКА...</div>
<div id="weapon-name"></div>
<div id="weapon-hint">ЛКМ зажим — стрельба | Колёсико — смена</div>
<div id="recoil-indicator">Отдача: 0%</div>
</div>
<div id="final-screen">
<div id="final-title"></div>
<div id="final-score"></div>
<button id="btn-restart">ЕЩЁ РАЗ</button>
</div>
</div>
<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');

function resizeCanvas(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);

let gameActive=false,player,enemy,keys={},bullets=[],obstacles=[],scoreH=0,scoreC=0;
let selectedWeapon=null,aiming=false,mouseX=0,mouseY=0;
let mouseDown=false,recoil=0;

const WEAPONS={
  sniper:{
    name:'СНАЙПЕРКА',
    damage:50,
    scopedDamage:70,
    maxAmmo:3,
    reloadTime:5000,
    fireRate:2000,
    spread:0,
    recoilPerShot:0,
    maxRecoil:0,
    color:'#ff0'
  },
  smg:{
    name:'ПП',
    damage:6,
    maxAmmo:70,
    reloadTime:5000,
    fireRate:100,
    spread:0.08,
    recoilPerShot:0.8,
    maxRecoil:15,
    color:'#f0f'
  }
};

const WEAPON_ORDER=['sniper','smg'];

const MAX_SCORE=5,MAX_HP=100,SPD=5,BSPD=10,BR=5;

function selectWeapon(weapon){
  selectedWeapon=weapon;
  document.getElementById('btnSniper').classList.toggle('selected',weapon==='sniper');
  document.getElementById('btnSMG').classList.toggle('selected',weapon==='smg');
  document.getElementById('start-btn').disabled=false;
  
  const w=WEAPONS[weapon];
  const info=weapon==='sniper'
    ?'🎯 Урон: 50 | Патроны: 3 | Скорострельность: 2 сек<br>🔭 ПКМ: прицел (70 урона, 3x скорость пули, -50% скорости)'
    :'🔫 Урон: 6 | Патроны: 70 | Скорострельность: 10/сек<br>📈 Отдача накапливается при зажиме';
  document.getElementById('weaponInfo').innerHTML=info;
}

function switchWeapon(){
  if(!gameActive||!player.alive)return;
  const idx=WEAPON_ORDER.indexOf(player.weapon);
  const nextIdx=(idx+1)%WEAPON_ORDER.length;
  const nextWeapon=WEAPON_ORDER[nextIdx];
  
  player.weapon=nextWeapon;
  const w=WEAPONS[nextWeapon];
  player.ammo=w.maxAmmo;
  player.reloading=false;
  recoil=0;
  document.getElementById('reload-msg').style.display='none';
  document.getElementById('weapon-name').textContent=w.name;
  document.getElementById('recoil-indicator').style.display='none';
  updateAmmo();
}

canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  switchWeapon();
});

canvas.addEventListener('contextmenu',e=>{
  e.preventDefault();
  if(gameActive&&player.alive&&player.weapon==='sniper'){
    aiming=true;
    document.getElementById('scope-overlay').style.display='block';
  }
});

canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect();
  mouseX=(e.clientX-r.left)*(canvas.width/r.width);
  mouseY=(e.clientY-r.top)*(canvas.height/r.height);
});

canvas.addEventListener('mousedown',e=>{
  if(e.button===0){
    mouseDown=true;
  }
  if(e.button===2){
    aiming=true;
    document.getElementById('scope-overlay').style.display='block';
  }
});

document.addEventListener('mouseup',e=>{
  if(e.button===0){
    mouseDown=false;
  }
  if(e.button===2){
    aiming=false;
    document.getElementById('scope-overlay').style.display='none';
  }
});

document.getElementById('start-btn').onclick=()=>{
  if(!selectedWeapon)return;
  document.getElementById('start-screen').style.display='none';
  startGame();
};

document.getElementById('btn-restart').onclick=()=>{
  document.getElementById('final-screen').style.display='none';
  startGame();
};

function startGame(){
  gameActive=true;
  scoreH=0;scoreC=0;bullets=[];
  recoil=0;
  mouseDown=false;
  
  const w=WEAPONS[selectedWeapon];
  player={
    x:canvas.width*0.2,y:canvas.height/2,hp:MAX_HP,alive:true,
    lastShot:0,ammo:w.maxAmmo,reloading:false,reloadEnd:0,
    weapon:selectedWeapon,aiming:false
  };
  
  enemy={
    x:canvas.width*0.8,y:canvas.height/2,hp:MAX_HP,alive:true,
    lastShot:0,tx:canvas.width*0.8,ty:canvas.height/2,moveTimer:0,
    weapon:'smg+',
    damage:20,
    fireRate:400
  };
  
  const cw=canvas.width,ch=canvas.height;
  obstacles=[
    {x:cw*0.3,y:ch*0.2,w:cw*0.08,h:ch*0.1},
    {x:cw*0.62,y:ch*0.2,w:cw*0.08,h:ch*0.1},
    {x:cw*0.3,y:ch*0.7,w:cw*0.08,h:ch*0.1},
    {x:cw*0.62,y:ch*0.7,w:cw*0.08,h:ch*0.1},
    {x:cw*0.46,y:ch*0.45,w:cw*0.08,h:ch*0.1}
  ];
  
  document.getElementById('weapon-name').textContent=w.name;
  updateAmmo();
  updateHP();
  
  window.onkeydown=e=>keys[e.code]=true;
  window.onkeyup=e=>keys[e.code]=false;
  
  gameLoop();
}

function startReload(){
  const w=WEAPONS[player.weapon];
  player.reloading=true;
  player.reloadEnd=Date.now()+w.reloadTime;
  document.getElementById('reload-msg').style.display='block';
  setTimeout(()=>{
    if(gameActive&&player.alive){
      player.ammo=w.maxAmmo;
      player.reloading=false;
      document.getElementById('reload-msg').style.display='none';
      updateAmmo();
    }
  },w.reloadTime);
}

function updateAmmo(){
  const w=WEAPONS[player.weapon];
  const bar=document.getElementById('ammo-bar');
  bar.innerHTML='';
  const displayCount=Math.min(w.maxAmmo,30);
  for(let i=0;i<displayCount;i++){
    const pip=document.createElement('div');
    pip.className='ammo-pip'+(i<player.ammo?'':' empty');
    if(w.maxAmmo>20){
      pip.style.width='6px';
      pip.style.height='6px';
    }
    bar.appendChild(pip);
  }
}

function updateHP(){
  const playerPct=Math.max(0,player.hp)/MAX_HP*100;
  const enemyPct=Math.max(0,enemy.hp)/MAX_HP*100;
  document.getElementById('hp-fill-player').style.width=playerPct+'%';
  document.getElementById('hp-text-player').textContent=Math.max(0,player.hp);
  document.getElementById('hp-fill-enemy').style.width=enemyPct+'%';
  document.getElementById('hp-text-enemy').textContent=Math.max(0,enemy.hp);
}

function hitObs(x,y,r){
  return obstacles.some(o=>x+r>o.x&&x-r<o.x+o.w&&y+r>o.y&&y-r<o.y+o.h);
}

function canSee(x1,y1,x2,y2){
  const steps=20;
  for(let i=0;i<=steps;i++){
    const t=i/steps;
    const x=x1+(x2-x1)*t;
    const y=y1+(y2-y1)*t;
    if(hitObs(x,y,5))return false;
  }
  return true;
}

function botAI(){
  if(!enemy.alive)return;
  
  enemy.moveTimer--;
  
  if(enemy.hp<MAX_HP*0.3){
    if(enemy.moveTimer<=0){
      enemy.moveTimer=30;
      const retreatX=enemy.x<canvas.width/2?canvas.width*0.1:canvas.width*0.9;
      const retreatY=enemy.y<canvas.height/2?canvas.height*0.2:canvas.height*0.8;
      enemy.tx=retreatX;
      enemy.ty=retreatY;
    }
  }
  else if(canSee(enemy.x,enemy.y,player.x,player.y)){
    if(Date.now()-enemy.lastShot>enemy.fireRate*0.7){
      enemy.lastShot=Date.now();
      const a=Math.atan2(player.y-enemy.y,player.x-enemy.x);
      bullets.push({x:enemy.x,y:enemy.y,dx:Math.cos(a)*BSPD,dy:Math.sin(a)*BSPD,life:120,enemy:true,homing:0.01,damage:enemy.damage});
    }
    
    if(enemy.moveTimer<=0){
      enemy.moveTimer=20+Math.random()*20;
      const dx=player.x-enemy.x;
      const dy=player.y-enemy.y;
      enemy.tx=enemy.x-dy*0.5;
      enemy.ty=enemy.y+dx*0.3;
      enemy.tx=Math.max(50,Math.min(canvas.width-50,enemy.tx));
      enemy.ty=Math.max(50,Math.min(canvas.height-50,enemy.ty));
    }
  }
  else{
    if(enemy.moveTimer<=0){
      enemy.moveTimer=40;
      const dx=player.x-enemy.x;
      const dy=player.y-enemy.y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      enemy.tx=enemy.x+dx/dist*100;
      enemy.ty=enemy.y+dy/dist*100;
      enemy.tx=Math.max(50,Math.min(canvas.width-50,enemy.tx));
      enemy.ty=Math.max(50,Math.min(canvas.height-50,enemy.ty));
    }
  }
  
  const dx=enemy.tx-enemy.x;
  const dy=enemy.ty-enemy.y;
  const dist=Math.sqrt(dx*dx+dy*dy);
  
  if(dist>5){
    const moveX=enemy.x+(dx/dist)*SPD*0.7;
    const moveY=enemy.y+(dy/dist)*SPD*0.7;
    
    if(!hitObs(moveX,enemy.y,12)){
      enemy.x=moveX;
    }else{
      enemy.ty+=50*(Math.random()>0.5?1:-1);
      enemy.ty=Math.max(50,Math.min(canvas.height-50,enemy.ty));
    }
    
    if(!hitObs(enemy.x,moveY,12)){
      enemy.y=moveY;
    }else{
      enemy.tx+=50*(Math.random()>0.5?1:-1);
      enemy.tx=Math.max(50,Math.min(canvas.width-50,enemy.tx));
    }
  }
  
  enemy.x=Math.max(12,Math.min(canvas.width-12,enemy.x));
  enemy.y=Math.max(12,Math.min(canvas.height-12,enemy.y));
}

function tryShoot(){
  if(!gameActive||!player.alive||player.reloading||!mouseDown)return;
  
  const w=WEAPONS[player.weapon];
  const now=Date.now();
  
  if(now-player.lastShot<w.fireRate)return;
  if(player.ammo<=0){
    startReload();
    return;
  }
  
  player.lastShot=now;
  player.ammo--;
  updateAmmo();
  
  const r=canvas.getBoundingClientRect();
  const mx=(e?.clientX?((e.clientX-r.left)*(canvas.width/r.width)):mouseX);
  const my=(e?.clientY?((e.clientY-r.top)*(canvas.height/r.height)):mouseY);
  const a=Math.atan2(mouseY-player.y,mouseX-player.x);
  
  const currentRecoil=recoil*(Math.random()*0.5+0.5);
  const spread=(Math.random()-0.5)*w.spread+currentRecoil*0.02;
  const damage=player.weapon==='sniper'&&aiming?w.scopedDamage:w.damage;
  const bulletSpeed=player.weapon==='sniper'&&aiming?BSPD*3:BSPD;
  bullets.push({x:player.x,y:player.y,dx:Math.cos(a+spread)*bulletSpeed,dy:Math.sin(a+spread)*bulletSpeed,life:120,damage:damage});
  
  recoil=Math.min(w.maxRecoil,recoil+w.recoilPerShot);
  if(recoil>0){
    document.getElementById('recoil-indicator').style.display='block';
    document.getElementById('recoil-indicator').textContent='Отдача: '+Math.round(recoil)+'%';
  }
  
  if(player.ammo<=0)startReload();
}

function gameLoop(){
  if(!gameActive){requestAnimationFrame(gameLoop);return}
  
  const w=WEAPONS[player.weapon];
  
  if(player.reloading&&Date.now()>player.reloadEnd){
    player.ammo=w.maxAmmo;
    player.reloading=false;
    recoil=0;
    document.getElementById('reload-msg').style.display='none';
    document.getElementById('recoil-indicator').style.display='none';
    updateAmmo();
  }
  
  if(!mouseDown&&recoil>0){
    recoil=Math.max(0,recoil-0.3);
    if(recoil<=0.1){
      recoil=0;
      document.getElementById('recoil-indicator').style.display='none';
    }else{
      document.getElementById('recoil-indicator').textContent='Отдача: '+Math.round(recoil)+'%';
    }
  }
  
  if(mouseDown&&player.weapon!=='sniper'){
    tryShoot();
  }
  
  if(player.alive){
    let nx=player.x,ny=player.y;
    const moveSpd=aiming?SPD*0.5:SPD;
    if(keys['KeyW']||keys['ArrowUp'])ny-=moveSpd;
    if(keys['KeyS']||keys['ArrowDown'])ny+=moveSpd;
    if(keys['KeyA']||keys['ArrowLeft'])nx-=moveSpd;
    if(keys['KeyD']||keys['ArrowRight'])nx+=moveSpd;
    nx=Math.max(12,Math.min(canvas.width-12,nx));
    ny=Math.max(12,Math.min(canvas.height-12,ny));
    if(!hitObs(nx,player.y,10))player.x=nx;
    if(!hitObs(player.x,ny,10))player.y=ny;
  }
  
  botAI();
  
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle='#111';
  const gridSize=40;
  for(let i=0;i<canvas.width;i+=gridSize){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,canvas.height);ctx.stroke()}
  for(let j=0;j<canvas.height;j+=gridSize){ctx.beginPath();ctx.moveTo(0,j);ctx.lineTo(canvas.width,j);ctx.stroke()}
  
  ctx.fillStyle='#1a1a2e';
  obstacles.forEach(o=>{ctx.fillRect(o.x,o.y,o.w,o.h);ctx.strokeStyle='#333';ctx.strokeRect(o.x,o.y,o.w,o.h)});
  
  if(aiming&&player.weapon==='sniper'&&player.alive){
    const a=Math.atan2(mouseY-player.y,mouseX-player.x);
    ctx.strokeStyle='rgba(255,0,0,.8)';
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(player.x,player.y);
    ctx.lineTo(player.x+Math.cos(a)*1000,player.y+Math.sin(a)*1000);
    ctx.stroke();
    ctx.lineWidth=1;
  }
  
  bullets.forEach(b=>{ctx.fillStyle=b.enemy?'#f0f':(b.damage>=70?'#f00':b.damage===50?'#ff0':'#f0f');ctx.beginPath();ctx.arc(b.x,b.y,BR,0,Math.PI*2);ctx.fill()});
  
  if(player.alive){
    ctx.fillStyle='#0f0';
    ctx.beginPath();
    ctx.arc(player.x,player.y,14,0,Math.PI*2);
    ctx.fill();
  }
  
  if(enemy.alive){
    ctx.fillStyle='#f00';
    ctx.beginPath();
    ctx.arc(enemy.x,enemy.y,14,0,Math.PI*2);
    ctx.fill();
  }
  
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    
    if(b.enemy&&b.homing&&player.alive){
      const a=Math.atan2(player.y-b.y,player.x-b.x);
      const curA=Math.atan2(b.dy,b.dx);
      const diff=a-curA;
      const turn=Math.max(-b.homing,Math.min(b.homing,diff));
      const newA=curA+turn;
      b.dx=Math.cos(newA)*BSPD;
      b.dy=Math.sin(newA)*BSPD;
    }
    
    b.x+=b.dx;b.y+=b.dy;b.life--;
    let rem=b.life<=0||b.x<0||b.x>canvas.width||b.y<0||b.y>canvas.height||hitObs(b.x,b.y,BR);
    if(!rem){
      const t=b.enemy?player:enemy;
      if(t.alive&&Math.abs(b.x-t.x)<16&&Math.abs(b.y-t.y)<16){
        rem=true;
        const dmg=b.damage||50;
        if(b.enemy){
          player.hp-=dmg;
          if(player.hp<=0){
            player.alive=false;
            scoreC++;
            setTimeout(()=>{
              if(scoreC<MAX_SCORE){
                player.x=canvas.width*0.2;player.y=canvas.height/2;player.hp=MAX_HP;player.alive=true;
              }
            },1500);
            checkWin();
          }
        }else{
          enemy.hp-=dmg;
          if(enemy.hp<=0){
            enemy.alive=false;
            scoreH++;
            setTimeout(()=>{
              if(scoreH<MAX_SCORE){
                enemy.x=canvas.width*0.8;enemy.y=canvas.height/2;enemy.hp=MAX_HP;enemy.alive=true;
              }
            },1500);
            checkWin();
          }
        }
        updateHP();
      }
    }
    if(rem)bullets.splice(i,1);
  }
  
  updateHP();
  
  document.getElementById('score-host').innerHTML=scoreH+'<span class="score-label">ТЫ</span>';
  document.getElementById('score-client').innerHTML=scoreC+'<span class="score-label">БОТ</span>';
  
  requestAnimationFrame(gameLoop);
}

function checkWin(){
  if(scoreH>=MAX_SCORE){
    gameActive=false;
    document.getElementById('final-title').textContent='🏆 ТЫ ПОБЕДИЛ!';
    document.getElementById('final-title').style.color='#0f0';
    document.getElementById('final-score').textContent='ТЫ '+scoreH+' : '+scoreC+' БОТ';
    document.getElementById('final-screen').style.display='flex';
  }
  if(scoreC>=MAX_SCORE){
    gameActive=false;
    document.getElementById('final-title').textContent='💀 ТЫ ПРОИГРАЛ';
    document.getElementById('final-title').style.color='#f00';
    document.getElementById('final-score').textContent='ТЫ '+scoreH+' : '+scoreC+' БОТ';
    document.getElementById('final-screen').style.display='flex';
  }
}
</script>
</body>
</html>
