<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KArena</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{overflow:hidden;background:#080d12;font-family:Arial,sans-serif}
canvas{display:block}
#start,#end{
  position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:rgba(3,8,14,.96);color:white
}
#end{display:none}
h1{font-size:80px;color:#56ff7e;text-shadow:0 0 25px #26cf50;margin-bottom:32px}
button{
  border:2px solid #56ff7e;border-radius:9px;
  background:#102217;color:#91ffaa;
  padding:15px 32px;font-size:18px;font-weight:bold;
  cursor:pointer
}
button:hover{background:#56ff7e;color:#07150b}
#result{font-size:22px;margin-bottom:25px}
#hud{position:fixed;inset:0;z-index:5;pointer-events:none;color:white;text-shadow:0 2px 3px #000}
#cross{
  position:absolute;left:50%;top:50%;
  width:18px;height:18px;transform:translate(-50%,-50%)
}
#cross:before,#cross:after{content:"";position:absolute;background:white}
#cross:before{left:8px;top:0;width:2px;height:18px}
#cross:after{left:0;top:8px;width:18px;height:2px}
#score{
  position:absolute;top:18px;left:50%;
  transform:translateX(-50%);
  display:flex;gap:14px
}
.box{
  min-width:105px;padding:9px 18px;text-align:center;
  border:2px solid #56ff7e;border-radius:8px;
  background:rgba(0,0,0,.4);color:#70ff95;
  font-size:24px
}
.box.bot{border-color:#ff5353;color:#ff7373}
#weapon{position:absolute;left:20px;top:20px;color:#9bffaa;font-size:18px}
#ammo{position:absolute;right:20px;bottom:22px;color:#9bffaa;font-size:25px}
#dash{position:absolute;left:50%;bottom:38px;transform:translateX(-50%);color:#71ff93}
#reload{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);color:#ffd565;display:none}
#player-hp{position:absolute;left:20px;bottom:22px;width:285px}
#bot-hp{position:absolute;right:20px;top:20px;width:220px}
.label{font-size:13px;margin-bottom:4px}
.bar{height:18px;border:2px solid white;border-radius:5px;background:#0008;overflow:hidden}
#pfill{height:100%;background:#48ee6c;width:100%}
#bfill{height:100%;background:#ff4949;width:100%}
#damage{
  position:fixed;inset:0;opacity:0;pointer-events:none;
  background:radial-gradient(circle,transparent 40%,#f003 100%);
  transition:opacity .12s
}
#hit{
  display:none;position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  color:white;font-size:42px
}
</style>
</head>
<body>

<div id="start">
  <h1>KArena</h1>
  <button id="play">НАЧАТЬ ИГРУ</button>
</div>

<div id="end">
  <h1>КОНЕЦ</h1>
  <div id="result"></div>
  <button id="again">ЕЩЁ РАЗ</button>
</div>

<div id="hud">
  <div id="cross"></div>
  <div id="damage"></div>
  <div id="hit">✕</div>

  <div id="score">
    <div class="box"><span id="you">0</span><br><small>ТЫ</small></div>
    <div class="box bot"><span id="botScore">0</span><br><small>БОТ</small></div>
  </div>

  <div id="weapon">ПП</div>
  <div id="ammo">30 / 30</div>
  <div id="dash">РЫВОК ГОТОВ — Q</div>
  <div id="reload">ПЕРЕЗАРЯДКА...</div>

  <div id="player-hp">
    <div class="label">ТЫ: <span id="pt">100</span></div>
    <div class="bar"><div id="pfill"></div></div>
  </div>

  <div id="bot-hp">
    <div class="label">БОТ: <span id="bt">100</span></div>
    <div class="bar"><div id="bfill"></div></div>
  </div>
</div>

<script>
"use strict";

const canvas=document.createElement("canvas");
const ctx=canvas.getContext("2d");
document.body.appendChild(canvas);

function resize(){
  canvas.width=innerWidth;
  canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

const WORLD_W=2600;
const WORLD_H=1700;
const FOV=Math.PI/3;
const MAX_SCORE=5;
const PLAYER_R=18;
const BOT_R=20;

const weapons={
  smg:{
    name:"ПП",damage:6,ammo:30,maxAmmo:30,
    fireRate:100,reload:1400,spread:.035,color:"#ff4ddd"
  },
  shotgun:{
    name:"ДРОБОВИК",damage:4,ammo:10,maxAmmo:10,
    fireRate:700,reload:1800,spread:.18,pellets:14,color:"#ffad4d"
  },
  sniper:{
    name:"СНАЙПЕРКА",damage:50,ammo:3,maxAmmo:3,
    fireRate:900,reload:1800,spread:.002,color:"#ffe34d"
  }
};

const order=["smg","shotgun","sniper"];

let game=false;
let weaponName="smg";
let scoreYou=0;
let scoreBot=0;
let keys={};
let mouseDown=false;
let mouseX=canvas.width/2;
let mouseY=canvas.height/2;
let camera={x:0,y:0,angle:0};
let bullets=[];
let particles=[];
let obstacles=[];

let player={
  x:300,y:WORLD_H/2,
  hp:100,ammo:30,
  lastShot:0,reloading:false,reloadEnd:0,
  dashReady:0,dashTime:0,
  dashX:0,dashY:0,
  vx:0,vy:0,
  z:0,vz:0,grounded:true
};

let bot={
  x:WORLD_W-300,y:WORLD_H/2,
  hp:100,ammo:30,
  lastShot:0,reloading:false,reloadEnd:0,
  targetX:WORLD_W-300,targetY:WORLD_H/2,
  strafe:1,strafeTimer:0
};

const map={
  floor:"#1c3024",
  wall:"#486b57",
  edge:"#7fc894",
  blocks:[
    {x:430,y:280,w:170,h:470,h:150},
    {x:700,y:200,w:450,h:150,h:90},
    {x:950,y:430,w:160,h:420,h:140},
    {x:1250,y:160,w:160,h:430,h:180},
    {x:1460,y:460,w:520,h:150,h:140},
    {x:1750,y:720,w:170,h:430,h:180},
    {x:2050,y:240,w:420,h:160,h:100},
    {x:2200,y:680,w:150,h:430,h:160},
    {x:350,y:1150,w:560,h:150,h:120},
    {x:1100,y:1120,w:170,h:400,h:170},
    {x:1420,y:1010,w:480,h:150,h:120},
    {x:1800,y:1200,w:560,h:150,h:120},
    {x:2300,y:1120,w:170,h:400,h:170},
    {x:650,y:1450,w:450,h:130,h:100},
    {x:1450,y:1480,w:400,h:120,h:100},
    {x:2100,y:1450,w:400,h:130,h:100}
  ]
};

obstacles=map.blocks.map(b=>({
  x:b.x,y:b.y,w:b.w,h:b.h,height:b.h
}));

function makeSpawn(side){
  const points=side==="player"
    ?[
      {x:160,y:250},
      {x:170,y:WORLD_H-250},
      {x:280,y:WORLD_H/2}
    ]
    :[
      {x:WORLD_W-160,y:250},
      {x:WORLD_W-170,y:WORLD_H-250},
      {x:WORLD_W-280,y:WORLD_H/2}
    ];

  for(const p of points){
    if(!hitObstacle(p.x,p.y,PLAYER_R))return p;
  }

  return side==="player"
    ?{x:150,y:WORLD_H/2}
    :{x:WORLD_W-150,y:WORLD_H/2};
}

function resetRound(){
  const p=makeSpawn("player");
  const b=makeSpawn("bot");

  player.x=p.x;
  player.y=p.y;
  player.z=0;
  player.vz=0;
  player.grounded=true;
  player.hp=100;
  player.ammo=weapons[weaponName].maxAmmo;
  player.reloading=false;
  player.dashReady=0;
  player.dashTime=0;
  player.vx=0;
  player.vy=0;

  bot.x=b.x;
  bot.y=b.y;
  bot.hp=100;
  bot.ammo=30;
  bot.reloading=false;
  bot.targetX=b.x;
  bot.targetY=b.y;
  bot.lastShot=0;

  bullets=[];
  particles=[];
  updateHud();
}

function startGame(){
  game=true;
  scoreYou=0;
  scoreBot=0;
  weaponName="smg";

  document.getElementById("start").style.display="none";
  document.getElementById("end").style.display="none";

  resetRound();
  requestAnimationFrame(loop);
}

document.getElementById("play").onclick=startGame;
document.getElementById("again").onclick=startGame;

addEventListener("keydown",e=>{
  keys[e.code]=true;

  if(e.code==="Space"){
    e.preventDefault();
    jump();
  }

  if(e.code==="KeyQ"){
    dash();
  }

  if(e.code==="KeyR"){
    reload();
  }
});

addEventListener("keyup",e=>{
  keys[e.code]=false;
});

canvas.addEventListener("mousemove",e=>{
  mouseX=e.clientX;
  mouseY=e.clientY;
});

canvas.addEventListener("mousedown",e=>{
  if(e.button===0){
    mouseDown=true;
    shoot();
  }
});

addEventListener("mouseup",e=>{
  if(e.button===0)mouseDown=false;
});

canvas.addEventListener("wheel",e=>{
  e.preventDefault();

  const current=order.indexOf(weaponName);
  const next=(current+(e.deltaY>0?1:-1)+order.length)%order.length;

  weaponName=order[next];
  player.ammo=weapons[weaponName].maxAmmo;
  player.reloading=false;

  document.getElementById("reload").style.display="none";
  updateHud();
},{passive:false});

function hitObstacle(x,y,r=0){
  if(x<r||x>WORLD_W-r||y<r||y>WORLD_H-r)return true;

  for(const o of obstacles){
    if(
      x+r>o.x&&
      x-r<o.x+o.w&&
      y+r>o.y&&
      y-r<o.y+o.h
    ){
      return true;
    }
  }

  return false;
}

function canSee(x1,y1,x2,y2){
  const distance=Math.hypot(x2-x1,y2-y1);
  const steps=Math.ceil(distance/20);

  for(let i=1;i<steps;i++){
    const t=i/steps;
    const x=x1+(x2-x1)*t;
    const y=y1+(y2-y1)*t;

    if(hitObstacle(x,y,2))return false;
  }

  return true;
}

function jump(){
  if(!game||!player.grounded)return;

  player.vz=11;
  player.grounded=false;
  spawnParticles(player.x,player.y,"#d8ffff",12);
}

function dash(){
  const now=performance.now();

  if(!game||now<player.dashReady||player.dashTime>0)return;

  let dx=0;
  let dy=0;

  if(keys.KeyW||keys.ArrowUp)dy-=1;
  if(keys.KeyS||keys.ArrowDown)dy+=1;
  if(keys.KeyA||keys.ArrowLeft)dx-=1;
  if(keys.KeyD||keys.ArrowRight)dx+=1;

  if(dx===0&&dy===0){
    const angle=Math.atan2(
      mouseY-canvas.height/2,
      mouseX-canvas.width/2
    );

    dx=Math.cos(angle);
    dy=Math.sin(angle);
  }

  const length=Math.hypot(dx,dy)||1;

  player.dashX=dx/length;
  player.dashY=dy/length;
  player.dashTime=.12;
  player.dashReady=now+3000;

  spawnParticles(player.x,player.y,"#59ff83",26);
}

function reload(){
  const w=weapons[weaponName];

  if(
    !game||
    player.reloading||
    player.ammo>=w.maxAmmo
  )return;

  player.reloading=true;
  player.reloadEnd=performance.now()+w.reload;

  document.getElementById("reload").style.display="block";
}

function shoot(){
  if(!game||player.reloading)return;

  const w=weapons[weaponName];
  const now=performance.now();

  if(now-player.lastShot<w.fireRate)return;

  if(player.ammo<=0){
    reload();
    return;
  }

  player.lastShot=now;
  player.ammo--;

  const baseAngle=Math.atan2(
    mouseY-canvas.height/2,
    mouseX-canvas.width/2
  );

  const count=w.pellets||1;

  for(let i=0;i<count;i++){
    const spread=(Math.random()-.5)*w.spread;
    const angle=baseAngle+spread;

    bullets.push({
      x:player.x,
      y:player.y-player.z,
      vx:Math.cos(angle)*13,
      vy:Math.sin(angle)*13,
      enemy:false,
      damage:w.damage,
      life:130,
      color:w.color
    });
  }

  if(player.ammo<=0)reload();
  updateHud();
}

function botShoot(){
  if(bot.reloading)return;

  if(bot.ammo<=0){
    bot.reloading=true;
    bot.reloadEnd=performance.now()+1800;
    return;
  }

  const now=performance.now();
  if(now-bot.lastShot<360)return;

  bot.lastShot=now;
  bot.ammo--;

  const dx=player.x-bot.x;
  const dy=player.y-player.z-bot.y;
  const length=Math.hypot(dx,dy)||1;

  bullets.push({
    x:bot.x,
    y:bot.y,
    vx:dx/length*10,
    vy:dy/length*10,
    enemy:true,
    damage:12,
    life:150,
    color:"#ff43dd"
  });

  if(bot.ammo<=0){
    bot.reloading=true;
    bot.reloadEnd=now+1800;
  }
}

function updatePlayer(dt){
  const now=performance.now();

  if(player.reloading&&now>=player.reloadEnd){
    player.reloading=false;
    player.ammo=weapons[weaponName].maxAmmo;
    document.getElementById("reload").style.display="none";
  }

  player.vz-=24*dt;
  player.z+=player.vz*dt;

  if(player.z<=0){
    player.z=0;
    player.vz=0;
    player.grounded=true;
  }

  let dx=0;
  let dy=0;

  if(keys.KeyW||keys.ArrowUp)dy-=1;
  if(keys.KeyS||keys.ArrowDown)dy+=1;
  if(keys.KeyA||keys.ArrowLeft)dx-=1;
  if(keys.KeyD||keys.ArrowRight)dx+=1;

  const length=Math.hypot(dx,dy)||1;

  if(dx!==0||dy!==0){
    dx=dx/length*5*dt;
    dy=dy/length*5*dt;
  }

  if(player.dashTime>0){
    player.dashTime-=dt;
    dx=player.dashX*45*dt;
    dy=player.dashY*45*dt;
  }

  const nextX=player.x+dx;
  const nextY=player.y+dy;

  if(!hitObstacle(nextX,player.y,PLAYER_R)){
    player.x=nextX;
  }

  if(!hitObstacle(player.x,nextY,PLAYER_R)){
    player.y=nextY;
  }

  camera.x=player.x;
  camera.y=player.y-player.z;
}

function updateBot(dt){
  const now=performance.now();

  if(bot.reloading){
    if(now>=bot.reloadEnd){
      bot.reloading=false;
      bot.ammo=30;
    }else{
      const dx=bot.x-player.x;
      const dy=bot.y-player.y;
      const length=Math.hypot(dx,dy)||1;

      const nx=bot.x+dx/length*3*dt;
      const ny=bot.y+dy/length*3*dt;

      if(!hitObstacle(nx,bot.y,BOT_R))bot.x=nx;
      if(!hitObstacle(bot.x,ny,BOT_R))bot.y=ny;

      return;
    }
  }

  const dx=player.x-bot.x;
  const dy=player.y-player.z-bot.y;
  const distance=Math.hypot(dx,dy)||1;

  let moveX=0;
  let moveY=0;

  if(bot.hp<30){
    if(distance<280){
      moveX=-dx/distance;
      moveY=-dy/distance;
    }else{
      bot.strafeTimer-=dt;

      if(bot.strafeTimer<=0){
        bot.strafeTimer=.7+Math.random();
        bot.strafe=bot.strafe*-1;
      }

      moveX=-dy/distance*bot.strafe;
      moveY=dx/distance*bot.strafe;
    }
  }else if(distance>250){
    moveX=dx/distance;
    moveY=dy/distance;
  }else{
    bot.strafeTimer-=dt;

    if(bot.strafeTimer<=0){
      bot.strafeTimer=.6+Math.random();
      bot.strafe=bot.strafe*-1;
    }

    moveX=-dy/distance*bot.strafe;
    moveY=dx/distance*bot.strafe;
  }

  const speed=bot.hp<30?2.3:3.4;
  const nextX=bot.x+moveX*speed*dt;
  const nextY=bot.y+moveY*speed*dt;

  if(!hitObstacle(nextX,bot.y,BOT_R)){
    bot.x=nextX;
  }

  if(!hitObstacle(bot.x,nextY,BOT_R)){
    bot.y=nextY;
  }

  if(
    distance<900&&
    canSee(bot.x,bot.y,player.x,player.y)
  ){
    botShoot();
  }
}

function updateBullets(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];

    b.x+=b.vx*dt;
    b.y+=b.vy*dt;
    b.life--;

    spawnParticles(b.x,b.y,b.color,1);

    if(hitObstacle(b.x,b.y,3)||b.life<=0){
      bullets.splice(i,1);
      continue;
    }

    if(!b.enemy){
      if(
        Math.hypot(b.x-bot.x,b.y-bot.y)<25
      ){
        bot.hp-=b.damage;
        spawnParticles(bot.x,bot.y,"#ff5151",14);
        showHit();
        bullets.splice(i,1);

        if(bot.hp<=0){
          bot.hp=0;
          scoreYou++;
          finishRound("you");
        }

        continue;
      }
    }else{
      if(
        Math.hypot(b.x-player.x,b.y-(player.y-player.z))<27
      ){
        player.hp-=b.damage;
        showDamage();
        bullets.splice(i,1);

        if(player.hp<=0){
          player.hp=0;
          scoreBot++;
          finishRound("bot");
        }
      }
    }
  }
}

function finishRound(winner){
  updateHud();

  if(scoreYou>=MAX_SCORE||scoreBot>=MAX_SCORE){
    game=false;
    document.getElementById("end").style.display="flex";

    document.getElementById("result").textContent=
      winner==="you"
        ?`Ты победил: ${scoreYou} : ${scoreBot}`
        :`Бот победил: ${scoreYou} : ${scoreBot}`;

    return;
  }

  game=false;

  setTimeout(()=>{
    if(
      document.getElementById("end").style.display!=="flex"
    ){
      game=true;
      resetRound();
    }
  },900);
}

function spawnParticles(x,y,color,count){
  for(let i=0;i<count;i++){
    particles.push({
      x:x+(Math.random()-.5)*7,
      y:y+(Math.random()-.5)*7,
      vx:(Math.random()-.5)*2,
      vy:(Math.random()-.5)*2,
      life:15+Math.random()*18,
      color
    });
  }
}

function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];

    p.x+=p.vx;
    p.y+=p.vy;
    p.life--;

    if(p.life<=0){
      particles.splice(i,1);
    }
  }
}

function showHit(){
  const el=document.getElementById("hit");
  el.style.display="block";

  setTimeout(()=>{
    el.style.display="none";
  },90);
}

function showDamage(){
  const el=document.getElementById("damage");
  el.style.opacity="1";

  setTimeout(()=>{
    el.style.opacity="0";
  },130);
}

function project(x,y,z=0){
  const dx=x-camera.x;
  const dy=y-camera.y;

  const angle=Math.atan2(dy,dx)-camera.angle;
  const distance=Math.hypot(dx,dy);

  if(distance<1)return null;

  let relative=angle;

  while(relative>Math.PI)relative-=Math.PI*2;
  while(relative<-Math.PI)relative+=Math.PI*2;

  if(Math.abs(relative)>FOV*.7)return null;

  const screenX=canvas.width/2+
    Math.tan(relative)/Math.tan(FOV/2)*
    canvas.width/2;

  const horizon=canvas.height/2;
  const screenY=horizon-z*1700/distance;

  return{
    x:screenX,
    y:screenY,
    scale:1700/distance,
    distance
  };
}

function drawWorld(){
  ctx.fillStyle=map.floor;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  const horizon=canvas.height/2+player.z*60;

  ctx.fillStyle="#070b0d";
  ctx.fillRect(0,0,canvas.width,horizon);

  ctx.fillStyle=map.floor;
  ctx.fillRect(0,horizon,canvas.width,canvas.height-horizon);

  ctx.strokeStyle="rgba(180,255,190,.1)";
  ctx.lineWidth=1;

  for(let x=0;x<=WORLD_W;x+=100){
    const a=project(x,0);
    const b=project(x,WORLD_H);

    if(a&&b){
      ctx.beginPath();
      ctx.moveTo(a.x,horizon);
      ctx.lineTo(b.x,horizon);
      ctx.stroke();
    }
  }

  for(let y=0;y<=WORLD_H;y+=100){
    const a=project(0,y);
    const b=project(WORLD_W,y);

    if(a&&b){
      ctx.beginPath();
      ctx.moveTo(a.x,horizon);
      ctx.lineTo(b.x,horizon);
      ctx.stroke();
    }
  }

  const visible=obstacles
    .map(o=>({...o,d:Math.hypot(o.x-camera.x,o.y-camera.y)}))
    .sort((a,b)=>b.d-a.d);

  for(const o of visible){
    drawBlock(o);
  }

  drawCharacter(bot.x,bot.y,0,"#ef3d43",true);
  drawCharacter(player.x,player.y,player.z,"#45ff72",false);

  for(const b of bullets){
    const p=project(b.x,b.y,b.enemy?0:player.z);

    if(!p)continue;

    ctx.fillStyle=b.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,Math.max(2,7*p.scale/100),0,Math.PI*2);
    ctx.fill();
  }

  for(const p of particles){
    const q=project(p.x,p.y,0);

    if(!q)continue;

    ctx.globalAlpha=Math.max(0,p.life/30);
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(q.x,q.y,Math.max(1,4*q.scale/100),0,Math.PI*2);
    ctx.fill();
    ctx.globalAlpha=1;
  }
}

function drawBlock(o){
  const bottom=[
    project(o.x,o.y,0),
    project(o.x+o.w,o.y,0),
    project(o.x+o.w,o.y+o.h,0),
    project(o.x,o.y+o.h,0)
  ];

  const top=[
    project(o.x,o.y,o.height),
    project(o.x+o.w,o.y,o.height),
    project(o.x+o.w,o.y+o.h,o.height),
    project(o.x,o.y+o.h,o.height)
  ];

  if(bottom.every(p=>!p)&&top.every(p=>!p))return;

  const faces=[
    [bottom[0],bottom[1],top[1],top[0]],
    [bottom[1],bottom[2],top[2],top[1]],
    [bottom[2],bottom[3],top[3],top[2]],
    [bottom[3],bottom[0],top[0],top[3]],
    [top[0],top[1],top[2],top[3]]
  ];

  const colors=[
    "#385645",
    "#496d55",
    "#314c3d",
    "#587d63",
    "#709978"
  ];

  faces.forEach((face,index)=>{
    if(face.some(p=>!p))return;

    ctx.fillStyle=colors[index];
    ctx.strokeStyle=map.edge;
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(face[0].x,face[0].y);

    for(let i=1;i<face.length;i++){
      ctx.lineTo(face[i].x,face[i].y);
    }

    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  });
}

function drawCharacter(x,y,z,color,isBot){
  const p=project(x,y,z);

  if(!p)return;

  const size=Math.max(8,900/p.distance);

  ctx.fillStyle=color;

  if(isBot){
    ctx.fillRect(
      p.x-size*.55,
      p.y-size*1.7,
      size*1.1,
      size*1.7
    );

    ctx.fillStyle="#ffad8f";
    ctx.fillRect(
      p.x-size*.4,
      p.y-size*2.3,
      size*.8,
      size*.65
    );
  }else{
    ctx.beginPath();
    ctx.arc(p.x,p.y-size*.7,size*.55,0,Math.PI*2);
    ctx.fill();
  }
}

function updateHud(){
  const w=weapons[weaponName];

  document.getElementById("you").textContent=scoreYou;
  document.getElementById("botScore").textContent=scoreBot;

  document.getElementById("weapon").textContent=w.name;
  document.getElementById("ammo").textContent=
    `${player.ammo} / ${w.maxAmmo}`;

  document.getElementById("pt").textContent=Math.max(
    0,
    Math.ceil(player.hp)
  );

  document.getElementById("bt").textContent=Math.max(
    0,
    Math.ceil(bot.hp)
  );

  document.getElementById("pfill").style.width=
    Math.max(0,player.hp)+"%";

  document.getElementById("bfill").style.width=
    Math.max(0,bot.hp)+"%";

  const remaining=Math.max(
    0,
    player.dashReady-performance.now()
  );

  const dashEl=document.getElementById("dash");

  if(player.dashTime>0){
    dashEl.textContent="РЫВОК!";
    dashEl.style.color="#ffe45c";
  }else if(remaining<=0){
    dashEl.textContent="РЫВОК ГОТОВ — Q";
    dashEl.style.color="#71ff93";
  }else{
    dashEl.textContent=
      `РЫВОК: ${(remaining/1000).toFixed(1)}с`;
    dashEl.style.color="#999";
  }
}

let lastTime=performance.now();

function loop(now){
  if(!game)return;

  const dt=Math.min((now-lastTime)/1000,.04);
  lastTime=now;

  updatePlayer(dt);
  updateBot(dt);
  updateBullets(dt);
  updateParticles();
  updateHud();

  drawWorld();

  requestAnimationFrame(loop);
}

updateHud();
</script>
