<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>KArena</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden}
#game-container{position:relative;width:960px;height:540px;background:#000;font-family:monospace;overflow:hidden;border:2px solid #0f0;flex-shrink:0}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:0;left:0;width:100%;pointer-events:none;z-index:5}
#scoreboard{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:20px}
.score-box{background:rgba(0,0,0,.8);border:1px solid #0f0;color:#0f0;padding:6px 16px;font-size:18px;font-weight:bold;min-width:80px;text-align:center}
.score-box.red{border-color:#f00;color:#f00}
.score-label{font-size:9px;display:block;margin-top:2px;opacity:.7}
#hp-bar{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);width:220px;height:18px;background:#111;border:1px solid #0f0}
#hp-fill{height:100%;background:#0f0}
#hp-text{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);color:#0f0;font-size:11px;font-weight:bold}
#start-screen{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:20}
#start-title{font-size:48px;color:#0f0;margin-bottom:20px;text-shadow:0 0 20px #0f0}
#start-btn{background:#0f0;color:#000;border:none;padding:15px 40px;font-size:18px;font-weight:bold;cursor:pointer;font-family:monospace}
#start-btn:hover{background:#8f8}
#final-screen{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.92);display:none;flex-direction:column;justify-content:center;align-items:center;z-index:20}
#final-title{font-size:36px;font-weight:bold;margin-bottom:20px}
#final-score{font-size:20px;color:#fff;margin-bottom:30px}
#btn-restart{background:#0f0;color:#000;border:none;padding:15px 40px;font-size:18px;font-weight:bold;cursor:pointer;font-family:monospace}
</style>
</head>
<body>
<div id="game-container">
<canvas id="gameCanvas"></canvas>
<div id="start-screen">
<div id="start-title">⚔️ KARENA ⚔️</div>
<button id="start-btn">НАЧАТЬ ИГРУ</button>
</div>
<div id="hud">
<div id="scoreboard">
<div class="score-box" id="score-host">0<span class="score-label">ТЫ</span></div>
<div class="score-box red" id="score-client">0<span class="score-label">БОТ</span></div>
</div>
<div id="hp-bar"><div id="hp-fill" style="width:100%"></div></div>
<div id="hp-text">100 / 100</div>
</div>
<div id="final-screen">
<div id="final-title"></div>
<div id="final-score"></div>
<button id="btn-restart">ЕЩЁ РАЗ</button>
</div>
</div>
<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
canvas.width=960;canvas.height=540;

let gameActive=false,player,enemy,keys={},bullets=[],obstacles=[],scoreH=0,scoreC=0;
const MAX_SCORE=5,MAX_HP=100,SPD=4,BSPD=8,BR=4,DMG=50,SHOT_COOLDOWN=2000;

document.getElementById('start-btn').onclick=()=>{
  document.getElementById('start-screen').style.display='none';
  startGame();
};

document.getElementById('btn-restart').onclick=()=>{
  document.getElementById('final-screen').style.display='none';
  startGame();
};

function startGame(){
  gameActive=true;
  scoreH=0;scoreC=0;bullets=[];
  player={x:200,y:270,hp:MAX_HP,alive:true,lastShot:0};
  enemy={x:760,y:270,hp:MAX_HP,alive:true,lastShot:0,tx:760,ty:270,moveTimer:0};
  obstacles=[{x:280,y:100,w:80,h:60},{x:600,y:100,w:80,h:60},{x:280,y:380,w:80,h:60},{x:600,y:380,w:80,h:60},{x:440,y:240,w:80,h:60}];
  
  window.onkeydown=e=>keys[e.code]=true;
  window.onkeyup=e=>keys[e.code]=false;
  
  canvas.onmousedown=e=>{
    if(!gameActive||!player.alive)return;
    const now=Date.now();
    if(now-player.lastShot<SHOT_COOLDOWN)return;
    player.lastShot=now;
    const r=canvas.getBoundingClientRect();
    const mx=(e.clientX-r.left)*(canvas.width/r.width);
    const my=(e.clientY-r.top)*(canvas.height/r.height);
    const a=Math.atan2(my-player.y,mx-player.x);
    bullets.push({x:player.x,y:player.y,dx:Math.cos(a)*BSPD,dy:Math.sin(a)*BSPD,life:80});
  };
  
  gameLoop();
}

// Проверка столкновения с препятствиями
function hitObs(x,y,r){
  return obstacles.some(o=>x+r>o.x&&x-r<o.x+o.w&&y+r>o.y&&y-r<o.y+o.h);
}

// Проверка видимости (есть ли прямая линия)
function canSee(x1,y1,x2,y2){
  const steps=20;
  for(let i=0;i<=steps;i++){
    const t=i/steps;
    const x=x1+(x2-x1)*t;
    const y=y1+(y2-y1)*t;
    if(hitObs(x,y,5))return false;
  }
  return true;
}

// Умное движение бота
function botAI(){
  if(!enemy.alive)return;
  
  enemy.moveTimer--;
  
  // Если мало HP - отступаем
  if(enemy.hp<MAX_HP*0.3){
    // Ищем безопасную позицию (подальше от игрока)
    if(enemy.moveTimer<=0){
      enemy.moveTimer=30;
      // Пытаемся уйти за препятствие
      const retreatX=enemy.x<canvas.width/2?100:canvas.width-100;
      const retreatY=enemy.y<canvas.height/2?100:canvas.height-100;
      enemy.tx=retreatX;
      enemy.ty=retreatY;
    }
  }
  // Если видим игрока - стреляем и двигаемся к укрытию
  else if(canSee(enemy.x,enemy.y,player.x,player.y)){
    // Стреляем
    if(Date.now()-enemy.lastShot>SHOT_COOLDOWN*0.8){
      enemy.lastShot=Date.now();
      const a=Math.atan2(player.y-enemy.y,player.x-enemy.x);
      bullets.push({x:enemy.x,y:enemy.y,dx:Math.cos(a)*BSPD,dy:Math.sin(a)*BSPD,life:80,enemy:true});
    }
    
    // Двигаемся зигзагом чтобы сложнее было попасть
    if(enemy.moveTimer<=0){
      enemy.moveTimer=20+Math.random()*20;
      const dx=player.x-enemy.x;
      const dy=player.y-enemy.y;
      // Двигаемся перпендикулярно игроку
      enemy.tx=enemy.x-dy*0.5;
      enemy.ty=enemy.y+dx*0.3;
      // Не уходим за границы
      enemy.tx=Math.max(50,Math.min(canvas.width-50,enemy.tx));
      enemy.ty=Math.max(50,Math.min(canvas.height-50,enemy.ty));
    }
  }
  // Если не видим - идём на позицию откуда будет видно
  else{
    if(enemy.moveTimer<=0){
      enemy.moveTimer=40;
      // Целевая точка - ближе к игроку но не вплотную
      const dx=player.x-enemy.x;
      const dy=player.y-enemy.y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      enemy.tx=enemy.x+dx/dist*100;
      enemy.ty=enemy.y+dy/dist*100;
      enemy.tx=Math.max(50,Math.min(canvas.width-50,enemy.tx));
      enemy.ty=Math.max(50,Math.min(canvas.height-50,enemy.ty));
    }
  }
  
  // Движение к целевой точке с обходом препятствий
  const dx=enemy.tx-enemy.x;
  const dy=enemy.ty-enemy.y;
  const dist=Math.sqrt(dx*dx+dy*dy);
  
  if(dist>5){
    const moveX=enemy.x+(dx/dist)*SPD*0.7;
    const moveY=enemy.y+(dy/dist)*SPD*0.7;
    
    // Проверяем препятствия по оси X
    if(!hitObs(moveX,enemy.y,12)){
      enemy.x=moveX;
    }else{
      // Если уперлись - меняем целевую точку
      enemy.ty+=50*(Math.random()>0.5?1:-1);
      enemy.ty=Math.max(50,Math.min(canvas.height-50,enemy.ty));
    }
    
    // Проверяем препятствия по оси Y
    if(!hitObs(enemy.x,moveY,12)){
      enemy.y=moveY;
    }else{
      enemy.tx+=50*(Math.random()>0.5?1:-1);
      enemy.tx=Math.max(50,Math.min(canvas.width-50,enemy.tx));
    }
  }
  
  // Границы
  enemy.x=Math.max(12,Math.min(canvas.width-12,enemy.x));
  enemy.y=Math.max(12,Math.min(canvas.height-12,enemy.y));
}

function gameLoop(){
  if(!gameActive){requestAnimationFrame(gameLoop);return}
  
  // Игрок
  if(player.alive){
    let nx=player.x,ny=player.y;
    if(keys['KeyW']||keys['ArrowUp'])ny-=SPD;
    if(keys['KeyS']||keys['ArrowDown'])ny+=SPD;
    if(keys['KeyA']||keys['ArrowLeft'])nx-=SPD;
    if(keys['KeyD']||keys['ArrowRight'])nx+=SPD;
    nx=Math.max(12,Math.min(canvas.width-12,nx));
    ny=Math.max(12,Math.min(canvas.height-12,ny));
    if(!hitObs(nx,player.y,10))player.x=nx;
    if(!hitObs(player.x,ny,10))player.y=ny;
  }
  
  // Бот AI
  botAI();
  
  // Пули
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.dx;b.y+=b.dy;b.life--;
    let rem=b.life<=0||b.x<0||b.x>canvas.width||b.y<0||b.y>canvas.height||hitObs(b.x,b.y,BR);
    if(!rem){
      const t=b.enemy?player:enemy;
      if(t.alive&&Math.abs(b.x-t.x)<14&&Math.abs(b.y-t.y)<14){
        rem=true;
        if(b.enemy){
          player.hp-=DMG;
          if(player.hp<=0){
            player.alive=false;
            scoreC++;
            setTimeout(()=>{
              if(scoreC<MAX_SCORE){
                player.x=200;player.y=270;player.hp=MAX_HP;player.alive=true;
              }
            },1500);
            checkWin();
          }
        }else{
          enemy.hp-=DMG;
          if(enemy.hp<=0){
            enemy.alive=false;
            scoreH++;
            setTimeout(()=>{
              if(scoreH<MAX_SCORE){
                enemy.x=760;enemy.y=270;enemy.hp=MAX_HP;enemy.alive=true;
              }
            },1500);
            checkWin();
          }
        }
      }
    }
    if(rem)bullets.splice(i,1);
  }
  
  // Отрисовка
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  
  // Сетка
  ctx.strokeStyle='#111';
  for(let i=0;i<canvas.width;i+=24){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,canvas.height);ctx.stroke()}
  for(let j=0;j<canvas.height;j+=24){ctx.beginPath();ctx.moveTo(0,j);ctx.lineTo(canvas.width,j);ctx.stroke()}
  
  // Препятствия
  ctx.fillStyle='#1a1a2e';
  obstacles.forEach(o=>{ctx.fillRect(o.x,o.y,o.w,o.h);ctx.strokeStyle='#333';ctx.strokeRect(o.x,o.y,o.w,o.h)});
  
  // Пули
  bullets.forEach(b=>{ctx.fillStyle=b.enemy?'#f0f':'#ff0';ctx.beginPath();ctx.arc(b.x,b.y,BR,0,Math.PI*2);ctx.fill()});
  
  // Игрок
  if(player.alive){
    ctx.fillStyle='#0f0';
    ctx.fillRect(player.x-10,player.y-10,20,20);
    ctx.fillStyle='#fff';
    ctx.font='10px monospace';
    ctx.textAlign='center';
    ctx.fillText(Math.max(0,player.hp),player.x,player.y-16);
  }
  
  // Бот
  if(enemy.alive){
    ctx.fillStyle='#f00';
    ctx.fillRect(enemy.x-10,enemy.y-10,20,20);
    ctx.fillStyle='#fff';
    ctx.font='10px monospace';
    ctx.textAlign='center';
    ctx.fillText(Math.max(0,enemy.hp),enemy.x,enemy.y-16);
  }
  
  // HP бар
  document.getElementById('hp-fill').style.width=Math.max(0,player.hp)+'%';
  document.getElementById('hp-fill').style.background=player.hp>50?'#0f0':player.hp>25?'#fa0':'#f00';
  document.getElementById('hp-text').textContent=Math.max(0,player.hp)+' / '+MAX_HP;
  
  // Счёт
  document.getElementById('score-host').innerHTML=scoreH+'<span class="score-label">ТЫ</span>';
  document.getElementById('score-client').innerHTML=scoreC+'<span class="score-label">БОТ</span>';
  
  requestAnimationFrame(gameLoop);
}

function checkWin(){
  if(scoreH>=MAX_SCORE){
    gameActive=false;
    document.getElementById('final-title').textContent='🏆 ТЫ ПОБЕДИЛ!';
    document.getElementById('final-title').style.color='#0f0';
    document.getElementById('final-score').textContent='ТЫ '+scoreH+' : '+scoreC+' БОТ';
    document.getElementById('final-screen').style.display='flex';
  }
  if(scoreC>=MAX_SCORE){
    gameActive=false;
    document.getElementById('final-title').textContent='💀 ТЫ ПРОИГРАЛ';
    document.getElementById('final-title').style.color='#f00';
    document.getElementById('final-score').textContent='ТЫ '+scoreH+' : '+scoreC+' БОТ';
    document.getElementById('final-screen').style.display='flex';
  }
}
</script>
</body>
</html>
