<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>KArena</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;overflow:hidden;width:100vw;height:100vh}
#game-container{position:relative;width:100%;height:100%;background:#000;font-family:monospace;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5}
#scoreboard{position:absolute;top:20px;left:50%;transform:translateX(-50%);display:flex;gap:20px}
.score-box{background:rgba(0,0,0,.8);border:2px solid #0f0;color:#0f0;padding:10px 24px;font-size:24px;font-weight:bold;min-width:120px;text-align:center}
.score-box.red{border-color:#f00;color:#f00}
.score-label{font-size:12px;display:block;margin-top:4px;opacity:.7}
#hp-container{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);width:400px;display:flex;flex-direction:column;gap:8px}
.hp-row{display:flex;align-items:center;gap:10px}
.hp-label{color:#fff;font-size:14px;font-weight:bold;width:60px}
.hp-bar{flex:1;height:20px;background:#111;border:2px solid #0f0;position:relative}
.hp-fill{height:100%;transition:width .2s}
.hp-fill.green{background:#0f0;border:none}
.hp-fill.red{background:#f00;border-color:#f00}
.hp-text{color:#fff;font-size:14px;font-weight:bold;width:50px;text-align:right}
#start-screen{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:20}
#start-title{font-size:64px;color:#0f0;margin-bottom:40px;text-shadow:0 0 20px #0f0}
.weapon-select{display:flex;gap:20px;margin-bottom:30px}
.weapon-btn{background:#000;color:#0f0;border:3px solid #0f0;padding:20px 35px;font-size:18px;font-weight:bold;cursor:pointer;font-family:monospace}
.weapon-btn:hover{background:#0f0;color:#000}
.weapon-btn.selected{background:#0f0;color:#000}
.weapon-info{color:#8f8;font-size:14px;margin-bottom:20px;text-align:center;max-width:500px;line-height:1.6}
#start-btn{background:#0f0;color:#000;border:none;padding:20px 50px;font-size:22px;font-weight:bold;cursor:pointer;font-family:monospace}
#start-btn:hover{background:#8f8}
#final-screen{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.92);display:none;flex-direction:column;justify-content:center;align-items:center;z-index:20}
#final-title{font-size:48px;font-weight:bold;margin-bottom:30px}
#final-score{font-size:28px;color:#fff;margin-bottom:40px}
#btn-restart{background:#0f0;color:#000;border:none;padding:20px 50px;font-size:22px;font-weight:bold;cursor:pointer;font-family:monospace}
#ammo-bar{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);display:flex;gap:4px}
.ammo-pip{width:10px;height:10px;background:#0f0;border:1px solid #0f0}
.ammo-pip.empty{background:#333;border-color:#333}
#reload-msg{position:absolute;bottom:130px;left:50%;transform:translateX(-50%);color:#fa0;font-size:16px;font-weight:bold;display:none}
#weapon-name{position:absolute;top:20px;right:20px;color:#0f0;font-size:18px;font-weight:bold}
#weapon-hint{position:absolute;bottom:20px;right:20px;color:#888;font-size:12px}
#scope-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle,transparent 200px,rgba(0,0,0,.9) 500px);pointer-events:none;display:none;z-index:15}
#map-select-screen{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);display:none;flex-direction:column;justify-content:center;align-items:center;z-index:25}
#map-title{font-size:48px;color:#0f0;margin-bottom:30px;text-shadow:0 0 20px #0f0}
.map-select{display:flex;gap:20px;margin-bottom:30px;flex-wrap:wrap;justify-content:center}
.map-btn{background:#000;color:#0f0;border:2px solid #0f0;padding:20px 30px;font-size:16px;font-weight:bold;cursor:pointer;font-family:monospace;min-width:180px}
.map-btn:hover{background:#0f0;color:#000}
.map-btn.selected{background:#0f0;color:#000}
.map-desc{color:#8f8;font-size:13px;margin-bottom:20px;text-align:center;max-width:600px;line-height:1.5}
</style>
</head>
<body>
<div id="game-container">
<canvas id="gameCanvas"></canvas>
<div id="scope-overlay"></div>
<div id="start-screen">
<div id="start-title">KArena⚔️</div>
<div class="weapon-select">
<button class="weapon-btn" id="btnSniper" onclick="selectWeapon('sniper')">СНАЙПЕРКА</button>
<button class="weapon-btn" id="btnSMG" onclick="selectWeapon('smg')">ПП</button>
<button class="weapon-btn" id="btnShotgun" onclick="selectWeapon('shotgun')">ДРОБОВИК</button>
</div>
<div class="weapon-info" id="weaponInfo">
Выбери оружие для старта
</div>
<button id="start-btn" disabled>ВЫБРАТЬ КАРТУ</button>
</div>
<div id="map-select-screen">
<div id="map-title">🗺️ ВЫБОР КАРТЫ</div>
<div class="map-select">
<button class="map-btn" onclick="selectMap('forest')">ЛЕС</button>
<button class="map-btn" onclick="selectMap('corridor')">КОРИДОР</button>
<button class="map-btn" onclick="selectMap('rooms')">КОМНАТЫ</button>
<button class="map-btn" onclick="selectMap('random')">🎲 СЛУЧАЙНО</button>
</div>
<div class="map-desc" id="mapDesc">
Нажми на карту чтобы выбрать
</div>
<button id="map-start-btn" disabled style="background:#0f0;color:#000;border:none;padding:20px 50px;font-size:22px;font-weight:bold;cursor:pointer;font-family:monospace">НАЧАТЬ ИГРУ</button>
</div>
<div id="hud">
<div id="scoreboard">
<div class="score-box" id="score-host">0<span class="score-label">ТЫ</span></div>
<div class="score-box red" id="score-client">0<span class="score-label">БОТ</span></div>
</div>
<div id="hp-container">
<div class="hp-row">
<div class="hp-label" style="color:#0f0">Ч</div>
<div class="hp-bar"><div class="hp-fill green" id="hp-fill-player" style="width:100%"></div></div>
<div class="hp-text" id="hp-text-player">100</div>
</div>
<div class="hp-row">
<div class="hp-label" style="color:#f00">БОТНОСТЬ</div>
<div class="hp-bar"><div class="hp-fill red" id="hp-fill-enemy" style="width:100%"></div></div>
<div class="hp-text" id="hp-text-enemy">100</div>
</div>
</div>
<div id="ammo-bar"></div>
<div id="reload-msg">ПЕРЕЗАРЯДКА...</div>
<div id="weapon-name"></div>
<div id="weapon-hint">ЛКМ — стрельба | Колёсико — смена</div>
</div>
<div id="final-screen">
<div id="final-title"></div>
<div id="final-score"></div>
<button id="btn-restart" style="background:#0f0;color:#000;border:none;padding:20px 50px;font-size:22px;font-weight:bold;cursor:pointer;font-family:monospace;margin-top:20px">ЕЩЁ РАЗ</button>
</div>
</div>
<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');

function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
resizeCanvas();window.addEventListener('resize',resizeCanvas);

let gameActive=false,player,enemy,keys={},bullets=[],obstacles=[],scoreH=0,scoreC=0;
let selectedWeapon=null,selectedMap=null,aiming=false,mouseX=0,mouseY=0;
let mouseDown=false,recoil=0,currentMapName='';

const WEAPONS={
  sniper:{name:'СНАЙПЕРКА',damage:50,scopedDamage:70,maxAmmo:3,reloadTime:5000,fireRate:2000,spread:0,recoilPerShot:0,maxRecoil:0,color:'#ff0'},
  smg:{name:'ПП',damage:6,maxAmmo:70,reloadTime:5000,fireRate:100,spread:0.08,recoilPerShot:0.8,maxRecoil:15,color:'#f0f'},
  shotgun:{name:'ДРОБОВИК',damage:3,maxAmmo:10,reloadTime:5000,fireRate:3000,spread:0.6,pellets:20,recoilPerShot:0,maxRecoil:0,color:'#fa0'}
};
const WEAPON_ORDER=['sniper','smg','shotgun'];

const MAPS={
  forest:{name:'ЛЕС',desc:'Открытая местность с редкими деревьями',color:'#1a3a1a',obstacleColor:'#2d5a2d',obstacleBorder:'#3d7a3d',spawnPlayer:{x:0.1,y:0.5},spawnEnemy:{x:0.9,y:0.5},obstacles:[{x:0.25,y:0.2,w:0.06,h:0.25},{x:0.7,y:0.2,w:0.06,h:0.25},{x:0.25,y:0.55,w:0.06,h:0.25},{x:0.7,y:0.55,w:0.06,h:0.25},{x:0.45,y:0.4,w:0.1,h:0.2},{x:0.5,y:0.15,w:0.05,h:0.05},{x:0.3,y:0.7,w:0.05,h:0.05},{x:0.65,y:0.75,w:0.05,h:0.05}]},
  corridor:{name:'КОРИДОР',desc:'Открытый центр + кармашки по бокам',color:'#2a2a3a',obstacleColor:'#3d3d5a',obstacleBorder:'#4d4d7a',spawnPlayer:{x:0.12,y:0.15},spawnEnemy:{x:0.88,y:0.85},obstacles:[{x:0.15,y:0,w:0.1,h:0.3},{x:0.15,y:0.7,w:0.1,h:0.3},{x:0.75,y:0,w:0.1,h:0.3},{x:0.75,y:0.7,w:0.1,h:0.3},{x:0.35,y:0.45,w:0.3,h:0.1}]},
  rooms:{name:'КОМНАТЫ',desc:'Домность',color:'#3a3a2a',obstacleColor:'#5a5a3d',obstacleBorder:'#7a7a4d',spawnPlayer:{x:0.08,y:0.5},spawnEnemy:{x:0.92,y:0.5},obstacles:[{x:0.3,y:0.15,w:0.4,h:0.08},{x:0.3,y:0.77,w:0.4,h:0.08},{x:0.3,y:0.15,w:0.08,h:0.7},{x:0.62,y:0.15,w:0.08,h:0.7},{x:0.46,y:0.42,w:0.08,h:0.16},{x:0.15,y:0.35,w:0.1,h:0.3},{x:0.75,y:0.35,w:0.1,h:0.3}]}
};

const MAX_SCORE=5,MAX_HP=100,SPD=5,BSPD=10,BR=5;
let lastPlayerX, lastPlayerY, lastLastPlayerX, lastLastPlayerY;

function selectWeapon(weapon){
  selectedWeapon=weapon;
  document.getElementById('btnSniper').classList.toggle('selected',weapon==='sniper');
  document.getElementById('btnSMG').classList.toggle('selected',weapon==='smg');
  document.getElementById('btnShotgun').classList.toggle('selected',weapon==='shotgun');
  document.getElementById('start-btn').disabled=false;
  const w=WEAPONS[weapon];
  let info='';
  if(weapon==='sniper')info='🎯 Урон: 50 | Патроны: 3 | Скорострельность: 2 сек<br>🔭 ПКМ: прицел (70 урона, 3x скорость пули, -50% скорости)';
  else if(weapon==='smg')info='🔫 Урон: 6 | Патроны: 70 | Скорострельность: 10/сек<br>📈 Отдача накапливается при зажиме';
  else if(weapon==='shotgun')info='💥 Дробовик: 20 пуль | Урон: 3 за пулю | Патроны: 10<br>⏱ Перезарядка: 3 сек | 🔀 Огромный разброс';
  document.getElementById('weaponInfo').innerHTML=info;
}

function selectMap(map){
  selectedMap=map;
  document.querySelectorAll('.map-btn').forEach(btn=>btn.classList.remove('selected'));
  event.target.classList.add('selected');
  if(map==='random'){
    const keys=Object.keys(MAPS).filter(k=>k!=='random');
    selectedMap=keys[Math.floor(Math.random()*keys.length)];
    document.getElementById('mapDesc').innerHTML='🎲 Выбрана: <b style="color:#0f0">'+MAPS[selectedMap].name+'</b>';
  }else{
    document.getElementById('mapDesc').innerHTML=MAPS[map].desc;
  }
  document.getElementById('map-start-btn').disabled=false;
}

document.getElementById('start-btn').onclick=()=>{if(!selectedWeapon)return;document.getElementById('start-screen').style.display='none';document.getElementById('map-select-screen').style.display='flex';};
document.getElementById('map-start-btn').onclick=()=>{if(!selectedMap)return;document.getElementById('map-select-screen').style.display='none';startGame();};
document.getElementById('btn-restart').onclick=()=>{
  document.getElementById('final-screen').style.display='none';
  document.getElementById('start-screen').style.display='flex';
  selectedWeapon=null;selectedMap=null;
  document.getElementById('btnSniper').classList.remove('selected');
  document.getElementById('btnSMG').classList.remove('selected');
  document.getElementById('btnShotgun').classList.remove('selected');
  document.getElementById('start-btn').disabled=true;
  document.getElementById('weaponInfo').innerHTML='Выбери оружие для старта';
  document.querySelectorAll('.map-btn').forEach(btn=>btn.classList.remove('selected'));
  document.getElementById('mapDesc').innerHTML='Нажми на карту чтобы выбрать';
  document.getElementById('map-start-btn').disabled=true;
};

function switchWeapon(){
  if(!gameActive||!player.alive)return;
  const idx=WEAPON_ORDER.indexOf(player.weapon);
  const nextIdx=(idx+1)%WEAPON_ORDER.length;
  player.weapon=WEAPON_ORDER[nextIdx];
  const w=WEAPONS[player.weapon];
  player.ammo=w.maxAmmo;player.reloading=false;recoil=0;
  document.getElementById('reload-msg').style.display='none';
  document.getElementById('weapon-name').textContent=w.name;
  updateAmmo();
}

canvas.addEventListener('wheel',e=>{e.preventDefault();switchWeapon();});
canvas.addEventListener('contextmenu',e=>{e.preventDefault();if(gameActive&&player.alive&&player.weapon==='sniper'){aiming=true;document.getElementById('scope-overlay').style.display='block';}});
canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();mouseX=(e.clientX-r.left)*(canvas.width/r.width);mouseY=(e.clientY-r.top)*(canvas.height/r.height);});
canvas.addEventListener('mousedown',e=>{
  if(e.button===2){if(gameActive&&player.alive&&player.weapon==='sniper'){aiming=true;document.getElementById('scope-overlay').style.display='block';}return;}
  if(e.button===0){mouseDown=true;if(gameActive&&player.alive&&player.weapon==='sniper')shoot();}
});
document.addEventListener('mouseup',e=>{
  if(e.button===0)mouseDown=false;
  if(e.button===2){aiming=false;document.getElementById('scope-overlay').style.display='none';}
});

function startGame(){
  gameActive=true;scoreH=0;scoreC=0;bullets=[];recoil=0;mouseDown=false;aiming=false;
  const w=WEAPONS[selectedWeapon],map=MAPS[selectedMap];
  player={x:map.spawnPlayer.x*canvas.width,y:map.spawnPlayer.y*canvas.height,hp:MAX_HP,alive:true,lastShot:0,ammo:w.maxAmmo,reloading:false,reloadEnd:0,weapon:selectedWeapon};
  enemy={x:map.spawnEnemy.x*canvas.width,y:map.spawnEnemy.y*canvas.height,hp:MAX_HP,alive:true,lastShot:0,tx:map.spawnEnemy.x*canvas.width,ty:map.spawnEnemy.y*canvas.height,moveTimer:0,weapon:'smg+',damage:20,fireRate:400,strafeDir:1,strafeTimer:0};
  currentMapName=selectedMap;
  const cw=canvas.width,ch=canvas.height;
  obstacles=map.obstacles.map(o=>({x:o.x*cw,y:o.y*ch,w:o.w*cw,h:o.h*ch}));
  document.getElementById('weapon-name').textContent=w.name;
  lastPlayerX=player.x;lastPlayerY=player.y;
  lastLastPlayerX=player.x;lastLastPlayerY=player.y;
  updateAmmo();updateHP();
  window.onkeydown=e=>keys[e.code]=true;
  window.onkeyup=e=>keys[e.code]=false;
  gameLoop();
}

function shoot(){
  if(!gameActive||!player.alive||player.reloading)return;
  const w=WEAPONS[player.weapon],now=Date.now();
  if(now-player.lastShot<w.fireRate)return;
  if(player.ammo<=0){startReload();return;}
  player.lastShot=now;player.ammo--;updateAmmo();
  const a=Math.atan2(mouseY-player.y,mouseX-player.x);
  const damage=player.weapon==='sniper'&&aiming?w.scopedDamage:w.damage;
  const bulletSpeed=player.weapon==='sniper'&&aiming?BSPD*3:BSPD;
  if(player.weapon==='shotgun'){
    for(let i=0;i<w.pellets;i++){
      const spread=(Math.random()-0.5)*w.spread;
      bullets.push({x:player.x,y:player.y,dx:Math.cos(a+spread)*bulletSpeed,dy:Math.sin(a+spread)*bulletSpeed,life:60,damage:damage});
    }
  }else{
    const spread=(Math.random()-0.5)*w.spread;
    bullets.push({x:player.x,y:player.y,dx:Math.cos(a+spread)*bulletSpeed,dy:Math.sin(a+spread)*bulletSpeed,life:120,damage:damage});
  }
  if(player.ammo<=0)startReload();
}

function startReload(){
  const w=WEAPONS[player.weapon];
  player.reloading=true;player.reloadEnd=Date.now()+w.reloadTime;
  document.getElementById('reload-msg').style.display='block';
  setTimeout(()=>{if(gameActive&&player.alive){player.ammo=w.maxAmmo;player.reloading=false;document.getElementById('reload-msg').style.display='none';updateAmmo();}},w.reloadTime);
}

function updateAmmo(){
  const w=WEAPONS[player.weapon],bar=document.getElementById('ammo-bar');
  bar.innerHTML='';
  for(let i=0;i<Math.min(w.maxAmmo,30);i++){
    const pip=document.createElement('div');
    pip.className='ammo-pip'+(i<player.ammo?'':' empty');
    if(w.maxAmmo>20){pip.style.width='6px';pip.style.height='6px';}
    bar.appendChild(pip);
  }
}

function updateHP(){
  document.getElementById('hp-fill-player').style.width=Math.max(0,player.hp)/MAX_HP*100+'%';
  document.getElementById('hp-text-player').textContent=Math.max(0,player.hp);
  document.getElementById('hp-fill-enemy').style.width=Math.max(0,enemy.hp)/MAX_HP*100+'%';
  document.getElementById('hp-text-enemy').textContent=Math.max(0,enemy.hp);
}

function hitObs(x,y,r){return obstacles.some(o=>x+r>o.x&&x-r<o.x+o.w&&y+r>o.y&&y-r<o.y+o.h);}
function canSee(x1,y1,x2,y2){for(let i=0;i<=20;i++){const t=i/20;if(hitObs(x1+(x2-x1)*t,y1+(y2-y1)*t,5))return false;}return true;}

function botAI(){
  if(!enemy.alive)return;
  enemy.moveTimer--;enemy.strafeTimer--;
  
  const dx=player.x-enemy.x,dy=player.y-enemy.y,dist=Math.sqrt(dx*dx+dy*dy);
  
  // Предсказание с усреднением
  const velX=(player.x-lastPlayerX);
  const velY=(player.y-lastPlayerY);
  const avgVelX=(velX+(lastPlayerX-lastLastPlayerX))/2;
  const avgVelY=(velY+(lastPlayerY-lastLastPlayerY))/2;
  
  const flightTime=dist/BSPD;
  const predictX=player.x+avgVelX*flightTime*8;
  const predictY=player.y+avgVelY*flightTime*8;
  
  lastLastPlayerX=lastPlayerX;lastLastPlayerY=lastPlayerY;
  lastPlayerX=player.x;lastPlayerY=player.y;
  
  if(enemy.hp<20){
    const cornerX=enemy.x<canvas.width/2?canvas.width*0.05:canvas.width*0.95;
    const cornerY=enemy.y<canvas.height/2?canvas.height*0.05:canvas.height*0.95;
    enemy.tx=cornerX;enemy.ty=cornerY;
    const ddx=enemy.tx-enemy.x,ddy=enemy.ty-enemy.y,ddist=Math.sqrt(ddx*ddx+ddy*ddy);
    if(ddist>20){
      const moveX=enemy.x+(ddx/ddist)*SPD*0.7;
      const moveY=enemy.y+(ddy/ddist)*SPD*0.7;
      if(!hitObs(moveX,enemy.y,12))enemy.x=moveX;
      if(!hitObs(enemy.x,moveY,12))enemy.y=moveY;
    }
    return;
  }
  
  const hasLineOfSight=canSee(enemy.x,enemy.y,player.x,player.y);
  
  if(enemy.hp<MAX_HP*0.4){
    if(enemy.moveTimer<=0||!hasLineOfSight){
      enemy.moveTimer=40+Math.random()*20;
      const retreatAngle=Math.atan2(dy,dx)+Math.PI;
      const retreatDist=200+Math.random()*100;
      enemy.tx=enemy.x+Math.cos(retreatAngle)*retreatDist;
      enemy.ty=enemy.y+Math.sin(retreatAngle)*retreatDist;
      enemy.tx=Math.max(50,Math.min(canvas.width-50,enemy.tx));
      enemy.ty=Math.max(50,Math.min(canvas.height-50,enemy.ty));
    }
  }
  else if(hasLineOfSight){
    if(Date.now()-enemy.lastShot>enemy.fireRate*0.7){
      enemy.lastShot=Date.now();
      const a=Math.atan2(predictY-enemy.y,predictX-enemy.x);
      bullets.push({x:enemy.x,y:enemy.y,dx:Math.cos(a)*BSPD,dy:Math.sin(a)*BSPD,life:120,enemy:true,homing:0.01,damage:enemy.damage});
    }
    if(enemy.strafeTimer<=0){
      enemy.strafeTimer=30+Math.random()*30;
      enemy.strafeDir*=-1;
      const strafeAngle=Math.atan2(dy,dx)+enemy.strafeDir*Math.PI/2;
      const strafeDist=80+Math.random()*60;
      enemy.tx=enemy.x+Math.cos(strafeAngle)*strafeDist;
      enemy.ty=enemy.y+Math.sin(strafeAngle)*strafeDist;
      enemy.tx=Math.max(50,Math.min(canvas.width-50,enemy.tx));
      enemy.ty=Math.max(50,Math.min(canvas.height-50,enemy.ty));
    }
  }
  else{
    if(enemy.moveTimer<=0){
      enemy.moveTimer=30;
      enemy.tx=enemy.x+dx/dist*120;
      enemy.ty=enemy.y+dy/dist*120;
      enemy.tx=Math.max(50,Math.min(canvas.width-50,enemy.tx));
      enemy.ty=Math.max(50,Math.min(canvas.height-50,enemy.ty));
    }
  }
  
  const tdx=enemy.tx-enemy.x,tdy=enemy.ty-enemy.y,tdist=Math.sqrt(tdx*tdx+tdy*tdy);
  if(tdist>5){
    const moveX=enemy.x+(tdx/tdist)*SPD*0.75;
    const moveY=enemy.y+(tdy/tdist)*SPD*0.75;
    if(!hitObs(moveX,enemy.y,20))enemy.x=moveX;else{enemy.ty+=80*(Math.random()>0.5?1:-1);enemy.ty=Math.max(50,Math.min(canvas.height-50,enemy.ty));}
    if(!hitObs(enemy.x,moveY,20))enemy.y=moveY;else{enemy.tx+=80*(Math.random()>0.5?1:-1);enemy.tx=Math.max(50,Math.min(canvas.width-50,enemy.tx));}
  }
  enemy.x=Math.max(20,Math.min(canvas.width-20,enemy.x));
  enemy.y=Math.max(20,Math.min(canvas.height-20,enemy.y));
}

function gameLoop(){
  if(!gameActive){requestAnimationFrame(gameLoop);return}
  const w=WEAPONS[player.weapon];
  if(player.reloading&&Date.now()>player.reloadEnd){player.ammo=w.maxAmmo;player.reloading=false;recoil=0;document.getElementById('reload-msg').style.display='none';updateAmmo();}
  if(recoil>0){recoil=Math.max(0,recoil-0.3);if(recoil<=0.1)recoil=0;}
  if(mouseDown&&player.weapon!=='sniper')shoot();
  if(player.alive){
    let nx=player.x,ny=player.y;
    const moveSpd=aiming?SPD*0.5:SPD;
    if(keys['KeyW']||keys['ArrowUp'])ny-=moveSpd;
    if(keys['KeyS']||keys['ArrowDown'])ny+=moveSpd;
    if(keys['KeyA']||keys['ArrowLeft'])nx-=moveSpd;
    if(keys['KeyD']||keys['ArrowRight'])nx+=moveSpd;
    nx=Math.max(12,Math.min(canvas.width-12,nx));
    ny=Math.max(12,Math.min(canvas.height-12,ny));
    if(!hitObs(nx,player.y,10))player.x=nx;
    if(!hitObs(player.x,ny,10))player.y=ny;
  }
  botAI();
  const map=MAPS[currentMapName];
  ctx.fillStyle=map?map.color:'#000';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle='#111';const gridSize=40;
  for(let i=0;i<canvas.width;i+=gridSize){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,canvas.height);ctx.stroke()}
  for(let j=0;j<canvas.height;j+=gridSize){ctx.beginPath();ctx.moveTo(0,j);ctx.lineTo(canvas.width,j);ctx.stroke()}
  if(map){obstacles.forEach(o=>{ctx.fillStyle=map.obstacleColor;ctx.fillRect(o.x,o.y,o.w,o.h);ctx.strokeStyle=map.obstacleBorder;ctx.lineWidth=2;ctx.strokeRect(o.x,o.y,o.w,o.h);ctx.lineWidth=1;});}
  if(aiming&&player.weapon==='sniper'&&player.alive){const a=Math.atan2(mouseY-player.y,mouseX-player.x);ctx.strokeStyle='rgba(255,0,0,.8)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(player.x,player.y);ctx.lineTo(player.x+Math.cos(a)*1000,player.y+Math.sin(a)*1000);ctx.stroke();ctx.lineWidth=1;}
  bullets.forEach(b=>{ctx.fillStyle=b.enemy?'#f0f':(b.damage>=70?'#f00':b.damage===50?'#ff0':b.damage===3?'#fff':'#f0f');ctx.beginPath();ctx.arc(b.x,b.y,BR,0,Math.PI*2);ctx.fill()});
  if(player.alive){ctx.fillStyle='#0f0';ctx.beginPath();ctx.arc(player.x,player.y,14,0,Math.PI*2);ctx.fill();}
  if(enemy.alive){ctx.fillStyle='#f00';ctx.beginPath();ctx.arc(enemy.x,enemy.y,14,0,Math.PI*2);ctx.fill();}
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    if(b.enemy&&b.homing&&player.alive){const a=Math.atan2(player.y-b.y,player.x-b.x),curA=Math.atan2(b.dy,b.dx),diff=a-curA,turn=Math.max(-b.homing,Math.min(b.homing,diff)),newA=curA+turn;b.dx=Math.cos(newA)*BSPD;b.dy=Math.sin(newA)*BSPD;}
    b.x+=b.dx;b.y+=b.dy;b.life--;
    let rem=b.life<=0||b.x<0||b.x>canvas.width||b.y<0||b.y>canvas.height||hitObs(b.x,b.y,BR);
    if(!rem){
      const t=b.enemy?player:enemy;
      if(t.alive&&Math.abs(b.x-t.x)<16&&Math.abs(b.y-t.y)<16){
        rem=true;const dmg=b.damage||50;
        if(b.enemy){player.hp-=dmg;if(player.hp<=0){player.alive=false;scoreC++;setTimeout(()=>{if(scoreC<MAX_SCORE){const map=MAPS[currentMapName];player.x=map.spawnPlayer.x*canvas.width;player.y=map.spawnPlayer.y*canvas.height;player.hp=MAX_HP;player.alive=true;}},1500);checkWin();}}
        else{enemy.hp-=dmg;if(enemy.hp<=0){enemy.alive=false;scoreH++;setTimeout(()=>{if(scoreH<MAX_SCORE){const map=MAPS[currentMapName];enemy.x=map.spawnEnemy.x*canvas.width;enemy.y=map.spawnEnemy.y*canvas.height;enemy.hp=MAX_HP;enemy.alive=true;}},1500);checkWin();}}
        updateHP();
      }
    }
    if(rem)bullets.splice(i,1);
  }
  updateHP();
  document.getElementById('score-host').innerHTML=scoreH+'<span class="score-label">ТЫ</span>';
  document.getElementById('score-client').innerHTML=scoreC+'<span class="score-label">БОТ</span>';
  requestAnimationFrame(gameLoop);
}

function checkWin(){
  if(scoreH>=MAX_SCORE){gameActive=false;document.getElementById('final-title').textContent='🏆 ТЫ ПОБЕДИЛ!';document.getElementById('final-title').style.color='#0f0';document.getElementById('final-score').textContent='ТЫ '+scoreH+' : '+scoreC+' БОТ';document.getElementById('final-screen').style.display='flex';}
  if(scoreC>=MAX_SCORE){gameActive=false;document.getElementById('final-title').textContent='💀 ТЫ ПРОИГРАЛ';document.getElementById('final-title').style.color='#f00';document.getElementById('final-score').textContent='ТЫ '+scoreH+' : '+scoreC+' БОТ';document.getElementById('final-screen').style.display='flex';}
}
</script>
