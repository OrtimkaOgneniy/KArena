<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KArena</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{overflow:hidden;background:#071018;font-family:Arial,Helvetica,sans-serif}
canvas{display:block;width:100vw;height:100vh;cursor:crosshair}

#start-screen,#end-screen{
  position:fixed;
  inset:0;
  z-index:30;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#fff;
  background:rgba(3,8,14,.95);
}

#end-screen{display:none}

#title{
  color:#58ff82;
  font-size:clamp(52px,8vw,92px);
  font-weight:900;
  letter-spacing:2px;
  margin-bottom:32px;
  text-shadow:0 0 25px rgba(50,255,110,.95);
}

button{
  border:2px solid #59ff84;
  border-radius:10px;
  padding:16px 34px;
  background:#11251a;
  color:#9dffb4;
  cursor:pointer;
  font-size:18px;
  font-weight:800;
  transition:.15s;
}

button:hover{
  transform:translateY(-2px);
  background:#59ff84;
  color:#07150c;
}

#result{
  margin-bottom:24px;
  font-size:22px;
  color:#e8f4ff;
}

#hud{
  position:fixed;
  inset:0;
  z-index:10;
  pointer-events:none;
  color:#fff;
  font-weight:800;
  text-shadow:0 2px 3px #000;
}

#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  width:18px;
  height:18px;
  transform:translate(-50%,-50%);
}

#crosshair:before,#crosshair:after{
  content:"";
  position:absolute;
  background:#fff;
  box-shadow:0 0 5px #000;
}

#crosshair:before{
  left:8px;
  top:0;
  width:2px;
  height:18px;
}

#crosshair:after{
  left:0;
  top:8px;
  width:18px;
  height:2px;
}

#top-score{
  position:absolute;
  left:50%;
  top:18px;
  display:flex;
  gap:14px;
  transform:translateX(-50%);
}

.score-box{
  min-width:106px;
  padding:9px 18px;
  text-align:center;
  font-size:24px;
  color:#70ff96;
  border:2px solid #57ff82;
  border-radius:8px;
  background:rgba(0,0,0,.42);
}

.score-box.bot{
  color:#ff7777;
  border-color:#ff5555;
}

#weapon-name{
  position:absolute;
  top:22px;
  left:22px;
  color:#a9ffba;
  font-size:18px;
}

#ammo{
  position:absolute;
  right:22px;
  bottom:23px;
  color:#a9ffba;
  font-size:26px;
}

#dash{
  position:absolute;
  bottom:40px;
  left:50%;
  transform:translateX(-50%);
  color:#78ff9b;
}

#reload{
  position:absolute;
  bottom:74px;
  left:50%;
  display:none;
  transform:translateX(-50%);
  color:#ffdb64;
}

#player-panel{
  position:absolute;
  bottom:24px;
  left:22px;
  width:285px;
}

#enemy-panel{
  position:absolute;
  top:22px;
  right:22px;
  width:220px;
}

.label{
  margin-bottom:5px;
  font-size:13px;
}

.bar{
  height:18px;
  overflow:hidden;
  border:2px solid #fff;
  border-radius:5px;
  background:rgba(0,0,0,.48);
}

.fill{
  width:100%;
  height:100%;
  transition:width .12s;
}

#player-fill{background:#48ee70}
#enemy-fill{background:#ff4b4b}

#damage{
  position:fixed;
  inset:0;
  z-index:9;
  opacity:0;
  pointer-events:none;
  background:radial-gradient(circle,transparent 42%,rgba(255,0,0,.58) 120%);
  transition:opacity .12s;
}

#hit{
  position:absolute;
  top:50%;
  left:50%;
  display:none;
  transform:translate(-50%,-50%);
  color:#fff;
  font-size:44px;
  text-shadow:0 0 8px #000;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="start-screen">
  <div id="title">KArena</div>
  <button id="start-button">НАЧАТЬ ИГРУ</button>
</div>

<div id="end-screen">
  <div id="title">КОНЕЦ</div>
  <div id="result"></div>
  <button id="restart-button">ЕЩЁ РАЗ</button>
</div>

<div id="hud">
  <div id="damage"></div>
  <div id="crosshair"></div>
  <div id="hit">✕</div>

  <div id="top-score">
    <div class="score-box">
      <span id="your-score">0</span><br>
      <small>ТЫ</small>
    </div>

    <div class="score-box bot">
      <span id="bot-score">0</span><br>
      <small>БОТ</small>
    </div>
  </div>

  <div id="weapon-name">ПП</div>
  <div id="ammo">30 / 30</div>
  <div id="dash">РЫВОК ГОТОВ — Q</div>
  <div id="reload">ПЕРЕЗАРЯДКА...</div>

  <div id="player-panel">
    <div class="label">ТЫ: <span id="player-hp">100</span></div>
    <div class="bar"><div class="fill" id="player-fill"></div></div>
  </div>

  <div id="enemy-panel">
    <div class="label">БОТ: <span id="enemy-hp">100</span></div>
    <div class="bar"><div class="fill" id="enemy-fill"></div></div>
  </div>
</div>

<script>
"use strict";

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resizeCanvas(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize",resizeCanvas);

const WORLD_SIZE=1800;
const ARENA_RADIUS=820;
const PLAYER_RADIUS=22;
const BOT_RADIUS=24;
const PLAYER_HEIGHT=105;
const BOT_HEIGHT=115;
const MAX_HP=100;
const MAX_SCORE=5;
const MOVE_SPEED=145;
const BOT_SPEED=105;
const GRAVITY=1150;
const JUMP_SPEED=410;
const BULLET_SPEED=780;
const FOV=Math.PI*.70;

const weapons={
  smg:{
    name:"ПП",
    damage:6,
    maxAmmo:30,
    fireRate:105,
    reloadTime:1400,
    spread:.025,
    bulletSpeed:900,
    color:"#ff4de4"
  },

  shotgun:{
    name:"ДРОБОВИК",
    damage:4,
    maxAmmo:10,
    fireRate:700,
    reloadTime:1650,
    spread:.20,
    pellets:14,
    bulletSpeed:720,
    color:"#ffaf4d"
  },

  sniper:{
    name:"СНАЙПЕРКА",
    damage:50,
    scopedDamage:70,
    maxAmmo:3,
    fireRate:900,
    reloadTime:1900,
    spread:.002,
    bulletSpeed:1350,
    color:"#ffe64d"
  }
};

const weaponOrder=["smg","shotgun","sniper"];

const map={
  floor:"#1b3025",
  sky:"#091116",
  wall:"#496c58",
  wallLight:"#8bc49a",
  wallDark:"#304b3b",

  blocks:[
    {x:-160,y:-140,w:240,h:240,h:190},
    {x:-360,y:0,w:120,h:320,h:160},
    {x:360,y:0,w:120,h:320,h:160},
    {x:0,y:-360,w:360,h:100,h:115},
    {x:0,y:360,w:360,h:100,h:115},

    {x:-580,y:-430,w:160,h:80,h:95},
    {x:580,y:-430,w:160,h:80,h:95},
    {x:-580,y:430,w:160,h:80,h:95},
    {x:580,y:430,w:160,h:80,h:95},

    {x:-560,y:-90,w:90,h:160,h:125},
    {x:560,y:90,w:90,h:160,h:125},

    {x:-110,y:-610,w:180,h:80,h:100},
    {x:110,y:610,w:180,h:80,h:100},

    {x:-310,y:-570,w:90,h:130,h:110},
    {x:310,y:570,w:90,h:130,h:110},
    {x:-310,y:570,w:90,h:130,h:110},
    {x:310,y:-570,w:90,h:130,h:110}
  ]
};

let gameActive=false;
let controlsLocked=false;
let selectedWeapon="smg";
let aiming=false;
let lastFrame=performance.now();
let keys={};
let bullets=[];
let particles=[];
let scoreYou=0;
let scoreBot=0;

let player={
  x:-700,
  y:0,
  z:0,
  vz:0,
  grounded:true,
  angle:0,
  pitch:0,
  hp:MAX_HP,
  ammo:30,
  reloading:false,
  reloadEnd:0,
  lastShot:0,
  dashReady:0,
  dashTime:0,
  dashDirX:0,
  dashDirY:0
};

let bot={
  x:700,
  y:0,
  hp:MAX_HP,
  ammo:30,
  reloading:false,
  reloadEnd:0,
  lastShot:0,
  strafeDirection:1,
  strafeTimer:0,
  stuckTimer:0,
  lastX:700,
  lastY:0
};

function rectCircleCollision(x,y,r,rect){
  const nearestX=Math.max(
    rect.x-rect.w/2,
    Math.min(x,rect.x+rect.w/2)
  );

  const nearestY=Math.max(
    rect.y-rect.h/2,
    Math.min(y,rect.y+rect.h/2)
  );

  const dx=x-nearestX;
  const dy=y-nearestY;

  return dx*dx+dy*dy<r*r;
}

function isBlocked(x,y,radius){
  if(Math.hypot(x,y)>ARENA_RADIUS-radius){
    return true;
  }

  for(const block of map.blocks){
    if(rectCircleCollision(x,y,radius,block)){
      return true;
    }
  }

  return false;
}

function segmentHitsWall(x1,y1,x2,y2){
  const distance=Math.hypot(x2-x1,y2-y1);
  const steps=Math.max(2,Math.ceil(distance/8));

  for(let i=1;i<steps;i++){
    const t=i/steps;
    const px=x1+(x2-x1)*t;
    const py=y1+(y2-y1)*t;

    for(const block of map.blocks){
      if(
        px>block.x-block.w/2&&
        px<block.x+block.w/2&&
        py>block.y-block.h/2&&
        py<block.y+block.h/2
      ){
        return true;
      }
    }
  }

  return false;
}

function botCanSeePlayer(){
  return !segmentHitsWall(bot.x,bot.y,player.x,player.y);
}

function playerCanSeeBot(){
  return !segmentHitsWall(player.x,player.y,bot.x,bot.y);
}

function validSpawn(side){
  const options=side==="player"
    ?[
      {x:-720,y:-470},
      {x:-720,y:470},
      {x:-720,y:0}
    ]
    :[
      {x:720,y:470},
      {x:720,y:-470},
      {x:720,y:0}
    ];

  for(const spawn of options){
    if(!isBlocked(spawn.x,spawn.y,PLAYER_RADIUS)){
      return spawn;
    }
  }

  return side==="player"
    ?{x:-700,y:0}
    :{x:700,y:0};
}

function resetRound(){
  const playerSpawn=validSpawn("player");
  const botSpawn=validSpawn("bot");

  player.x=playerSpawn.x;
  player.y=playerSpawn.y;
  player.z=0;
  player.vz=0;
  player.grounded=true;
  player.angle=0;
  player.pitch=0;
  player.hp=MAX_HP;
  player.ammo=weapons[selectedWeapon].maxAmmo;
  player.reloading=false;
  player.dashReady=0;
  player.dashTime=0;

  bot.x=botSpawn.x;
  bot.y=botSpawn.y;
  bot.lastX=bot.x;
  bot.lastY=bot.y;
  bot.hp=MAX_HP;
  bot.ammo=30;
  bot.reloading=false;
  bot.lastShot=0;
  bot.strafeDirection=1;
  bot.strafeTimer=0;

  bullets=[];
  particles=[];
  aiming=false;

  updateHud();
}

function startGame(){
  selectedWeapon="smg";
  scoreYou=0;
  scoreBot=0;
  gameActive=true;

  document.getElementById("start-screen").style.display="none";
  document.getElementById("end-screen").style.display="none";

  resetRound();

  canvas.focus();
  canvas.requestPointerLock();

  lastFrame=performance.now();
  requestAnimationFrame(loop);
}

document.getElementById("start-button").addEventListener("click",startGame);
document.getElementById("restart-button").addEventListener("click",startGame);

document.addEventListener("pointerlockchange",()=>{
  controlsLocked=document.pointerLockElement===canvas;
});

canvas.addEventListener("click",()=>{
  if(gameActive&&!controlsLocked){
    canvas.requestPointerLock();
  }
});

document.addEventListener("mousemove",event=>{
  if(!gameActive||!controlsLocked)return;

  player.angle+=event.movementX*.0017;
  player.pitch-=event.movementY*.0012;
  player.pitch=Math.max(-.35,Math.min(.35,player.pitch));
});

document.addEventListener("keydown",event=>{
  keys[event.code]=true;

  if(event.code==="Space"){
    event.preventDefault();
    jump();
  }

  if(event.code==="KeyQ"){
    dash();
  }

  if(event.code==="KeyR"){
    startReload();
  }
});

document.addEventListener("keyup",event=>{
  keys[event.code]=false;
});

canvas.addEventListener("contextmenu",event=>event.preventDefault());

canvas.addEventListener("mousedown",event=>{
  if(!gameActive)return;

  if(!controlsLocked){
    canvas.requestPointerLock();
    return;
  }

  if(event.button===0){
    shoot();
  }

  if(event.button===2&&selectedWeapon==="sniper"){
    aiming=true;
  }
});

document.addEventListener("mouseup",event=>{
  if(event.button===2){
    aiming=false;
  }
});

canvas.addEventListener("wheel",event=>{
  if(!gameActive)return;

  event.preventDefault();

  const index=weaponOrder.indexOf(selectedWeapon);
  const direction=event.deltaY>0?1:-1;
  const next=(index+direction+weaponOrder.length)%weaponOrder.length;

  selectedWeapon=weaponOrder[next];
  player.ammo=weapons[selectedWeapon].maxAmmo;
  player.reloading=false;
  aiming=false;

  document.getElementById("reload").style.display="none";
  updateHud();
},{passive:false});

function jump(){
  if(!gameActive||!controlsLocked||!player.grounded)return;

  player.vz=JUMP_SPEED;
  player.grounded=false;

  spawnParticles(player.x,player.y,"#d9ffff",12);
}

function dash(){
  const now=performance.now();

  if(
    !gameActive||
    !controlsLocked||
    player.dashTime>0||
    now<player.dashReady
  ){
    return;
  }

  player.dashTime=.12;
  player.dashReady=now+3000;

  player.dashDirX=Math.cos(player.angle);
  player.dashDirY=Math.sin(player.angle);

  spawnParticles(player.x,player.y,"#56ff83",28);
}

function startReload(){
  const weapon=weapons[selectedWeapon];

  if(
    !gameActive||
    player.reloading||
    player.ammo>=weapon.maxAmmo
  ){
    return;
  }

  player.reloading=true;
  player.reloadEnd=performance.now()+weapon.reloadTime;

  document.getElementById("reload").style.display="block";
}

function shoot(){
  if(!gameActive||player.reloading)return;

  const weapon=weapons[selectedWeapon];
  const now=performance.now();

  if(now-player.lastShot<weapon.fireRate)return;

  if(player.ammo<=0){
    startReload();
    return;
  }

  player.lastShot=now;
  player.ammo--;

  const shotCount=weapon.pellets||1;

  for(let i=0;i<shotCount;i++){
    const spread=(Math.random()-.5)*weapon.spread;
    const shotAngle=player.angle+spread;

    bullets.push({
      x:player.x,
      y:player.y,
      height:player.z+58,
      vx:Math.cos(shotAngle)*weapon.bulletSpeed,
      vy:Math.sin(shotAngle)*weapon.bulletSpeed,
      life:1.5,
      enemy:false,
      damage:selectedWeapon==="sniper"&&aiming
        ?weapon.scopedDamage
        :weapon.damage,
      color:weapon.color
    });
  }

  spawnParticles(player.x,player.y,weapon.color,4);

  if(player.ammo<=0){
    startReload();
  }

  updateHud();
}

function botShoot(){
  const now=performance.now();

  if(bot.reloading)return;

  if(bot.ammo<=0){
    bot.reloading=true;
    bot.reloadEnd=now+1850;
    return;
  }

  if(now-bot.lastShot<500)return;

  bot.lastShot=now;
  bot.ammo--;

  const dx=player.x-bot.x;
  const dy=(player.y-player.z*.25)-bot.y;
  const length=Math.hypot(dx,dy)||1;
  const shotAngle=Math.atan2(dy,dx)+(Math.random()-.5)*.018;

  bullets.push({
    x:bot.x,
    y:bot.y,
    height:70,
    vx:Math.cos(shotAngle)*BULLET_SPEED,
    vy:Math.sin(shotAngle)*BULLET_SPEED,
    life:1.7,
    enemy:true,
    damage:12,
    color:"#ff45d8"
  });

  spawnParticles(bot.x,bot.y,"#ff45d8",3);

  if(bot.ammo<=0){
    bot.reloading=true;
    bot.reloadEnd=now+1850;
  }
}

function tryMovePlayer(dx,dy){
  const nextX=player.x+dx;
  const nextY=player.y+dy;

  if(!isBlocked(nextX,player.y,PLAYER_RADIUS)){
    player.x=nextX;
  }

  if(!isBlocked(player.x,nextY,PLAYER_RADIUS)){
    player.y=nextY;
  }
}

function updatePlayer(dt){
  const now=performance.now();

  if(player.reloading&&now>=player.reloadEnd){
    player.reloading=false;
    player.ammo=weapons[selectedWeapon].maxAmmo;
    document.getElementById("reload").style.display="none";
  }

  player.vz-=GRAVITY*dt;
  player.z+=player.vz*dt;

  if(player.z<=0){
    player.z=0;
    player.vz=0;
    player.grounded=true;
  }else{
    player.grounded=false;
  }

  let forward=0;
  let side=0;

  if(keys.KeyW||keys.ArrowUp)forward+=1;
  if(keys.KeyS||keys.ArrowDown)forward-=1;
  if(keys.KeyA||keys.ArrowLeft)side-=1;
  if(keys.KeyD||keys.ArrowRight)side+=1;

  const length=Math.hypot(forward,side)||1;

  if(forward!==0||side!==0){
    forward/=length;
    side/=length;

    const dx=(
      Math.cos(player.angle)*forward+
      Math.cos(player.angle+Math.PI/2)*side
    );

    const dy=(
      Math.sin(player.angle)*forward+
      Math.sin(player.angle+Math.PI/2)*side
    );

    const speed=aiming?MOVE_SPEED*.75:MOVE_SPEED;

    tryMovePlayer(
      dx*speed*dt,
      dy*speed*dt
    );
  }

  if(player.dashTime>0){
    player.dashTime-=dt;

    tryMovePlayer(
      player.dashDirX*850*dt,
      player.dashDirY*850*dt
    );
  }
}

function tryMoveBot(dx,dy){
  const directX=bot.x+dx;
  const directY=bot.y+dy;

  if(!isBlocked(directX,bot.y,BOT_RADIUS)){
    bot.x=directX;
  }

  if(!isBlocked(bot.x,directY,BOT_RADIUS)){
    bot.y=directY;
  }

  const moved=Math.hypot(bot.x-bot.lastX,bot.y-bot.lastY);

  if(moved<.5){
    bot.stuckTimer+=1;
  }else{
    bot.stuckTimer=0;
  }

  bot.lastX=bot.x;
  bot.lastY=bot.y;

  if(bot.stuckTimer>16){
    bot.strafeDirection*=-1;
    bot.stuckTimer=0;
  }
}

function updateBot(dt){
  if(!gameActive)return;

  const now=performance.now();

  if(bot.reloading){
    if(now>=bot.reloadEnd){
      bot.reloading=false;
      bot.ammo=30;
    }else{
      const dx=bot.x-player.x;
      const dy=bot.y-player.y;
      const length=Math.hypot(dx,dy)||1;

      tryMoveBot(
        dx/length*BOT_SPEED*.65*dt,
        dy/length*BOT_SPEED*.65*dt
      );

      return;
    }
  }

  const dx=player.x-bot.x;
  const dy=player.y-bot.y;
  const distance=Math.hypot(dx,dy)||1;
  const visible=botCanSeePlayer();

  let moveX=0;
  let moveY=0;

  if(bot.hp<30){
    if(distance<320){
      moveX=-dx/distance;
      moveY=-dy/distance;
    }else{
      bot.strafeTimer-=dt;

      if(bot.strafeTimer<=0){
        bot.strafeTimer=.7+Math.random();
        bot.strafeDirection*=-1;
      }

      moveX=-dy/distance*bot.strafeDirection;
      moveY=dx/distance*bot.strafeDirection;
    }
  }else if(distance>260||!visible){
    moveX=dx/distance;
    moveY=dy/distance;
  }else{
    bot.strafeTimer-=dt;

    if(bot.strafeTimer<=0){
      bot.strafeTimer=.7+Math.random();
      bot.strafeDirection*=-1;
    }

    moveX=-dy/distance*bot.strafeDirection;
    moveY=dx/distance*bot.strafeDirection;
  }

  const speed=bot.hp<30?BOT_SPEED*.8:BOT_SPEED;

  tryMoveBot(
    moveX*speed*dt,
    moveY*speed*dt
  );

  if(visible&&distance<1000){
    botShoot();
  }
}

function projectileHitsWall(bullet){
  for(const block of map.blocks){
    if(
      bullet.x>block.x-block.w/2&&
      bullet.x<block.x+block.w/2&&
      bullet.y>block.y-block.h/2&&
      bullet.y<block.y+block.h/2
    ){
      return true;
    }
  }

  return false;
}

function updateBullets(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const bullet=bullets[i];

    const oldX=bullet.x;
    const oldY=bullet.y;

    bullet.x+=bullet.vx*dt;
    bullet.y+=bullet.vy*dt;
    bullet.life-=dt;

    if(projectileHitsWall(bullet)){
      spawnParticles(bullet.x,bullet.y,bullet.color,4);
      bullets.splice(i,1);
      continue;
    }

    if(bullet.life<=0){
      bullets.splice(i,1);
      continue;
    }

    if(!bullet.enemy){
      const hitDistance=Math.hypot(
        bullet.x-bot.x,
        bullet.y-bot.y
      );

      if(hitDistance<BOT_RADIUS+10){
        bot.hp=Math.max(0,bot.hp-bullet.damage);
        spawnParticles(bot.x,bot.y,"#ff5353",15);
        showHit();
        bullets.splice(i,1);

        if(bot.hp<=0){
          scoreYou++;
          finishRound("you");
        }

        continue;
      }
    }else{
      const targetY=player.y-player.z*.2;
      const hitDistance=Math.hypot(
        bullet.x-player.x,
        bullet.y-targetY
      );

      if(hitDistance<PLAYER_RADIUS+10){
        player.hp=Math.max(0,player.hp-bullet.damage);
        spawnParticles(player.x,player.y,"#ff49d7",12);
        showDamage();
        bullets.splice(i,1);

        if(player.hp<=0){
          scoreBot++;
          finishRound("bot");
        }
      }
    }
  }
}

function finishRound(winner){
  updateHud();

  if(scoreYou>=MAX_SCORE||scoreBot>=MAX_SCORE){
    gameActive=false;

    if(document.pointerLockElement===canvas){
      document.exitPointerLock();
    }

    document.getElementById("end-screen").style.display="flex";

    document.getElementById("result").textContent=
      winner==="you"
        ?`Ты победил: ${scoreYou} : ${scoreBot}`
        :`Бот победил: ${scoreYou} : ${scoreBot}`;

    return;
  }

  gameActive=false;

  setTimeout(()=>{
    if(document.getElementById("end-screen").style.display!=="flex"){
      gameActive=true;
      resetRound();
      lastFrame=performance.now();
      requestAnimationFrame(loop);
    }
  },1100);
}

function spawnParticles(x,y,color,count){
  for(let i=0;i<count;i++){
    particles.push({
      x:x+(Math.random()-.5)*12,
      y:y+(Math.random()-.5)*12,
      vx:(Math.random()-.5)*80,
      vy:(Math.random()-.5)*80,
      life:.2+Math.random()*.25,
      maxLife:.45,
      color
    });
  }
}

function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const particle=particles[i];

    particle.x+=particle.vx*dt;
    particle.y+=particle.vy*dt;
    particle.vx*=.92;
    particle.vy*=.92;
    particle.life-=dt;

    if(particle.life<=0){
      particles.splice(i,1);
    }
  }
}

function showHit(){
  const element=document.getElementById("hit");
  element.style.display="block";

  setTimeout(()=>{
    element.style.display="none";
  },90);
}

function showDamage(){
  const element=document.getElementById("damage");
  element.style.opacity="1";

  setTimeout(()=>{
    element.style.opacity="0";
  },140);
}

function cameraPosition(x,y){
  const dx=x-player.x;
  const dy=y-player.y;

  const forward=
    dx*Math.cos(player.angle)+
    dy*Math.sin(player.angle);

  const side=
    -dx*Math.sin(player.angle)+
    dy*Math.cos(player.angle);

  return{forward,side};
}

function project(x,y,height=0){
  const pos=cameraPosition(x,y);

  if(pos.forward<10)return null;

  const halfWidth=Math.tan(FOV/2)*pos.forward;

  if(Math.abs(pos.side)>halfWidth*1.35){
    return null;
  }

  const screenX=
    canvas.width/2+
    pos.side/halfWidth*canvas.width/2;

  const horizon=
    canvas.height*.53+
    player.pitch*canvas.height*.45;

  const scale=640/pos.forward;

  const screenY=
    horizon-
    height*scale-
    player.z*scale*.18;

  return{
    x:screenX,
    y:screenY,
    scale,
    forward:pos.forward
  };
}

function drawQuad(points,fill,stroke){
  if(points.some(point=>!point))return;

  ctx.fillStyle=fill;
  ctx.strokeStyle=stroke;
  ctx.lineWidth=1.5;

  ctx.beginPath();
  ctx.moveTo(points[0].x,points[0].y);

  for(let i=1;i<points.length;i++){
    ctx.lineTo(points[i].x,points[i].y);
  }

  ctx.closePath();
  ctx.fill();
  ctx.stroke();
}

function drawBlock(block){
  const left=block.x-block.w/2;
  const right=block.x+block.w/2;
  const top=block.y-block.h/2;
  const bottom=block.y+block.h/2;
  const height=block.h;

  const bottomPoints=[
    project(left,top,0),
    project(right,top,0),
    project(right,bottom,0),
    project(left,bottom,0)
  ];

  const topPoints=[
    project(left,top,height),
    project(right,top,height),
    project(right,bottom,height),
    project(left,bottom,height)
  ];

  drawQuad(
    [bottomPoints[0],bottomPoints[1],topPoints[1],topPoints[0]],
    map.wallDark,
    map.wallLight
  );

  drawQuad(
    [bottomPoints[1],bottomPoints[2],topPoints[2],topPoints[1]],
    map.wall,
    map.wallLight
  );

  drawQuad(
    [bottomPoints[2],bottomPoints[3],topPoints[3],topPoints[2]],
    "#3e5c4a",
    map.wallLight
  );

  drawQuad(
    [bottomPoints[3],bottomPoints[0],topPoints[0],topPoints[3]],
    "#587a64",
    map.wallLight
  );

  drawQuad(
    [topPoints[0],topPoints[1],topPoints[2],topPoints[3]],
    "#82b18e",
    map.wallLight
  );
}

function drawFloor(){
  const horizon=
    canvas.height*.53+
    player.pitch*canvas.height*.45;

  ctx.fillStyle=map.sky;
  ctx.fillRect(0,0,canvas.width,horizon);

  ctx.fillStyle=map.floor;
  ctx.fillRect(0,horizon,canvas.width,canvas.height-horizon);

  ctx.strokeStyle="rgba(160,245,180,.12)";
  ctx.lineWidth=1;

  for(let distance=80;distance<1500;distance+=80){
    const y=horizon+640/distance*150;

    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(canvas.width,y);
    ctx.stroke();
  }

  for(let angle=-FOV/2;angle<=FOV/2;angle+=.14){
    const x=
      canvas.width/2+
      Math.tan(angle)/Math.tan(FOV/2)*
      canvas.width/2;

    ctx.beginPath();
    ctx.moveTo(canvas.width/2,horizon);
    ctx.lineTo(x,canvas.height);
    ctx.stroke();
  }
}

function drawBot(){
  if(!playerCanSeeBot())return;

  const p=project(bot.x,bot.y,0);

  if(!p||p.forward>1300)return;

  const size=Math.max(14,p.scale*.95);

  ctx.fillStyle="#d8343d";
  ctx.fillRect(
    p.x-size*.48,
    p.y-size*1.7,
    size*.96,
    size*1.7
  );

  ctx.fillStyle="#ffad91";
  ctx.fillRect(
    p.x-size*.38,
    p.y-size*2.32,
    size*.76,
    size*.62
  );

  ctx.fillStyle="#32171d";
  ctx.fillRect(
    p.x-size*.34,
    p.y-size*2.1,
    size*.68,
    size*.14
  );

  ctx.fillStyle="#242a32";
  ctx.fillRect(
    p.x+size*.42,
    p.y-size*1.15,
    size*.75,
    size*.12
  );
}

function drawBullets(){
  for(const bullet of bullets){
    const p=project(bullet.x,bullet.y,bullet.height);

    if(!p)continue;

    ctx.fillStyle=bullet.color;
    ctx.beginPath();
    ctx.arc(
      p.x,
      p.y,
      Math.max(2,p.scale*.07),
      0,
      Math.PI*2
    );
    ctx.fill();
  }
}

function drawParticles(){
  for(const particle of particles){
    const p=project(particle.x,particle.y,0);

    if(!p)continue;

    ctx.globalAlpha=Math.max(
      0,
      particle.life/particle.maxLife
    );

    ctx.fillStyle=particle.color;

    ctx.beginPath();
    ctx.arc(
      p.x,
      p.y,
      Math.max(1,p.scale*.045),
      0,
      Math.PI*2
    );
    ctx.fill();

    ctx.globalAlpha=1;
  }
}

function drawPlayerModel(){
  const p=project(player.x,player.y,player.z);

  if(!p)return;

  const size=Math.max(15,p.scale*1.1);

  ctx.fillStyle="#42ff70";
  ctx.fillRect(
    p.x-size*.5,
    p.y-size*1.8,
    size,
    size*1.8
  );

  ctx.fillStyle="#baffc5";
  ctx.fillRect(
    p.x-size*.38,
    p.y-size*2.45,
    size*.76,
    size*.62
  );

  ctx.fillStyle="#0b4321";
  ctx.fillRect(
    p.x-size*.3,
    p.y-size*2.23,
    size*.6,
    size*.13
  );
}

function drawWeapon(){
  const weapon=weapons[selectedWeapon];
  const x=canvas.width*.72;
  const y=canvas.height*.78;

  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(aiming?-.02:.08);

  ctx.fillStyle="#20242a";
  ctx.fillRect(
    0,
    0,
    canvas.width*.18,
    canvas.height*.07
  );

  ctx.fillStyle=weapon.color;
  ctx.fillRect(
    canvas.width*.13,
    canvas.height*.015,
    canvas.width*.13,
    canvas.height*.022
  );

  ctx.fillStyle="#111";
  ctx.fillRect(
    canvas.width*.06,
    canvas.height*.06,
    canvas.width*.045,
    canvas.height*.09
  );

  ctx.restore();
}

function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  drawFloor();

  const visibleBlocks=[...map.blocks]
    .sort((a,b)=>{
      const da=Math.hypot(a.x-player.x,a.y-player.y);
      const db=Math.hypot(b.x-player.x,b.y-player.y);
      return db-da;
    });

  for(const block of visibleBlocks){
    drawBlock(block);
  }

  drawBot();
  drawPlayerModel();
  drawBullets();
  drawParticles();
  drawWeapon();

  if(aiming&&selectedWeapon==="sniper"){
    const cx=canvas.width/2;
    const cy=canvas.height/2;

    ctx.strokeStyle="rgba(255,255,255,.85)";
    ctx.lineWidth=1;

    ctx.beginPath();
    ctx.arc(cx,cy,125,0,Math.PI*2);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(cx-160,cy);
    ctx.lineTo(cx+160,cy);
    ctx.moveTo(cx,cy-160);
    ctx.lineTo(cx,cy+160);
    ctx.stroke();
  }
}

function updateHud(){
  const weapon=weapons[selectedWeapon];

  document.getElementById("your-score").textContent=scoreYou;
  document.getElementById("bot-score").textContent=scoreBot;
  document.getElementById("weapon-name").textContent=weapon.name;

  document.getElementById("ammo").textContent=
    `${player.ammo} / ${weapon.maxAmmo}`;

  document.getElementById("player-hp").textContent=
    Math.max(0,Math.ceil(player.hp));

  document.getElementById("enemy-hp").textContent=
    Math.max(0,Math.ceil(bot.hp));

  document.getElementById("player-fill").style.width=
    Math.max(0,player.hp)+"%";

  document.getElementById("enemy-fill").style.width=
    Math.max(0,bot.hp)+"%";

  const left=Math.max(
    0,
    player.dashReady-performance.now()
  );

  const dash=document.getElementById("dash");

  if(player.dashTime>0){
    dash.textContent="РЫВОК!";
    dash.style.color="#ffe85c";
  }else if(left<=0){
    dash.textContent="РЫВОК ГОТОВ — Q";
    dash.style.color="#78ff9b";
  }else{
    dash.textContent=
      `РЫВОК: ${(left/1000).toFixed(1)}с`;
    dash.style.color="#aaa";
  }
}

function loop(now){
  if(!gameActive)return;

  const dt=Math.min((now-lastFrame)/1000,.035);
  lastFrame=now;

  updatePlayer(dt);
  updateBot(dt);
  updateBullets(dt);
  updateParticles(dt);
  updateHud();
  render();

  requestAnimationFrame(loop);
}

updateHud();
render();
</script>
</body>
</html>
