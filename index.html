<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>KArena 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;width:100vw;height:100vh}
#game-container{position:relative;width:100%;height:100%}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
#crosshair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:4px;height:4px;background:#0f0;border-radius:50%}
#hp-bar{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);width:300px;height:20px;background:#222;border:2px solid #0f0}
#hp-fill{height:100%;background:#0f0;transition:width .2s}
#hp-text{position:absolute;bottom:55px;left:50%;transform:translateX(-50%);color:#0f0;font-size:18px;font-weight:bold}
#enemy-hp-bar{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:250px;height:16px;background:#222;border:2px solid #f00}
#enemy-hp-fill{height:100%;background:#f00;transition:width .2s}
#enemy-hp-text{position:absolute;top:-25px;left:50%;transform:translateX(-50%);color:#f00;font-size:16px;font-weight:bold}
#score{position:absolute;top:20px;right:20px;color:#0f0;font-size:24px;font-weight:bold}
#ammo{position:absolute;bottom:30px;right:20px;color:#0f0;font-size:24px;font-weight:bold}
#weapon-name{position:absolute;top:20px;left:20px;color:#0f0;font-size:18px;font-weight:bold}
#dash-indicator{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);color:#0f0;font-size:16px;font-weight:bold}
#start-screen{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:20}
#start-title{font-size:64px;color:#0f0;margin-bottom:40px;text-shadow:0 0 20px #0f0}
#start-btn{background:#0f0;color:#000;border:none;padding:20px 50px;font-size:22px;font-weight:bold;cursor:pointer;font-family:monospace}
#final-screen{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.92);display:none;flex-direction:column;justify-content:center;align-items:center;z-index:20}
#final-title{font-size:48px;font-weight:bold;margin-bottom:30px}
#final-score{font-size:28px;color:#fff;margin-bottom:40px}
#btn-restart{background:#0f0;color:#000;border:none;padding:20px 50px;font-size:22px;font-weight:bold;cursor:pointer;font-family:monospace}
#hit-marker{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:20px;height:20px;display:none}
#hit-marker::before,#hit-marker::after{content:'';position:absolute;background:#f00}
#hit-marker::before{width:20px;height:2px;top:9px;left:0}
#hit-marker::after{width:2px;height:20px;top:0;left:9px}
#damage-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle,transparent 50%,rgba(255,0,0,.4) 100%);opacity:0;transition:opacity .3s;pointer-events:none}
</style>
</head>
<body>
<div id="game-container">
<canvas id="gameCanvas"></canvas>
<div id="hud">
<div id="crosshair"></div>
<div id="hit-marker"></div>
<div id="damage-overlay"></div>
<div id="weapon-name">ПП</div>
<div id="score">0 : 0</div>
<div id="enemy-hp-bar"><div id="enemy-hp-fill" style="width:100%"></div></div>
<div id="enemy-hp-text">БОТ: 100</div>
<div id="hp-text">100</div>
<div id="hp-bar"><div id="hp-fill" style="width:100%"></div></div>
<div id="ammo">70 / 70</div>
<div id="dash-indicator">РЫВОК: Q</div>
</div>
<div id="start-screen">
<div id="start-title">KArena 3D</div>
<button id="start-btn">НАЧАТЬ</button>
</div>
<div id="final-screen">
<div id="final-title"></div>
<div id="final-score"></div>
<button id="btn-restart">ЕЩЁ РАЗ</button>
</div>
</div>
<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');

function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
resizeCanvas();window.addEventListener('resize',resizeCanvas);

let gameActive=false,scoreH=0,scoreC=0;
let player={x:200,y:200,z:0,hp:100,alive:true,ammo:70,reloading:false,reloadEnd:0,dashReady:0,isDashing:false,dashTime:0,dashDx:0,dashDy:0,dashStartX:0,dashStartY:0,yaw:0,pitch:0};
let enemy={x:1000,y:200,z:0,hp:100,alive:true,lastShot:0};
let bullets=[];
let particles=[];
let obstacles=[
  {x:400,y:100,w:100,h:400},
  {x:700,y:300,w:150,h:150},
  {x:500,y:500,w:300,h:100}
];
const WORLD_W=1200,WORLD_H=600;
const DASH_DIST=150,DASH_COOLDOWN=3000,DASH_DURATION=45;
const MAX_HP=100,MAX_AMMO=70;
let keys={};
let mouseX=0,mouseY=0;
let mouseLocked=false;

document.getElementById('start-btn').onclick=()=>{
  document.getElementById('start-screen').style.display='none';
  startGame();
  canvas.requestPointerLock();
};

document.getElementById('btn-restart').onclick=()=>{
  document.getElementById('final-screen').style.display='none';
  startGame();
  canvas.requestPointerLock();
};

canvas.addEventListener('click',()=>{
  if(gameActive)canvas.requestPointerLock();
});

document.addEventListener('pointerlockchange',()=>{
  mouseLocked=document.pointerLockElement===canvas;
});

document.addEventListener('mousemove',e=>{
  if(!gameActive||!mouseLocked)return;
  player.yaw+=e.movementX*0.002;
  player.pitch+=e.movementY*0.002;
  player.pitch=Math.max(-Math.PI/2,Math.min(Math.PI/2,player.pitch));
});

document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='KeyQ'&&gameActive&&player.alive)performDash();
  if(e.code==='KeyF'&&gameActive&&player.alive)shoot();
});

document.addEventListener('keyup',e=>keys[e.code]=false);
canvas.addEventListener('mousedown',()=>{if(gameActive&&player.alive)shoot();});

function startGame(){
  gameActive=true;
  scoreH=0;
  scoreC=0;
  bullets=[];
  particles=[];
  player={x:200,y:200,z:0,hp:MAX_HP,alive:true,ammo:MAX_AMMO,reloading:false,reloadEnd:0,dashReady:0,isDashing:false,dashTime:0,dashDx:0,dashDy:0,dashStartX:200,dashStartY:200,yaw:0,pitch:0};
  enemy={x:1000,y:200,z:0,hp:MAX_HP,alive:true,lastShot:0};
  updateHUD();
  gameLoop();
}

function performDash(){
  const now=Date.now();
  if(now<player.dashReady||player.isDashing)return;
  player.isDashing=true;
  player.dashTime=DASH_DURATION;
  player.dashDx=Math.cos(player.yaw);
  player.dashDy=Math.sin(player.yaw);
  player.dashStartX=player.x;
  player.dashStartY=player.y;
  player.dashReady=now+DASH_COOLDOWN;
  createDashParticles();
}

function createDashParticles(){
  for(let i=0;i<20;i++){
    const angle=player.yaw+(Math.random()-0.5)*1;
    const speed=3+Math.random()*3;
    particles.push({
      x:player.x,
      y:player.y,
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed,
      life:15+Math.random()*10,
      maxLife:25,
      size:2+Math.random()*2,
      color:'#0f0'
    });
  }
}

function shoot(){
  if(!gameActive||!player.alive||player.reloading)return;
  if(player.ammo<=0){startReload();return;}
  player.ammo--;
  const dx=Math.cos(player.yaw)*Math.cos(player.pitch);
  const dy=Math.sin(player.yaw)*Math.cos(player.pitch);
  const dz=Math.sin(player.pitch);
  bullets.push({x:player.x,y:player.y,z:player.z+1.6,dx:dx*50,dy:dy*50,dz:dz*50,life:100});
  if(player.ammo<=0)startReload();
  updateHUD();
}

function startReload(){
  player.reloading=true;
  player.reloadEnd=Date.now()+2000;
  setTimeout(()=>{
    if(gameActive&&player.alive){
      player.ammo=MAX_AMMO;
      player.reloading=false;
      updateHUD();
    }
  },2000);
}

function hitObs(x,y){
  return obstacles.some(o=>x>o.x&&x<o.x+o.w&&y>o.y&&y<o.y+o.h);
}

function canSee(x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1;
  const dist=Math.hypot(dx,dy);
  for(let i=0;i<=20;i++){
    const t=i/20;
    if(hitObs(x1+dx*t,y1+dy*t))return false;
  }
  return true;
}

function botAI(){
  if(!enemy.alive)return;
  const dx=player.x-enemy.x;
  const dy=player.y-enemy.y;
  const dist=Math.hypot(dx,dy);
  if(dist>150){
    enemy.x+=dx/dist*3;
    enemy.y+=dy/dist*3;
  }else if(dist<80){
    enemy.x-=dx/dist*2;
    enemy.y-=dy/dist*2;
  }
  if(canSee(enemy.x,enemy.y,player.x,player.y)&&Date.now()-enemy.lastShot>500){
    enemy.lastShot=Date.now();
    player.hp-=10;
    document.getElementById('damage-overlay').style.opacity=1;
    setTimeout(()=>document.getElementById('damage-overlay').style.opacity=0,300);
    if(player.hp<=0){
      player.alive=false;
      scoreC++;
      setTimeout(()=>{
        if(scoreC<5){
          player.x=200;
          player.y=200;
          player.hp=MAX_HP;
          player.alive=true;
          player.ammo=MAX_AMMO;
        }
      },1500);
      checkWin();
    }
    updateHUD();
  }
}

function updateHUD(){
  document.getElementById('hp-fill').style.width=player.hp+'%';
  document.getElementById('hp-text').textContent=player.hp;
  document.getElementById('enemy-hp-fill').style.width=enemy.hp+'%';
  document.getElementById('enemy-hp-text').textContent='БОТ: '+enemy.hp;
  document.getElementById('ammo').textContent=player.ammo+' / '+MAX_AMMO;
  document.getElementById('score').textContent=scoreH+' : '+scoreC;
  const now=Date.now();
  const dashEl=document.getElementById('dash-indicator');
  if(now>=player.dashReady){
    dashEl.textContent='РЫВОК ГОТОВ (Q)';
    dashEl.style.color='#0f0';
  }else{
    dashEl.textContent='РЫВОК: '+(player.dashReady-now)/1000|0+'с';
    dashEl.style.color='#888';
  }
}

function project(x,y,z){
  const dx=x-player.x;
  const dy=y-player.y;
  const dz=z-player.z;
  const cosYaw=Math.cos(-player.yaw);
  const sinYaw=Math.sin(-player.yaw);
  const cosPitch=Math.cos(-player.pitch);
  const sinPitch=Math.sin(-player.pitch);
  const rx=dx*cosYaw-dy*sinYaw;
  const ry=dx*sinYaw+dy*cosYaw;
  const rz=dz;
  const rx2=rx;
  const ry2=ry*cosPitch-rz*sinPitch;
  const rz2=ry*sinPitch+rz*cosPitch;
  if(rz2<=0.1)return null;
  const fov=500;
  const sx=canvas.width/2+rx2*fov/rz2;
  const sy=canvas.height/2-ry2*fov/rz2;
  const scale=fov/rz2;
  return {x:sx,y:sy,scale:scale};
}

function draw3DLine(x1,y1,z1,x2,y2,z2,color,width=2){
  const p1=project(x1,y1,z1);
  const p2=project(x2,y2,z2);
  if(!p1||!p2)return;
  ctx.strokeStyle=color;
  ctx.lineWidth=width;
  ctx.beginPath();
  ctx.moveTo(p1.x,p1.y);
  ctx.lineTo(p2.x,p2.y);
  ctx.stroke();
}

function draw3DBox(x,y,w,h,color){
  const z1=0,z2=2;
  draw3DLine(x,y,z1,x+w,y,z1,color);
  draw3DLine(x+w,y,z1,x+w,y+h,z1,color);
  draw3DLine(x+w,y+h,z1,x,y+h,z1,color);
  draw3DLine(x,y+h,z1,x,y,z1,color);
  draw3DLine(x,y,z2,x+w,y,z2,color);
  draw3DLine(x+w,y,z2,x+w,y+h,z2,color);
  draw3DLine(x+w,y+h,z2,x,y+h,z2,color);
  draw3DLine(x,y+h,z2,x,y,z2,color);
  draw3DLine(x,y,z1,x,y,z2,color);
  draw3DLine(x+w,y,z1,x+w,y,z2,color);
  draw3DLine(x+w,y+h,z1,x+w,y+h,z2,color);
  draw3DLine(x,y+h,z1,x,y+h,z2,color);
}

function gameLoop(){
  if(!gameActive){requestAnimationFrame(gameLoop);return}
  if(player.isDashing){
    player.dashTime--;
    const progress=1-player.dashTime/DASH_DURATION;
    player.x=player.dashStartX+player.dashDx*DASH_DIST*progress;
    player.y=player.dashStartY+player.dashDy*DASH_DIST*progress;
    if(player.dashTime<=0)player.isDashing=false;
  }else{
    const speed=5;
    let dx=0,dy=0;
    if(keys['KeyW']){dx+=Math.cos(player.yaw)*speed;dy+=Math.sin(player.yaw)*speed;}
    if(keys['KeyS']){dx-=Math.cos(player.yaw)*speed;dy-=Math.sin(player.yaw)*speed;}
    if(keys['KeyA']){dx+=Math.cos(player.yaw-Math.PI/2)*speed;dy+=Math.sin(player.yaw-Math.PI/2)*speed;}
    if(keys['KeyD']){dx+=Math.cos(player.yaw+Math.PI/2)*speed;dy+=Math.sin(player.yaw+Math.PI/2)*speed;}
    if(!hitObs(player.x+dx,player.y))player.x+=dx;
    if(!hitObs(player.x,player.y+dy))player.y+=dy;
  }
  botAI();
  ctx.fillStyle='#111';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle='#333';
  const gridSize=100;
  for(let x=0;x<WORLD_W;x+=gridSize){
    const p1=project(x,0,0);
    const p2=project(x,WORLD_H,0);
    if(p1&&p2){
      ctx.beginPath();
      ctx.moveTo(p1.x,p1.y);
      ctx.lineTo(p2.x,p2.y);
      ctx.stroke();
    }
  }
  for(let y=0;y<WORLD_H;y+=gridSize){
    const p1=project(0,y,0);
    const p2=project(WORLD_W,y,0);
    if(p1&&p2){
      ctx.beginPath();
      ctx.moveTo(p1.x,p1.y);
      ctx.lineTo(p2.x,p2.y);
      ctx.stroke();
    }
  }
  obstacles.forEach(o=>{
    draw3DBox(o.x,o.y,o.w,o.h,'#0f0');
  });
  if(enemy.alive){
    const ep=project(enemy.x,enemy.y,0);
    if(ep&&ep.scale>0){
      ctx.fillStyle='#f00';
      ctx.beginPath();
      ctx.arc(ep.x,ep.y,15*ep.scale/500,0,Math.PI*2);
      ctx.fill();
    }
  }
  bullets.forEach((b,i)=>{
    b.x+=b.dx;
    b.y+=b.dy;
    b.z+=b.dz;
    b.life--;
    if(enemy.alive&&Math.abs(b.x-enemy.x)<20&&Math.abs(b.y-enemy.y)<20&&Math.abs(b.z-enemy.z-1)<20){
      enemy.hp-=10;
      updateHUD();
      document.getElementById('hit-marker').style.display='block';
      setTimeout(()=>document.getElementById('hit-marker').style.display='none',100);
      if(enemy.hp<=0){
        enemy.alive=false;
        scoreH++;
        setTimeout(()=>{
          if(scoreH<5){
            enemy.x=1000;
            enemy.y=200;
            enemy.hp=MAX_HP;
            enemy.alive=true;
          }
        },1500);
        checkWin();
      }
      bullets.splice(i,1);
    }
    if(b.life<=0)bullets.splice(i,1);
  });
  particles.forEach((p,i)=>{
    p.x+=p.vx;
    p.y+=p.vy;
    p.life--;
    if(p.life<=0)particles.splice(i,1);
  });
  updateHUD();
  requestAnimationFrame(gameLoop);
}

function checkWin(){
  if(scoreH>=5){
    gameActive=false;
    document.getElementById('final-title').textContent='🏆 ПОБЕДА!';
    document.getElementById('final-title').style.color='#0f0';
    document.getElementById('final-score').textContent=scoreH+' : '+scoreC;
    document.getElementById('final-screen').style.display='flex';
    document.exitPointerLock();
  }
  if(scoreC>=5){
    gameActive=false;
    document.getElementById('final-title').textContent='💀 ПОРАЖЕНИЕ';
    document.getElementById('final-title').style.color='#f00';
    document.getElementById('final-score').textContent=scoreH+' : '+scoreC;
    document.getElementById('final-screen').style.display='flex';
    document.exitPointerLock();
  }
}
</script>
</body>
</html>
