<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KArena</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  overflow:hidden;
  background:#07111b;
  font-family:Arial,Helvetica,sans-serif;
}

canvas{
  display:block;
}

#start-screen,
#final-screen{
  position:fixed;
  inset:0;
  z-index:30;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:rgba(3,8,14,.94);
  color:#fff;
}

#final-screen{
  display:none;
}

#title{
  margin-bottom:30px;
  font-size:clamp(50px,8vw,90px);
  color:#5dff85;
  font-weight:900;
  letter-spacing:2px;
  text-shadow:0 0 22px rgba(49,255,108,.9);
}

#start-btn,
#restart-btn{
  border:2px solid #63ff8a;
  border-radius:10px;
  padding:16px 34px;
  background:#11251a;
  color:#8cffaa;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
  transition:.15s ease;
}

#start-btn:hover,
#restart-btn:hover{
  transform:translateY(-2px);
  background:#5dff85;
  color:#07150c;
}

#message{
  max-width:500px;
  margin-bottom:25px;
  text-align:center;
  color:#e9f4ff;
  font-size:20px;
  line-height:1.45;
}

#hud{
  position:fixed;
  inset:0;
  z-index:10;
  color:#fff;
  pointer-events:none;
  font-weight:800;
  text-shadow:0 2px 3px #000;
}

#crosshair{
  position:absolute;
  top:50%;
  left:50%;
  width:18px;
  height:18px;
  transform:translate(-50%,-50%);
}

#crosshair::before,
#crosshair::after{
  content:"";
  position:absolute;
  background:#ffffff;
  box-shadow:0 0 5px #000;
}

#crosshair::before{
  left:8px;
  top:0;
  width:2px;
  height:18px;
}

#crosshair::after{
  left:0;
  top:8px;
  width:18px;
  height:2px;
}

#topbar{
  position:absolute;
  top:18px;
  left:50%;
  display:flex;
  gap:14px;
  transform:translateX(-50%);
}

.score{
  min-width:105px;
  padding:10px 20px;
  border:2px solid #57ff81;
  border-radius:8px;
  background:rgba(0,0,0,.42);
  color:#70ff95;
  text-align:center;
  font-size:24px;
}

.score.bot{
  border-color:#ff5858;
  color:#ff7373;
}

#weapon-name{
  position:absolute;
  top:22px;
  left:22px;
  color:#a7ffb5;
  font-size:18px;
}

#ammo{
  position:absolute;
  right:22px;
  bottom:24px;
  color:#a7ffb5;
  font-size:26px;
}

#dash{
  position:absolute;
  bottom:40px;
  left:50%;
  transform:translateX(-50%);
  color:#75ff9b;
}

#reload{
  position:absolute;
  bottom:74px;
  left:50%;
  display:none;
  transform:translateX(-50%);
  color:#ffd25b;
}

#hp-wrap{
  position:absolute;
  bottom:25px;
  left:22px;
  width:290px;
}

#enemy-hp{
  position:absolute;
  top:22px;
  right:22px;
  width:220px;
}

.hp-label{
  margin-bottom:5px;
  font-size:13px;
}

.bar{
  height:18px;
  overflow:hidden;
  border:2px solid #fff;
  border-radius:5px;
  background:rgba(0,0,0,.45);
}

#hp-fill,
#enemy-fill{
  width:100%;
  height:100%;
  transition:width .1s;
}

#hp-fill{
  background:#4eff72;
}

#enemy-fill{
  background:#ff4d4d;
}

#damage{
  position:fixed;
  inset:0;
  z-index:9;
  pointer-events:none;
  opacity:0;
  background:radial-gradient(circle,transparent 45%,rgba(255,0,0,.58) 120%);
  transition:opacity .12s;
}

#hit{
  position:absolute;
  top:50%;
  left:50%;
  display:none;
  transform:translate(-50%,-50%);
  color:#fff;
  font-size:44px;
  text-shadow:0 0 8px #000;
}
</style>
</head>
<body>

<div id="start-screen">
  <div id="title">KArena</div>
  <button id="start-btn">НАЧАТЬ ИГРУ</button>
</div>

<div id="final-screen">
  <div id="title">КОНЕЦ МАТЧА</div>
  <div id="message"></div>
  <button id="restart-btn">ЕЩЁ РАЗ</button>
</div>

<div id="hud">
  <div id="crosshair"></div>
  <div id="damage"></div>
  <div id="hit">✕</div>

  <div id="topbar">
    <div class="score">
      <span id="you-score">0</span><br>
      <small>ТЫ</small>
    </div>

    <div class="score bot">
      <span id="bot-score">0</span><br>
      <small>БОТ</small>
    </div>
  </div>

  <div id="weapon-name">ПП</div>
  <div id="ammo">30 / 30</div>
  <div id="dash">РЫВОК ГОТОВ — Q</div>
  <div id="reload">ПЕРЕЗАРЯДКА...</div>

  <div id="hp-wrap">
    <div class="hp-label">ТЫ: <span id="hp-text">100</span></div>
    <div class="bar"><div id="hp-fill"></div></div>
  </div>

  <div id="enemy-hp">
    <div class="hp-label">БОТ: <span id="enemy-text">100</span></div>
    <div class="bar"><div id="enemy-fill"></div></div>
  </div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js";
import { PointerLockControls } from "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/controls/PointerLockControls.js";

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91d8ff);
scene.fog=new THREE.Fog(0x91d8ff,55,145);

const camera=new THREE.PerspectiveCamera(
  76,
  window.innerWidth/window.innerHeight,
  .1,
  300
);

const controls=new PointerLockControls(camera,renderer.domElement);
const clock=new THREE.Clock();

const keys={};
const colliders=[];
const bullets=[];
const particles=[];

const MAX_HP=100;
const MAX_SCORE=5;
const ARENA_RADIUS=42;
const PLAYER_HEIGHT=1.7;
const PLAYER_RADIUS=.62;
const BOT_RADIUS=.72;
const GRAVITY=23;

let aiming=false;

const weapons={
  sniper:{
    name:"СНАЙПЕРКА",
    damage:50,
    scopedDamage:70,
    maxAmmo:3,
    reload:2200,
    fireRate:850,
    spread:.001,
    speed:75,
    color:0xffd34d
  },

  smg:{
    name:"ПП",
    damage:6,
    maxAmmo:30,
    reload:1700,
    fireRate:95,
    spread:.024,
    speed:48,
    color:0xff4ed8
  },

  shotgun:{
    name:"ДРОБОВИК",
    damage:4,
    maxAmmo:10,
    reload:1800,
    fireRate:720,
    spread:.14,
    pellets:16,
    speed:43,
    color:0xffa54d
  }
};

const weaponOrder=["sniper","smg","shotgun"];

const state={
  active:false,
  selectedWeapon:"smg",
  scoreYou:0,
  scoreBot:0,

  player:{
    hp:MAX_HP,
    ammo:30,
    reloading:false,
    reloadEnd:0,
    lastShot:0,
    dashReady:0,
    dashTime:0,
    dashDirection:new THREE.Vector3(),
    velocityY:0,
    grounded:false
  },

  bot:{
    hp:MAX_HP,
    ammo:30,
    reloading:false,
    reloadEnd:0,
    lastShot:0,
    mesh:null
  }
};

const hemi=new THREE.HemisphereLight(0xdaf3ff,0x24342a,2.25);
scene.add(hemi);

const sun=new THREE.DirectionalLight(0xffffff,2.5);
sun.position.set(-25,45,22);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

const floorMaterial=new THREE.MeshStandardMaterial({
  color:0xdce2e7,
  roughness:.92,
  metalness:.04
});

const wallMaterial=new THREE.MeshStandardMaterial({
  color:0x667a91,
  roughness:.7,
  metalness:.1
});

const blueMaterial=new THREE.MeshStandardMaterial({
  color:0x4ba8ee,
  roughness:.5,
  metalness:.18
});

function addBox(x,y,z,w,h,d,material=wallMaterial,solid=true){
  const mesh=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    material
  );

  mesh.position.set(x,y+h/2,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;

  scene.add(mesh);

  if(solid){
    colliders.push({
      minX:x-w/2,
      maxX:x+w/2,
      minZ:z-d/2,
      maxZ:z+d/2,
      top:y+h
    });
  }

  return mesh;
}

function buildArena(){
  const floor=new THREE.Mesh(
    new THREE.CylinderGeometry(ARENA_RADIUS,ARENA_RADIUS,1,80),
    floorMaterial
  );

  floor.position.y=-.5;
  floor.receiveShadow=true;
  scene.add(floor);

  const rim=new THREE.Mesh(
    new THREE.TorusGeometry(ARENA_RADIUS,.7,10,80),
    new THREE.MeshStandardMaterial({
      color:0x4e6b83,
      roughness:.55
    })
  );

  rim.rotation.x=Math.PI/2;
  rim.position.y=.05;
  scene.add(rim);

  addBox(0,0,0,12,5,12,wallMaterial);
  addBox(-8,0,0,5,3,7,blueMaterial);
  addBox(8,0,0,5,3,7,blueMaterial);
  addBox(0,5,0,5,2.5,5,wallMaterial);

  addBox(0,3.2,-11,4,.7,10,blueMaterial);
  addBox(0,3.2,11,4,.7,10,blueMaterial);
  addBox(-11,2.2,0,10,.7,4,blueMaterial);
  addBox(11,2.2,0,10,.7,4,blueMaterial);

  for(let i=0;i<5;i++){
    addBox(-18+i*2.1,.45+i*.65,-8,2,.45,4,wallMaterial);
    addBox(18-i*2.1,.45+i*.65,8,2,.45,4,wallMaterial);
  }

  addBox(-27,0,-22,9,3,3,wallMaterial);
  addBox(-27,0,22,9,3,3,wallMaterial);
  addBox(27,0,-22,9,3,3,wallMaterial);
  addBox(27,0,22,9,3,3,wallMaterial);

  addBox(-28,0,0,4,4,10,blueMaterial);
  addBox(28,0,0,4,4,10,blueMaterial);

  const covers=[
    [-18,-25],
    [18,-25],
    [-18,25],
    [18,25],
    [-8,-29],
    [8,-29],
    [-8,29],
    [8,29],
    [-32,-10],
    [32,-10],
    [-32,10],
    [32,10]
  ];

  for(const [x,z] of covers){
    addBox(x,0,z,4,2.6,4,wallMaterial);
  }

  for(let i=0;i<8;i++){
    const angle=i*Math.PI/4;
    const x=Math.cos(angle)*35;
    const z=Math.sin(angle)*35;

    const column=new THREE.Mesh(
      new THREE.CylinderGeometry(.7,.9,6,12),
      blueMaterial
    );

    column.position.set(x,3,z);
    column.castShadow=true;
    column.receiveShadow=true;
    scene.add(column);

    colliders.push({
      minX:x-.9,
      maxX:x+.9,
      minZ:z-.9,
      maxZ:z+.9,
      top:6
    });
  }
}

buildArena();

function createBot(){
  const group=new THREE.Group();

  const body=new THREE.Mesh(
    new THREE.BoxGeometry(1.2,1.5,.75),
    new THREE.MeshStandardMaterial({
      color:0xd93434,
      roughness:.55
    })
  );

  body.position.y=1.15;
  body.castShadow=true;
  group.add(body);

  const head=new THREE.Mesh(
    new THREE.BoxGeometry(.85,.85,.85),
    new THREE.MeshStandardMaterial({
      color:0xffa080,
      roughness:.7
    })
  );

  head.position.y=2.3;
  head.castShadow=true;
  group.add(head);

  const visor=new THREE.Mesh(
    new THREE.BoxGeometry(.86,.22,.08),
    new THREE.MeshStandardMaterial({
      color:0x24141a,
      emissive:0x4e0000
    })
  );

  visor.position.set(0,2.38,.44);
  group.add(visor);

  const gun=new THREE.Mesh(
    new THREE.BoxGeometry(.18,.18,1.15),
    new THREE.MeshStandardMaterial({
      color:0x222831,
      metalness:.5,
      roughness:.28
    })
  );

  gun.position.set(.42,1.35,.42);
  gun.rotation.x=-.35;
  group.add(gun);

  scene.add(group);

  return group;
}

state.bot.mesh=createBot();

function createPlayerGun(){
  const group=new THREE.Group();

  const gun=new THREE.Mesh(
    new THREE.BoxGeometry(.2,.2,1.3),
    new THREE.MeshStandardMaterial({
      color:0x222831,
      metalness:.75,
      roughness:.25
    })
  );

  gun.position.set(.42,-.35,-.85);
  gun.rotation.x=-.16;
  group.add(gun);

  const barrel=new THREE.Mesh(
    new THREE.CylinderGeometry(.06,.06,.7,10),
    new THREE.MeshStandardMaterial({
      color:0x111111,
      metalness:.8,
      roughness:.2
    })
  );

  barrel.rotation.x=Math.PI/2;
  barrel.position.set(.42,-.32,-1.55);
  group.add(barrel);

  camera.add(group);
  scene.add(camera);

  return group;
}

const playerGun=createPlayerGun();

function updateGunModel(){
  const gun=playerGun.children[0];

  if(state.selectedWeapon==="sniper"){
    gun.scale.set(1.25,1,1.6);
  }else if(state.selectedWeapon==="shotgun"){
    gun.scale.set(1.15,1,1.15);
  }else{
    gun.scale.set(.9,1,.86);
  }
}

function checkCollision(position,radius,height){
  if(Math.hypot(position.x,position.z)>ARENA_RADIUS-radius-1){
    return true;
  }

  for(const collider of colliders){
    const closestX=Math.max(
      collider.minX,
      Math.min(position.x,collider.maxX)
    );

    const closestZ=Math.max(
      collider.minZ,
      Math.min(position.z,collider.maxZ)
    );

    const dx=position.x-closestX;
    const dz=position.z-closestZ;

    if(
      dx*dx+dz*dz<radius*radius&&
      position.y<collider.top+height
    ){
      return true;
    }
  }

  return false;
}

function groundHeight(position){
  let ground=0;

  for(const collider of colliders){
    const insideX=
      position.x>collider.minX-PLAYER_RADIUS&&
      position.x<collider.maxX+PLAYER_RADIUS;

    const insideZ=
      position.z>collider.minZ-PLAYER_RADIUS&&
      position.z<collider.maxZ+PLAYER_RADIUS;

    if(insideX&&insideZ&&position.y>=collider.top-.45){
      ground=Math.max(ground,collider.top);
    }
  }

  return ground;
}

function spawnPoint(playerSide){
  const points=playerSide
    ?[
      new THREE.Vector3(-32,0,-27),
      new THREE.Vector3(-31,0,27),
      new THREE.Vector3(-24,0,0)
    ]
    :[
      new THREE.Vector3(32,0,27),
      new THREE.Vector3(31,0,-27),
      new THREE.Vector3(24,0,0)
    ];

  return points[Math.floor(Math.random()*points.length)].clone();
}

function resetRound(){
  aiming=false;
  camera.fov=76;
  camera.updateProjectionMatrix();

  const playerSpawn=spawnPoint(true);

  camera.position.set(
    playerSpawn.x,
    PLAYER_HEIGHT,
    playerSpawn.z
  );

  camera.rotation.set(0,0,0);

  state.player.hp=MAX_HP;
  state.player.ammo=weapons[state.selectedWeapon].maxAmmo;
  state.player.reloading=false;
  state.player.reloadEnd=0;
  state.player.velocityY=0;
  state.player.grounded=true;
  state.player.dashTime=0;
  state.player.dashReady=0;

  const botSpawn=spawnPoint(false);

  state.bot.mesh.position.set(botSpawn.x,0,botSpawn.z);
  state.bot.hp=MAX_HP;
  state.bot.ammo=30;
  state.bot.reloading=false;
  state.bot.reloadEnd=0;
  state.bot.lastShot=0;

  updateGunModel();
  updateHud();
}

function startGame(){
  state.selectedWeapon="smg";
  state.scoreYou=0;
  state.scoreBot=0;
  state.active=true;

  document.getElementById("start-screen").style.display="none";
  document.getElementById("final-screen").style.display="none";

  resetRound();

  setTimeout(()=>{
    controls.lock();
  },50);
}

document.getElementById("start-btn").addEventListener("click",startGame);

document.getElementById("restart-btn").addEventListener("click",()=>{
  startGame();
});

renderer.domElement.addEventListener("click",()=>{
  if(state.active&&!controls.isLocked){
    controls.lock();
  }
});

document.addEventListener("keydown",event=>{
  keys[event.code]=true;

  if(event.code==="Space"){
    event.preventDefault();
    jump();
  }

  if(event.code==="KeyQ"){
    dash();
  }

  if(event.code==="KeyR"){
    startReload();
  }
});

document.addEventListener("keyup",event=>{
  keys[event.code]=false;
});

renderer.domElement.addEventListener("contextmenu",event=>{
  event.preventDefault();
});

renderer.domElement.addEventListener("mousedown",event=>{
  if(!state.active)return;

  if(!controls.isLocked){
    controls.lock();
    return;
  }

  if(event.button===0){
    shoot();
  }

  if(event.button===2&&state.selectedWeapon==="sniper"){
    aiming=true;
    camera.fov=35;
    camera.updateProjectionMatrix();
  }
});

renderer.domElement.addEventListener("mouseup",event=>{
  if(event.button===2){
    aiming=false;
    camera.fov=76;
    camera.updateProjectionMatrix();
  }
});

renderer.domElement.addEventListener("wheel",event=>{
  if(!state.active)return;

  event.preventDefault();

  const current=weaponOrder.indexOf(state.selectedWeapon);
  const direction=event.deltaY>0?1:-1;
  const next=(current+direction+weaponOrder.length)%weaponOrder.length;

  state.selectedWeapon=weaponOrder[next];
  state.player.ammo=weapons[state.selectedWeapon].maxAmmo;
  state.player.reloading=false;

  document.getElementById("reload").style.display="none";

  updateGunModel();
  updateHud();
},{passive:false});

function jump(){
  if(
    !state.active||
    !controls.isLocked||
    !state.player.grounded
  ){
    return;
  }

  state.player.velocityY=8.2;
  state.player.grounded=false;

  createParticles(camera.position,0xeef7ff,12);
}

function dash(){
  const now=performance.now();

  if(
    !state.active||
    !controls.isLocked||
    now<state.player.dashReady||
    state.player.dashTime>0
  ){
    return;
  }

  const direction=new THREE.Vector3();

  camera.getWorldDirection(direction);

  direction.y=0;

  if(direction.lengthSq()===0)return;

  direction.normalize();

  state.player.dashDirection.copy(direction);
  state.player.dashTime=.06;
  state.player.dashReady=now+3000;

  createParticles(camera.position,0x49ff7a,28);
}

function startReload(){
  const playerState=state.player;
  const weapon=weapons[state.selectedWeapon];

  if(
    playerState.reloading||
    playerState.ammo>=weapon.maxAmmo
  ){
    return;
  }

  playerState.reloading=true;
  playerState.reloadEnd=performance.now()+weapon.reload;

  document.getElementById("reload").style.display="block";
}

function shoot(){
  const playerState=state.player;
  const weapon=weapons[state.selectedWeapon];
  const now=performance.now();

  if(
    playerState.reloading||
    now-playerState.lastShot<weapon.fireRate
  ){
    return;
  }

  if(playerState.ammo<=0){
    startReload();
    return;
  }

  playerState.lastShot=now;
  playerState.ammo--;

  const count=weapon.pellets||1;

  for(let i=0;i<count;i++){
    const direction=new THREE.Vector3();

    camera.getWorldDirection(direction);

    const spread=weapon.spread*(aiming?.35:1);

    direction.x+=(Math.random()-.5)*spread;
    direction.y+=(Math.random()-.5)*spread;
    direction.z+=(Math.random()-.5)*spread;
    direction.normalize();

    const speed=(
      state.selectedWeapon==="sniper"&&aiming
        ?weapon.speed*1.25
        :weapon.speed
    );

    bullets.push({
      position:camera.position.clone()
        .add(direction.clone().multiplyScalar(.75)),
      velocity:direction.multiplyScalar(speed),
      life:.85,
      damage:(
        state.selectedWeapon==="sniper"&&aiming
          ?weapon.scopedDamage
          :weapon.damage
      ),
      enemy:false,
      color:weapon.color
    });
  }

  createMuzzleFlash(camera.position);

  if(playerState.ammo<=0){
    startReload();
  }

  updateHud();
}

function createMuzzleFlash(position){
  const light=new THREE.PointLight(0xffdf9d,4,8);

  light.position.copy(position);
  scene.add(light);

  setTimeout(()=>{
    scene.remove(light);
  },45);
}

function createParticles(position,color,count){
  for(let i=0;i<count;i++){
    const material=new THREE.MeshBasicMaterial({
      color,
      transparent:true,
      opacity:1
    });

    const particle=new THREE.Mesh(
      new THREE.SphereGeometry(.06+Math.random()*.08,6,6),
      material
    );

    particle.position.copy(position);
    particle.position.y+=Math.random()*.45;

    scene.add(particle);

    particles.push({
      mesh:particle,
      velocity:new THREE.Vector3(
        (Math.random()-.5)*5,
        Math.random()*3,
        (Math.random()-.5)*5
      ),
      life:.25+Math.random()*.35,
      maxLife:.6
    });
  }
}

function showHit(){
  const element=document.getElementById("hit");

  element.style.display="block";

  setTimeout(()=>{
    element.style.display="none";
  },90);
}

function showDamage(){
  const element=document.getElementById("damage");

  element.style.opacity="1";

  setTimeout(()=>{
    element.style.opacity="0";
  },130);
}

function botTakeDamage(damage){
  state.bot.hp=Math.max(0,state.bot.hp-damage);

  createParticles(
    state.bot.mesh.position.clone()
      .add(new THREE.Vector3(0,1.2,0)),
    0xff4d4d,
    18
  );

  showHit();

  if(state.bot.hp<=0){
    state.scoreYou++;
    endRound("you");
  }

  updateHud();
}

function playerTakeDamage(damage){
  state.player.hp=Math.max(0,state.player.hp-damage);

  createParticles(camera.position,0xff4dd2,12);
  showDamage();

  if(state.player.hp<=0){
    state.scoreBot++;
    endRound("bot");
  }

  updateHud();
}

function endRound(winner){
  if(state.scoreYou>=MAX_SCORE||state.scoreBot>=MAX_SCORE){
    state.active=false;

    if(controls.isLocked){
      controls.unlock();
    }

    document.getElementById("final-screen").style.display="flex";

    document.getElementById("message").textContent=
      winner==="you"
        ?`Ты победил: ${state.scoreYou} : ${state.scoreBot}`
        :`Бот победил: ${state.scoreYou} : ${state.scoreBot}`;

    return;
  }

  setTimeout(()=>{
    if(state.active){
      resetRound();
    }
  },1300);
}

function tryBotMove(delta){
  const bot=state.bot.mesh;

  const direct=bot.position.clone().add(delta);
  direct.y=0;

  if(!checkCollision(direct,BOT_RADIUS,2.4)){
    bot.position.copy(direct);
    return;
  }

  const side=new THREE.Vector3(-delta.z,0,delta.x);

  if(side.lengthSq()===0)return;

  side.normalize().multiplyScalar(delta.length());

  const left=bot.position.clone().add(side);
  left.y=0;

  if(!checkCollision(left,BOT_RADIUS,2.4)){
    bot.position.copy(left);
    return;
  }

  const right=bot.position.clone().sub(side);
  right.y=0;

  if(!checkCollision(right,BOT_RADIUS,2.4)){
    bot.position.copy(right);
  }
}

function hasLineOfSight(from,to){
  const direction=to.clone().sub(from);
  const distance=direction.length();

  if(distance<=0)return true;

  direction.normalize();

  const ray=new THREE.Raycaster(
    from.clone().add(new THREE.Vector3(0,1.1,0)),
    direction,
    0,
    distance
  );

  const meshes=[];

  scene.traverse(object=>{
    if(
      object.isMesh&&
      object.parent!==camera&&
      object.parent!==state.bot.mesh
    ){
      meshes.push(object);
    }
  });

  return ray.intersectObjects(meshes,false).length===0;
}

function botShoot(){
  const bot=state.bot;
  const now=performance.now();

  if(bot.reloading)return;

  if(bot.ammo<=0){
    bot.reloading=true;
    bot.reloadEnd=now+2000;
    return;
  }

  bot.lastShot=now;
  bot.ammo--;

  const origin=bot.mesh.position.clone()
    .add(new THREE.Vector3(0,1.45,0));

  const target=camera.position.clone();

  const direction=target.sub(origin).normalize();

  direction.x+=(Math.random()-.5)*.02;
  direction.y+=(Math.random()-.5)*.01;
  direction.z+=(Math.random()-.5)*.02;
  direction.normalize();

  bullets.push({
    position:origin,
    velocity:direction.multiplyScalar(39),
    life:.9,
    damage:12,
    enemy:true,
    color:0xff4dd2
  });

  if(bot.ammo<=0){
    bot.reloading=true;
    bot.reloadEnd=now+2000;
  }
}

function botUpdate(deltaTime){
  if(!state.active)return;

  const bot=state.bot;
  const mesh=bot.mesh;
  const now=performance.now();

  const playerPosition=camera.position.clone();
  playerPosition.y=0;

  const toPlayer=playerPosition.clone().sub(mesh.position);
  toPlayer.y=0;

  const distance=toPlayer.length();

  if(bot.reloading){
    if(now>=bot.reloadEnd){
      bot.reloading=false;
      bot.ammo=30;
    }else{
      const retreat=mesh.position.clone().sub(playerPosition);

      if(retreat.lengthSq()>0){
        retreat.normalize();
        tryBotMove(retreat.multiplyScalar(4.1*deltaTime));
      }

      return;
    }
  }

  const movement=new THREE.Vector3();

  if(bot.hp<30){
    if(distance<15){
      movement.copy(mesh.position).sub(playerPosition);

      if(movement.lengthSq()>0){
        movement.normalize();
      }
    }else{
      movement.set(
        Math.sin(now*.002)*.35,
        0,
        Math.cos(now*.002)*.35
      );
    }
  }else if(distance>10){
    movement.copy(toPlayer);

    if(movement.lengthSq()>0){
      movement.normalize();
    }
  }else{
    movement.set(-toPlayer.z,0,toPlayer.x);

    if(movement.lengthSq()>0){
      movement.normalize();
    }

    if(Math.sin(now*.003)<0){
      movement.multiplyScalar(-1);
    }
  }

  tryBotMove(movement.multiplyScalar(4.2*deltaTime));

  mesh.lookAt(playerPosition.x,mesh.position.y,playerPosition.z);

  if(
    distance<34&&
    now-bot.lastShot>350&&
    hasLineOfSight(mesh.position,playerPosition)
  ){
    botShoot();
  }
}

function updatePlayer(deltaTime){
  const playerState=state.player;
  const position=camera.position;

  if(
    playerState.reloading&&
    performance.now()>=playerState.reloadEnd
  ){
    playerState.reloading=false;
    playerState.ammo=weapons[state.selectedWeapon].maxAmmo;

    document.getElementById("reload").style.display="none";
  }

  const ground=groundHeight(position);

  playerState.velocityY-=GRAVITY*deltaTime;
  position.y+=playerState.velocityY*deltaTime;

  if(position.y<=ground+PLAYER_HEIGHT){
    position.y=ground+PLAYER_HEIGHT;
    playerState.velocityY=0;
    playerState.grounded=true;
  }else{
    playerState.grounded=false;
  }

  const movement=new THREE.Vector3();

  if(keys.KeyW||keys.ArrowUp)movement.z-=1;
  if(keys.KeyS||keys.ArrowDown)movement.z+=1;
  if(keys.KeyA||keys.ArrowLeft)movement.x-=1;
  if(keys.KeyD||keys.ArrowRight)movement.x+=1;

  if(movement.lengthSq()>0){
    movement.normalize();
    movement.applyAxisAngle(
      new THREE.Vector3(0,1,0),
      camera.rotation.y
    );
  }

  if(playerState.dashTime>0){
    playerState.dashTime-=deltaTime;

    movement.copy(playerState.dashDirection)
      .multiplyScalar(95*deltaTime);
  }else{
    movement.multiplyScalar((aiming?5.2:8)*deltaTime);
  }

  const nextX=position.clone();
  nextX.x+=movement.x;

  if(!checkCollision(nextX,PLAYER_RADIUS,PLAYER_HEIGHT)){
    position.x=nextX.x;
  }

  const nextZ=position.clone();
  nextZ.z+=movement.z;

  if(!checkCollision(nextZ,PLAYER_RADIUS,PLAYER_HEIGHT)){
    position.z=nextZ.z;
  }
}

function makeTrail(start,end,color){
  const length=start.distanceTo(end);

  if(length<=0)return;

  const mesh=new THREE.Mesh(
    new THREE.CylinderGeometry(.025,.025,length,6),
    new THREE.MeshBasicMaterial({color})
  );

  mesh.position.copy(start).lerp(end,.5);

  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0,1,0),
    end.clone().sub(start).normalize()
  );

  scene.add(mesh);

  setTimeout(()=>{
    scene.remove(mesh);
    mesh.geometry.dispose();
    mesh.material.dispose();
  },32);
}

function updateBullets(deltaTime){
  for(let i=bullets.length-1;i>=0;i--){
    const bullet=bullets[i];
    const previous=bullet.position.clone();

    bullet.position.addScaledVector(bullet.velocity,deltaTime);
    bullet.life-=deltaTime;

    makeTrail(previous,bullet.position,bullet.color);

    if(!bullet.enemy){
      const target=state.bot.mesh.position.clone()
        .add(new THREE.Vector3(0,1.2,0));

      if(bullet.position.distanceTo(target)<1.05){
        botTakeDamage(bullet.damage);
        bullets.splice(i,1);
        continue;
      }
    }else if(bullet.position.distanceTo(camera.position)<.9){
      playerTakeDamage(bullet.damage);
      bullets.splice(i,1);
      continue;
    }

    if(
      bullet.life<=0||
      checkCollision(bullet.position,.05,.1)
    ){
      bullets.splice(i,1);
    }
  }
}

function updateParticles(deltaTime){
  for(let i=particles.length-1;i>=0;i--){
    const particle=particles[i];

    particle.mesh.position.addScaledVector(
      particle.velocity,
      deltaTime
    );

    particle.velocity.y-=8*deltaTime;
    particle.life-=deltaTime;

    particle.mesh.material.opacity=Math.max(
      0,
      particle.life/particle.maxLife
    );

    if(particle.life<=0){
      scene.remove(particle.mesh);
      particle.mesh.geometry.dispose();
      particle.mesh.material.dispose();
      particles.splice(i,1);
    }
  }
}

function updateHud(){
  const playerState=state.player;
  const bot=state.bot;
  const weapon=weapons[state.selectedWeapon];

  document.getElementById("you-score").textContent=state.scoreYou;
  document.getElementById("bot-score").textContent=state.scoreBot;

  document.getElementById("hp-text").textContent=Math.ceil(
    Math.max(0,playerState.hp)
  );

  document.getElementById("enemy-text").textContent=Math.ceil(
    Math.max(0,bot.hp)
  );

  document.getElementById("hp-fill").style.width=
    Math.max(0,playerState.hp)+"%";

  document.getElementById("enemy-fill").style.width=
    Math.max(0,bot.hp)+"%";

  document.getElementById("weapon-name").textContent=weapon.name;

  document.getElementById("ammo").textContent=
    `${playerState.ammo} / ${weapon.maxAmmo}`;

  const dash=document.getElementById("dash");
  const left=Math.max(0,playerState.dashReady-performance.now());

  if(playerState.dashTime>0){
    dash.textContent="РЫВОК!";
    dash.style.color="#ffe85c";
  }else if(left<=0){
    dash.textContent="РЫВОК ГОТОВ — Q";
    dash.style.color="#75ff9b";
  }else{
    dash.textContent=`РЫВОК: ${(left/1000).toFixed(1)}с`;
    dash.style.color="#a0a0a0";
  }
}

function animate(){
  requestAnimationFrame(animate);

  const deltaTime=Math.min(clock.getDelta(),.035);

  if(state.active&&controls.isLocked){
    updatePlayer(deltaTime);
    botUpdate(deltaTime);
    updateBullets(deltaTime);
    updateParticles(deltaTime);
    updateHud();
  }

  renderer.render(scene,camera);
}

animate();

window.addEventListener("resize",()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
